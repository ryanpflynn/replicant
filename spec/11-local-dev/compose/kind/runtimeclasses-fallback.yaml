# Degraded RuntimeClasses: Replicant names exist (so WS-09's VAP, which allows only replicant-* class names,
# admits the pods), but the handler is runc. Labelled so runner-api reports `isolation` honestly
# (values-local-kind `isolation.degraded`) and the UI shows "isolation degraded (local)".
# Applied for all three names when Kata is unavailable; for replicant-kata-fc and replicant-gvisor always
# (replicant-gvisor uses runsc only with REPLICANT_GVISOR=on, see bootstrap.sh).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: replicant-kata-clh
  labels: {replicant.example.com/isolation-degraded: "true"}
handler: runc
scheduling:
  nodeSelector: {replicant.example.com/sandbox: "true"}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: replicant-kata-fc
  labels: {replicant.example.com/isolation-degraded: "true"}
handler: runc
scheduling:
  nodeSelector: {replicant.example.com/sandbox: "true"}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: replicant-gvisor
  labels: {replicant.example.com/isolation-degraded: "true"}
handler: runc
scheduling:
  nodeSelector: {replicant.example.com/sandbox: "true"}
