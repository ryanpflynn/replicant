      SLACK_SIGNING_SECRET_FILE: /run/secrets/slack_signing_secret
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
      # Bolt for Python honors a custom Web API base URL; the mock implements the subset used.
      SLACK_API_URL: http://slack-mock:8410/api/
    secrets: [db_svc_slack_integration, slack_signing_secret, slack_bot_token]
