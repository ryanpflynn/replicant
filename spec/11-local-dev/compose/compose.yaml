# Replicant local stack (WS-11). Lives in the monorepo at dev/compose/compose.yaml.
# Start it with `replicant dev up` (or `make up`), never by hand-editing this file per developer.
#
# Profiles
#   core           control plane, workers, Temporal, replicant Postgres, Langfuse (prompt store, ADR-11-005),
#                  IdP stub, Gitea, Slack mock, replicant-gateway-shim (WS-03, local backends), run-grant
#                  JWKS/revocation (run-grants), runner-local, repo-mirror, ecosystem stubs + Zoekt, egress
#                  proxy and package mirrors
#   s3-seaweedfs   the local S3 server (default; `replicant dev up` always adds it unless --s3 minio)
#   observability  Grafana, Loki, Tempo, Prometheus, Alloy (Langfuse is already in core)
#   k8s            kind cluster provisioner with the real AgentRun CRD, controller, runner-api, run-notifier
#   ramp           a second replicant-worker deployment version (walkthrough 8)
#   github-dev     Cloudflare quick tunnel for the dev GitHub App (walkthrough 11; ADR-07-004)
#   chaos          toxiproxy; use with -f compose.chaos.yaml, which points clients at it (test-strategy.md §7)
#   s3-minio       MinIO built from source, serving as `s3.replicant.localhost` instead of SeaweedFS (ADR-11-004)
#
# Contract versions this file targets: C-ARCH 2.0.0, C-STATE 2.0.0, C-IDS 2.0.0, C-RUNNER 3.0.0,
# C-CRD 3.0.0, C-MSG 2.0.0, C-JOBREQ 2.0.0, C-DEF 3.0.0, C-ART 2.0.0, C-PG 2.0.0.
#
# Conventions
#   * Every browser-facing service listens in-container on the same port it publishes, and carries
#     the network alias <name>.replicant.localhost. `*.localhost` resolves to loopback in browsers, and
#     the alias resolves to the container inside the stack, so OIDC issuers, presigned S3 URLs and
#     Gitea clone URLs are identical inside and outside containers.
#   * Host ports bind to 127.0.0.1 only.
#   * Every image is pinned to an exact version. Replicant images are built from the monorepo.
#   * No service connects to replicant Postgres except through its own svc_<service> role, and no
#     walkthrough step opens a database connection (D-26).

name: replicant

x-replicant-build-args: &replicant-build-args
  REPLICANT_BUILD_ID: ${REPLICANT_WORKER_BUILD_ID:-b20261024-000000000000}
  REPLICANT_GIT_SHA: ${REPLICANT_GIT_SHA:-000000000000}

x-common-env: &common-env
  REPLICANT_ENV: local
  REPLICANT_ORG: local
  REPLICANT_REGION: local-1
  REPLICANT_LOG_FORMAT: json
  REPLICANT_TEMPORAL_ADDRESS: temporal:7233
  REPLICANT_TEMPORAL_NAMESPACE: replicant-local
  REPLICANT_TEMPORAL_TLS: "false"
  REPLICANT_TEMPORAL_CODEC_KEY_FILE: /run/secrets/temporal_codec_key
  REPLICANT_S3_ENDPOINT: http://s3.replicant.localhost:8333
  REPLICANT_S3_PUBLIC_ENDPOINT: http://s3.replicant.localhost:8333
  REPLICANT_S3_REGION: us-east-1
  REPLICANT_S3_FORCE_PATH_STYLE: "true"
  REPLICANT_S3_SSE_MODE: sse-s3
  REPLICANT_SCHEMA_REVISION_CHECK: strict
  REPLICANT_OIDC_ISSUER: http://dex.replicant.localhost:5556/dex
  REPLICANT_LANGFUSE_HOST: http://langfuse.replicant.localhost:3000
  REPLICANT_LANGFUSE_PUBLIC_KEY: pk-lf-replicant-local
  REPLICANT_LANGFUSE_SECRET_KEY_FILE: /run/secrets/langfuse_secret_key
  REPLICANT_IDENTITY_URL: http://identity-service:8080
  REPLICANT_CONTROL_PLANE_URL: http://control-plane-api:8401
  REPLICANT_MEMORY_URL: http://memory-service:8080
  REPLICANT_TOKEN_BROKER_URL: http://github-token-broker:8080
  # Kill switches (C-MSG 2.0.0 ops.kill_switch, C-ART 2.0.0 ops bucket): the out-of-band mirror that intake, the
  # Publisher and runner.start_run (ops.read_kill_switches) read when Postgres is down. Same key as prod, in the
  # local S3 store; control-plane-api is the only writer (XD-FIX-R2-016-WS07). Prod also mirrors to a ConfigMap.
  REPLICANT_KILL_SWITCH_MIRROR: s3://local-replicant-local-ops/kill-switches/v1/state.json
  # S3 credentials for replicant services. Locally one identity `replicant-services` (parity.md P-41); prod uses one
  # IAM role per service (Pod Identity). INI file rendered by `replicant dev up`.
  AWS_SHARED_CREDENTIALS_FILE: /run/secrets/s3_services_credentials
  AWS_CONFIG_FILE: /dev/null
  OTEL_SDK_DISABLED: ${REPLICANT_OTEL_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: parentbased_always_on

x-run-token-verifier-env: &run-token-verifier-env
  # Runner JWKS and issuers: runner-local and, in the k8s profile, the kind runner-api (R1-258).
  REPLICANT_RUN_TOKEN_ISSUERS: http://runner-local:8480,http://runner-api.replicant-runner.svc:8480
  REPLICANT_RUN_TOKEN_JWKS_URLS: http://runner-local:8490/.well-known/jwks.json,http://replicant-local-control-plane:30490/.well-known/jwks.json
  # Core run-grant JWKS and revocation list (served by run-grants; prod host grants.<env>.replicant.internal).
  REPLICANT_RUN_GRANT_ISSUER: replicant-local-core
  REPLICANT_RUN_GRANT_JWKS_URL: http://grants.replicant.localhost:8403/.well-known/jwks.json
  REPLICANT_RUN_GRANT_REVOCATION_URL: http://grants.replicant.localhost:8403/grants/revoked
  REPLICANT_RUN_GRANT_REVOCATION_POLL_SECONDS: "60"
  # Exec revocation feed (C-RUNNER 3.0.0 GET /v1/revocations, CCR-02-09): polled every 10 s from runner-local and,
  # in the k8s profile, the kind runner-api; a listed run_id is rejected even if its token is unexpired.
  REPLICANT_EXEC_REVOCATIONS_URLS: http://runner-local:8480/v1/revocations,http://replicant-local-control-plane:30480/v1/revocations
  REPLICANT_EXEC_REVOCATIONS_TOKEN_FILE: /run/secrets/runner_revocations_token
  REPLICANT_EXEC_REVOCATIONS_POLL_SECONDS: "10"

x-run-grant-signer-env: &run-grant-signer-env
  # The Runner-call activity signs RunSpec.run_grant (C-RUNNER 3.0.0). Prod: KMS key class `run-grant`.
  REPLICANT_RUN_GRANT_SIGNER: file
  REPLICANT_RUN_GRANT_KEY_FILE: /run/secrets/run_grant_signing_key
  REPLICANT_RUN_GRANT_KID: rg-local-1
  REPLICANT_RUN_GRANT_ISSUER: replicant-local-core

x-python-service: &python-service
  restart: unless-stopped
  networks: [core]
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}

x-requires-db: &requires-db
  migrate:
    condition: service_completed_successfully
  s3-init:
    condition: service_completed_successfully

x-requires-db-temporal: &requires-db-temporal
  migrate:
    condition: service_completed_successfully
  s3-init:
    condition: service_completed_successfully
  temporal-bootstrap:
    condition: service_completed_successfully

x-http-healthcheck: &http-healthcheck
  test: ["CMD", "python", "-c", "import sys,urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  # ---------------------------------------------------------------------------------------------
  # Stores
  # ---------------------------------------------------------------------------------------------
  postgres-replicant:
    profiles: [core]
    # Prod parity (XD-10-03): pgvector 0.8.2 (the Aurora version) plus pgaudit. Built from
    # dev/postgres-replicant/Dockerfile: FROM pgvector/pgvector:0.8.2-pg17-bookworm + postgresql-17-pgaudit.
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/postgres:17-pgvector0.8.2
    build: {context: "${REPLICANT_REPO_ROOT:-../..}/dev/postgres-replicant"}
    restart: unless-stopped
    networks: [core]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_replicant_superuser
      POSTGRES_DB: replicant
      REPLICANT_MIGRATOR_PASSWORD_FILE: /run/secrets/db_replicant_migrator
    secrets: [pg_replicant_superuser, db_replicant_migrator]
    volumes:
      - pg-replicant-data:/var/lib/postgresql/data
      # WS-10 files, unmodified (postgres.md §10): fake RDS roles, then the production bootstrap SQL.
      - "${REPLICANT_REPO_ROOT:-../..}/libs/python/replicant-db/bootstrap/00-fake-rds-roles.sql:/docker-entrypoint-initdb.d/00-fake-rds-roles.sql:ro"
      - "${REPLICANT_REPO_ROOT:-../..}/libs/python/replicant-db/bootstrap/00-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro"
      - ./config/postgres-replicant/02-migrator-password.sh:/docker-entrypoint-initdb.d/02-migrator-password.sh:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements,pgaudit", "-c", "pgaudit.log=ddl,role", "-c", "max_connections=300", "-c", "log_min_duration_statement=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d replicant"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres-temporal:
    profiles: [core]
    image: postgres:16.14
    restart: unless-stopped
    networks: [core]
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${REPLICANT_PG_TEMPORAL_PASSWORD:-temporal-local}
    volumes: [pg-temporal-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 3s
      timeout: 3s
      retries: 40

  postgres-langfuse:
    profiles: [core]
    image: postgres:17.6
    restart: unless-stopped
    networks: [core]
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${REPLICANT_PG_LANGFUSE_PASSWORD:-langfuse-local}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes: [pg-langfuse-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 3s
      timeout: 3s
      retries: 40

  s3:
    profiles: [s3-seaweedfs]
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks:
      core:
        aliases: [s3.replicant.localhost]
    command:
      - server
      - -dir=/data
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -s3.allowDeleteBucketNotEmpty=false
    volumes:
      - s3-data:/data
      # Rendered by `replicant dev up` from config/s3/*.json.tmpl with the generated keys.
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/generated/s3.json:/etc/seaweedfs/s3.json:ro
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/generated/iam.json:/etc/seaweedfs/iam.json:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  s3-init:
    profiles: [core]
    image: amazon/aws-cli:2.37.8
    networks: [core]
    depends_on:
      # Exactly one S3 server profile is active (s3-seaweedfs by default, or s3-minio); both are optional
      # here so either satisfies the dependency. init.sh also waits for s3.replicant.localhost:8333.
      s3: {condition: service_healthy, required: false}
      s3-minio: {condition: service_healthy, required: false}
    environment:
      AWS_ACCESS_KEY_ID: replicant-admin
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_admin_secret
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://s3.replicant.localhost:8333
      LANGFUSE_S3_SECRET: ${REPLICANT_S3_LANGFUSE_SECRET:-langfuse-local-secret}
      REPLICANT_ORG: local
      REPLICANT_ENV: local
    secrets: [s3_admin_secret]
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./config/s3/init.sh:/init/init.sh:ro
      # WS-10's generated local bucket configs (object-storage.md §8), applied with plain S3 API calls.
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/s3/local:/init/s3-local:ro"
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # Temporal (full server on PostgreSQL 16, same persistence plugin and SQL visibility as prod; ADR-11-001)
  # ---------------------------------------------------------------------------------------------
  temporal-schema:
    profiles: [core]
    image: temporalio/admin-tools:1.32.1
    networks: [core]
    depends_on:
      postgres-temporal: {condition: service_healthy}
    environment:
      POSTGRES_SEEDS: postgres-temporal
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      SQL_PASSWORD: ${REPLICANT_PG_TEMPORAL_PASSWORD:-temporal-local}
    entrypoint: ["/bin/sh", "/scripts/setup-schema.sh"]
    volumes: [./config/temporal/setup-schema.sh:/scripts/setup-schema.sh:ro]
    restart: "no"

  temporal:
    profiles: [core]
    image: temporalio/server:1.32.1
    restart: unless-stopped
    networks: [core]
    depends_on:
      temporal-schema: {condition: service_completed_successfully}
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres-temporal
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${REPLICANT_PG_TEMPORAL_PASSWORD:-temporal-local}
      BIND_ON_IP: 0.0.0.0
      NUM_HISTORY_SHARDS: "4"
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/replicant-local.yaml
      PROMETHEUS_ENDPOINT: 0.0.0.0:9090
      SERVICES: frontend,history,matching,worker
    volumes: [./config/temporal/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/replicant-local.yaml:ro]
    ports: ["127.0.0.1:7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 20s

  temporal-bootstrap:
    profiles: [core]
    image: temporalio/admin-tools:1.32.1
    networks: [core]
    depends_on:
      temporal: {condition: service_healthy}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      REPLICANT_TEMPORAL_NAMESPACE: replicant-local
      REPLICANT_NAMESPACE_RETENTION: 30d
    entrypoint: ["/bin/sh", "/scripts/bootstrap.sh"]
    volumes: [./config/temporal/bootstrap.sh:/scripts/bootstrap.sh:ro]
    restart: "no"

  temporal-ui:
    profiles: [core]
    image: temporalio/ui:2.55.0
    restart: unless-stopped
    networks:
      core:
        aliases: [temporal.replicant.localhost]
    depends_on:
      temporal-bootstrap: {condition: service_completed_successfully}
      dex: {condition: service_healthy}
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: "8233"
      TEMPORAL_DEFAULT_NAMESPACE: replicant-local
      TEMPORAL_CODEC_ENDPOINT: http://codec.replicant.localhost:8402
      TEMPORAL_CODEC_PASS_ACCESS_TOKEN: "true"
      TEMPORAL_AUTH_ENABLED: "true"
      TEMPORAL_AUTH_TYPE: oidc
      TEMPORAL_AUTH_PROVIDER_URL: http://dex.replicant.localhost:5556/dex
      TEMPORAL_AUTH_ISSUER_URL: http://dex.replicant.localhost:5556/dex
      TEMPORAL_AUTH_CLIENT_ID: temporal-ui
      TEMPORAL_AUTH_CLIENT_SECRET: temporal-ui-local-secret
      TEMPORAL_AUTH_CALLBACK_URL: http://temporal.replicant.localhost:8233/auth/sso/callback
      TEMPORAL_AUTH_SCOPES: openid,profile,email,groups
      TEMPORAL_CORS_ORIGINS: http://temporal.replicant.localhost:8233
      TEMPORAL_DISABLE_NEWS_FETCH: "true"
      TEMPORAL_NOTIFY_ON_NEW_VERSION: "false"
    ports: ["127.0.0.1:8233:8233"]

  temporal-codec-server:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/temporal-codec-server:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: services/temporal-codec-server/Dockerfile, args: *replicant-build-args}
    networks:
      core:
        aliases: [codec.replicant.localhost]
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8402"
      REPLICANT_CODEC_CORS_ORIGINS: http://temporal.replicant.localhost:8233
      REPLICANT_CODEC_REQUIRE_GROUP: replicant-operators
      # Each decode is audited through control-plane-api POST /internal/v1/audit/events; refused if that fails (CCR-01-11).
      REPLICANT_CODEC_AUDIT_URL: http://control-plane-api:8401/internal/v1/audit/events
    secrets: [temporal_codec_key]
    ports: ["127.0.0.1:8402:8402"]

  # ---------------------------------------------------------------------------------------------
  # Database migration (D-26). One-shot; every replicant service waits for it.
  # ---------------------------------------------------------------------------------------------
  migrate:
    profiles: [core]
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/migrate:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: libs/python/replicant-db/Dockerfile.migrate, args: *replicant-build-args}
    networks: [core]
    depends_on:
      postgres-replicant: {condition: service_healthy}
    environment:
      REPLICANT_ENV: local
      REPLICANT_DB_HOST: postgres-replicant
      REPLICANT_DB_NAME: replicant
      REPLICANT_DB_USER: replicant_migrator
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_replicant_migrator
      REPLICANT_DB_ROLE_PASSWORDS_DIR: /run/secrets
      REPLICANT_MIGRATE_LOCK_TIMEOUT_SECONDS: "120"
    # `replicant-db migrate` = take advisory lock, apply roles/grants (WS-10), alembic upgrade head,
    # verify no model/schema drift, record the run in ops.migration_runs, release lock.
    command: ["replicant-db", "migrate", "--to", "head", "--advisory-lock", "--verify-drift", "--ensure-roles"]
    secrets:
      - db_replicant_migrator
      - db_svc_control_plane_api
      - db_svc_identity_service
      - db_svc_github_integration
      - db_svc_slack_integration
      - db_svc_replicant_projector
      - db_svc_memory_service
      - db_svc_ecosystem_indexer
      - db_svc_context_mcp
      - db_svc_usage_ingestor
      - db_svc_eval_worker
      - db_svc_replicant_worker
      - db_svc_publisher_worker
      - db_svc_github_token_broker
      - db_svc_retention_sweeper
      - db_grafana_ro
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # Identity: stub IdP (Dex; ADR-11-003)
  # ---------------------------------------------------------------------------------------------
  dex:
    profiles: [core]
    image: dexidp/dex:v2.46.0
    restart: unless-stopped
    networks:
      core:
        aliases: [dex.replicant.localhost]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      # Third-party images that cannot read *_FILE secrets get them from the generated .env; `replicant dev up`
      # writes the same value to secrets/oidc_replicant_web for control-plane-api.
      DEX_REPLICANT_WEB_SECRET: ${REPLICANT_OIDC_WEB_SECRET:-replicant-web-local-secret}
    volumes: [./config/dex/config.yaml:/etc/dex/config.yaml:ro]
    ports: ["127.0.0.1:5556:5556"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5558/healthz/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ---------------------------------------------------------------------------------------------
  # Control plane and integrations
  # ---------------------------------------------------------------------------------------------
  control-plane-api:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/control-plane-api:${REPLICANT_IMAGE_TAG:-dev}
    # `dev` build target: the only difference from prod is package replicant_dev_auth (seed authenticator and
    # /v1/admin/dev/** routes), excluded from prod images at build time (WS-07 identity.md §9.3 L-1).
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: services/control-plane-api/Dockerfile, target: dev, args: *replicant-build-args}
    networks:
      core:
        aliases: [api.replicant.localhost]
    depends_on:
      <<: *requires-db-temporal
      dex: {condition: service_healthy}
      langfuse-web: {condition: service_healthy}
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8401"
      REPLICANT_DB_DSN: postgresql+psycopg://svc_control_plane_api@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_control_plane_api
      REPLICANT_OIDC_CLIENT_ID: replicant-web
      REPLICANT_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_replicant_web
      REPLICANT_OIDC_CLI_CLIENT_ID: replicant-cli
      REPLICANT_OIDC_REDIRECT_URI: http://app.replicant.localhost:8400/auth/callback
      REPLICANT_ADMIN_GROUP: replicant-admins
      REPLICANT_OPERATOR_GROUP: replicant-operators
      REPLICANT_WEB_ORIGIN: http://app.replicant.localhost:8400
      REPLICANT_DEV_SEED_TOKEN_FILE: /run/secrets/dev_seed_token   # honored only when REPLICANT_ENV=local
      REPLICANT_RUNNER_DEFAULT: ${REPLICANT_RUNNER:-local}
      REPLICANT_KILL_SWITCH_MIRROR_WRITE: "true"     # sole writer of ops kill-switches/v1/state.json (If-Match / If-None-Match)
      REPLICANT_GATEWAY_SHIM_URL: http://gateway-shim:8420      # POST /internal/v1/revocations on cancel/takeover
      REPLICANT_GATEWAY_SERVICE_TOKEN_FILE: /run/secrets/gateway_service_token
      # Local-only static callers of /internal/v1/** (token -> principal, e.g. svc_replicant-gateway-shim); prod verifies
      # projected ServiceAccount tokens (identity.md E24). Honored only when REPLICANT_ENV=local (XD-W3-R1V-067).
      REPLICANT_INTERNAL_CALLER_TOKENS_FILE: /run/secrets/control_plane_internal_callers
    secrets: [db_svc_control_plane_api, oidc_replicant_web, temporal_codec_key, langfuse_secret_key, dev_seed_token, gateway_service_token, s3_services_credentials, control_plane_internal_callers]
    ports: ["127.0.0.1:8401:8401"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8401/readyz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  run-grants:
    # Core run-grant JWKS and revocation list (C-RUNNER 3.0.0, WS-07 architecture.md §2.7): the separate minimal
    # ASGI app in the control-plane-api image. Locally it publishes the public half of the file signer key that
    # replicant-worker and eval-worker sign RunSpec.run_grant with (prod: KMS key class `run-grant`).
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/control-plane-api:${REPLICANT_IMAGE_TAG:-dev}
    networks:
      core:
        aliases: [grants.replicant.localhost]
    depends_on:
      control-plane-api: {condition: service_healthy}
    command: ["control-plane-api", "serve-grants", "--port", "8403"]
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8403"
      REPLICANT_DB_DSN: postgresql+psycopg://svc_control_plane_api@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_control_plane_api
      REPLICANT_RUN_GRANT_JWKS_SOURCE: file                  # prod: kms (GetPublicKey on the run-grant key aliases)
      REPLICANT_RUN_GRANT_JWKS_FILE: /etc/replicant/run-grant-jwks.json
    secrets: [db_svc_control_plane_api]
    volumes:
      # Generated by `replicant dev up` from secrets/run_grant_signing_key (public key only, kid rg-local-1).
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/generated/run-grant-jwks.json:/etc/replicant/run-grant-jwks.json:ro
    ports: ["127.0.0.1:8403:8403"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8403/.well-known/jwks.json',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  control-plane-web:
    profiles: [core]
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/control-plane-web:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: web/control-plane-web/Dockerfile, args: *replicant-build-args}
    restart: unless-stopped
    networks:
      core:
        aliases: [app.replicant.localhost]
    depends_on:
      control-plane-api: {condition: service_healthy}
    environment:
      NGINX_PORT: "8400"
      REPLICANT_API_UPSTREAM: http://control-plane-api:8401
    ports: ["127.0.0.1:8400:8400"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8400/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  identity-service:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/identity-service:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: services/identity-service/Dockerfile, target: dev, args: *replicant-build-args}
    depends_on:
      <<: *requires-db
      github-token-broker: {condition: service_healthy}
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8080"
      REPLICANT_DB_DSN: postgresql+psycopg://svc_identity_service@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_identity_service
      REPLICANT_SCIM_BEARER_TOKEN_FILE: /run/secrets/scim_token
      REPLICANT_ADMIN_GROUP: replicant-admins
      # Repo permission checks go live to the SCM through the broker: Gitea locally, GitHub for the dev app.
      REPLICANT_SCM_PROVIDERS: gitea,github
      REPLICANT_GITEA_BASE_URL: http://git.replicant.localhost:3300
    secrets: [db_svc_identity_service, scim_token]
    healthcheck: *http-healthcheck

  github-integration:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/github-integration:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: services/github-integration/Dockerfile, args: *replicant-build-args}
    depends_on:
      <<: *requires-db-temporal
      github-token-broker: {condition: service_healthy}
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8080"
      REPLICANT_DB_DSN: postgresql+psycopg://svc_github_integration@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_github_integration
      # Two webhook routes (WS-07 G-9): /github/webhook (dev GitHub App via the Cloudflare quick tunnel,
      # X-Hub-Signature-256 over the raw body) and /webhooks/gitea (local Gitea, normalized by the gitea adapter).
      REPLICANT_GITEA_WEBHOOK_SECRET_FILE: /run/secrets/gitea_webhook_secret
      REPLICANT_GITHUB_APP_REGISTRATION: dev
      # The dev App webhook secret is read from `replicant secret-agent` (keyring-backed; WS-07 github-app.md §5.3)
      # over a Unix socket, never from a file or env var. Absent until `replicant dev github-app create`.
      REPLICANT_SECRET_AGENT_SOCKET: /run/replicant-secret-agent/agent.sock
      REPLICANT_GITHUB_WEBHOOK_SECRET_REF: secret-agent:replicant-dev/github-app/webhook_secret
      REPLICANT_GITEA_BASE_URL: http://git.replicant.localhost:3300
      REPLICANT_REPLICANT_BOT_LOGINS: replicant-bot
    secrets: [db_svc_github_integration, gitea_webhook_secret, s3_services_credentials]
    volumes:
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/secret-agent:/run/replicant-secret-agent
    healthcheck: *http-healthcheck

  github-token-broker:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/github-token-broker:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: services/github-token-broker/Dockerfile, args: *replicant-build-args}
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8080"
      REPLICANT_BROKER_CALLERS_FILE: /etc/replicant/broker-callers.yaml
      # Provider backends: `gitea` mints scoped Gitea access tokens for the replicant-bot user and deletes
      # them after REPLICANT_BROKER_GITEA_TOKEN_TTL (Gitea tokens have no expiry; parity.md P-12).
      # `github` uses the dev App private key when present (walkthrough 11).
      REPLICANT_BROKER_GITEA_BASE_URL: http://git.replicant.localhost:3300
      REPLICANT_BROKER_GITEA_BOT_USER: replicant-bot
      REPLICANT_BROKER_GITEA_BOT_PASSWORD_FILE: /run/secrets/gitea_bot_password
      REPLICANT_BROKER_GITEA_TOKEN_TTL: 3600s
      # Dev App private key: read through `replicant secret-agent` (keyring), so the PEM never lands in a compose
      # file, env var or secret file (WS-07 github-app.md §5.3). Prod: KMS key alias/replicant/<env>/github-app.
      REPLICANT_SECRET_AGENT_SOCKET: /run/replicant-secret-agent/agent.sock
      REPLICANT_BROKER_GITHUB_APP_KEY_REF: secret-agent:replicant-dev/github-app/pem
      REPLICANT_BROKER_GITHUB_APP_ENV_FILE: /etc/replicant/github-app.env       # non-secret: app id, slug, client id
      # audit.emit and the C-PG rule-8 startup revision check (WS-10 postgres.md §3.2: login svc_github_token_broker).
      REPLICANT_DB_DSN: postgresql+psycopg://svc_github_token_broker@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_github_token_broker
    secrets: [gitea_bot_password, db_svc_github_token_broker]
    volumes:
      - ./config/github-token-broker/broker-callers.yaml:/etc/replicant/broker-callers.yaml:ro
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/secret-agent:/run/replicant-secret-agent
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/github-app.env:/etc/replicant/github-app.env:ro
    healthcheck: *http-healthcheck

  slack-integration:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/slack-integration:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: services/slack-integration/Dockerfile, args: *replicant-build-args}
