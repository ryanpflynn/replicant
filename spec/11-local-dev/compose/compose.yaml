  # ---------------------------------------------------------------------------------------------
  # Workers (Temporal)
  # ---------------------------------------------------------------------------------------------
  replicant-worker:
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/replicant-worker:${REPLICANT_WORKER_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: workers/replicant-worker/Dockerfile, args: *replicant-build-args}
    depends_on:
      <<: *requires-db-temporal
      memory-service: {condition: service_healthy}
      langfuse-web: {condition: service_healthy}
    environment:
      <<: [*common-env, *run-grant-signer-env]
      REPLICANT_WORKER_DEPLOYMENT_NAME: replicant-worker
      REPLICANT_WORKER_BUILD_ID: ${REPLICANT_WORKER_BUILD_ID:-b20261024-000000000000}
      REPLICANT_WORKER_SET_CURRENT_ON_START: "true"     # local only; CI/Argo do this in prod (parity.md P-07)
      # Task queues are fixed by the worker code (WS-01 reference worker.py): replicant-jobs, replicant-runner-calls,
      # replicant-llm-calls. No env var selects them (R1-267).
      REPLICANT_DB_DSN: postgresql+psycopg://svc_replicant_worker@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_replicant_worker
      # Runner selection: `local` -> runner-local; `k8s` -> runner-api in kind (walkthrough 10).
      REPLICANT_RUNNER_URL: ${REPLICANT_RUNNER_URL:-http://runner-local:8480}
      REPLICANT_RUNNER_TOKEN_FILE: /run/secrets/runner_worker_token   # static dev key (C-RUNNER: local profile)
      REPLICANT_GATEWAY_URL: http://gateway-shim:8420      # in-worker LLM calls and PUT /internal/v1/runs/{id}/policy
      REPLICANT_GATEWAY_SERVICE_TOKEN_FILE: /run/secrets/gateway_service_token
      # Replay cassette set for e2e/walkthrough runs (gateway-stub.md §3); empty = none (passthrough/record).
      REPLICANT_GATEWAY_CASSETTE_SET: ${REPLICANT_GATEWAY_CASSETTE_SET:-}
      # Deterministic runs (WS-03 run plan `effective.deterministic`, XD-11-09): on whenever a cassette set is replayed.
      REPLICANT_DETERMINISTIC_RUNS: ${REPLICANT_DETERMINISTIC_RUNS:-false}
      REPLICANT_CONTEXT_MCP_URL: http://context-mcp:8080
    secrets: [db_svc_replicant_worker, runner_worker_token, gateway_service_token, temporal_codec_key, langfuse_secret_key, run_grant_signing_key, s3_services_credentials]
    healthcheck:
      test: ["CMD", "replicant-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  replicant-worker-next:
    profiles: [ramp]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/replicant-worker:${REPLICANT_WORKER_NEXT_IMAGE_TAG:-next}
    depends_on:
      replicant-worker: {condition: service_healthy}
