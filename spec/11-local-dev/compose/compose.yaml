    # Polls replicant-ops (C-IDS 2.0.0): LeakPurge (WS-08) and other operational workflows. WS-01 hosts it.
    profiles: [core]
    <<: *python-service
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/ops-worker:${REPLICANT_IMAGE_TAG:-dev}
