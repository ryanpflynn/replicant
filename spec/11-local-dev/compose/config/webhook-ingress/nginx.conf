# The only origin the Cloudflare quick tunnel reaches (ADR-07-004): POST /github/webhook to github-integration.
# The raw body is passed through unchanged so X-Hub-Signature-256 verifies exactly as in production.
worker_processes 1;
events { worker_connections 256; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 26m;               # GitHub caps webhook payloads at 25 MB
  proxy_request_buffering off;
  access_log /dev/stdout;
  server {
    listen 8088;
    location = /github/webhook {
      limit_except POST { deny all; }
      set $u http://github-integration:8080;
      proxy_pass $u;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
  }
}
