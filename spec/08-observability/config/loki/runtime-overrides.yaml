# Loki runtime overrides (per tenant), reloaded every 30 s. Owner WS-08. Tenants per ADR-002.
overrides:
  platform:
    ingestion_rate_mb: 12
    ingestion_burst_size_mb: 24
    max_global_streams_per_user: 20000
    retention_period: 720h            # 30 d
    retention_stream:
      - selector: '{level="error"}'
        priority: 1
        period: 2160h                 # 90 d for errors
      - selector: '{source="k8s-events"}'
        priority: 2
        period: 336h                  # 14 d
  sandbox:
    # A sandbox log flood must never starve platform logs: separate tenant, separate rate limit.
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 30
    per_stream_rate_limit: 1MB
    per_stream_rate_limit_burst: 5MB
    max_global_streams_per_user: 30000
    retention_period: 720h            # 30 d; the 90 d system of record is the S3 transcripts bucket (C-ART)
    max_line_size: 64KB
  audit:
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 8
    retention_period: 9600h           # 400 d searchable mirror; Postgres audit schema and S3 audit exports are 7 y
    deletion_mode: disabled           # audit lines carry no free text (audit.md section 3); never deleted early
