# Helm values for chart grafana-community/grafana 14.0.1 (repo https://grafana-community.github.io/helm-charts;
# app Grafana OSS 13.2.4). The legacy grafana/grafana chart stops at 10.5.x / Grafana 12.3. Owner WS-08. Core cluster, namespace observability.
# Rendered with `helm template` against the chart on 2026-10-24 (platform.md section 3.5).
replicas: 2
image:
  tag: 13.2.4
podDisruptionBudget:
  minAvailable: 1
nodeSelector:
  replicant.example.com/pool: platform
envFromSecrets:
  - name: grafana-secrets            # GF_AUTH_OKTA_CLIENT_SECRET, GF_DATABASE_PASSWORD, REPLICANT_GRAFANA_RO_PASSWORD
grafana.ini:
  server:
    root_url: https://grafana.prod.replicant.internal
    enable_gzip: true
  database:
    # HA needs a shared database (MySQL or Postgres). Database "grafana" on the Aurora cluster "langfuse-<env>"
    # (WS-10 XD-FIX-R1-235), never on "replicant" (C-PG section 1).
    type: postgres
    host: langfuse-prod.cluster-cxyz.us-east-1.rds.amazonaws.com:5432
    name: grafana
    user: grafana_app
    ssl_mode: verify-full
  security:
    disable_initial_admin_creation: true
    cookie_secure: true
    cookie_samesite: strict
    content_security_policy: true
  users:
    allow_sign_up: false
    auto_assign_org: false
  auth:
    disable_login_form: true
    oauth_auto_login: true
  auth.okta:
    enabled: true
    name: Okta
    icon: okta
    client_id: 0oa9replicantgrafana
    scopes: openid profile email groups
    auth_url: https://acme.okta.com/oauth2/v1/authorize
    token_url: https://acme.okta.com/oauth2/v1/token
    api_url: https://acme.okta.com/oauth2/v1/userinfo
    allowed_groups: replicant-operators replicant-admins replicant-sre replicant-security replicant-users
    groups_attribute_path: groups
    role_attribute_strict: true
    # Org 1 "Replicant Operations": full data sources. Org 2 "Replicant Tenants": metrics only (ADR-002).
    org_mapping: >-
      replicant-admins:1:Admin replicant-sre:1:Editor replicant-operators:1:Editor replicant-security:1:Viewer
      replicant-users:2:Viewer replicant-operators:2:Viewer replicant-admins:2:Viewer
    role_attribute_path: contains(groups[*], 'replicant-admins') && 'Admin' || contains(groups[*], 'replicant-sre') && 'Editor' || 'Viewer'
    use_pkce: true
    skip_org_role_sync: false
  unified_alerting:
    # Alert rules live in the Mimir and Loki rulers; Grafana only renders them. HA peers via the headless service.
    enabled: true
    ha_peers: grafana-headless.observability.svc.cluster.local:9094
    ha_listen_address: ${POD_IP}:9094
    ha_advertise_address: ${POD_IP}:9094
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  feature_toggles:
    enable: correlations
  log:
    mode: console
  log.console:
    format: json
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources: []                  # provisioned from config/grafana/datasources.yaml (mounted below)
extraConfigmapMounts:
  - name: replicant-datasources
    mountPath: /etc/grafana/provisioning/datasources/replicant.yaml
    subPath: replicant.yaml
    configMap: grafana-replicant-datasources
    readOnly: true
