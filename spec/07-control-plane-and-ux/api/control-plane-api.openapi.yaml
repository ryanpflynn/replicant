openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Replicant control-plane API
  version: 1.0.0
  summary: Public API for the replicant UI and CLI, plus internal endpoints for channel adapters (WS-07).
  description: "Owner WS-07. Implements C-JOBREQ intake, the human-action senders of C-MSG (Updates through an outbox),\nread models of C-STATE\
    \ §2, release and registry operations (C-DEF §4), admin operations that replace\ndatabase access (D-26), and admin-only memory management\
    \ (D-25, proxied to memory-service).\n\nRelease mutations (bundle build, promotion transitions, assignment ramp/overrides/rollback, revoke,\n\
    ReleasePipeline start/sign-off/abort/hold, eval runs) are specified by WS-06 in\nspec/06-releases-and-evals/api/releases.openapi.yaml and\
    \ implemented by this service; the two documents are\nmerged at build time (paths are disjoint). This document adds the UI read aggregations\
    \ (bundle list with\nfailure series, worker versions), per-bundle migration offers, and worker-version operations.\n\n* Every operation declares\
    \ `x-replicant-permission` (identity.md §5). The server refuses to start if an\n  operation lacks it. Authorization is evaluated per request\
    \ (no cached grants).\n* Errors are `application/problem+json` (RFC 9457) with `code`, `request_id`, and, on 403, `audit_id`.\n* Mutations\
    \ require `Idempotency-Key` (sf-string; a client-generated ULID for UI/CLI). Human actions return\n  the Update result synchronously when\
    \ available, or `202 {state: recording}` while the outbox retries.\n* Job-scoped reads return 404 (not 403) when the caller may not see the\
    \ job, so existence is not leaked.\n* Read responses carry `X-Replicant-Projection-Seq` and `X-Replicant-Projection-Lag-Seconds`.\n"
servers:
- url: https://replicant.acme.example.com/api
  description: production (same host as the SPA; cookies are first-party)
- url: http://localhost:8080/api
  description: local stack (replicant dev up)
security:
- session: []
- bearer: []
tags:
- name: auth
- name: me
- name: jobs
- name: actions
- name: approvals
- name: stream
- name: releases
- name: registry
- name: tenants
- name: cost
- name: memory-admin
  description: D-25. replicant-admins only. Proxied to memory-service, which re-checks.
- name: admin
- name: internal
  description: Service-to-service (channel adapters, identity-service). SA token auth.
paths:
  /auth/login:
    get:
      tags:
      - auth
      operationId: login
      summary: Start the Okta OIDC authorization code + PKCE flow (BFF)
      security: []
      x-replicant-permission: public
      parameters:
      - name: return_to
        in: query
        schema:
          type: string
          maxLength: 512
          pattern: ^/
      responses:
        '302':
          description: Redirect to Okta authorize endpoint
  /auth/callback:
    get:
      tags:
      - auth
      operationId: authCallback
      summary: OIDC redirect URI. Creates the session cookie.
      security: []
      x-replicant-permission: public
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to return_to with Set-Cookie __Host-replicant_session
        '400':
          $ref: common-components.yaml#/components/responses/Problem
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      x-replicant-permission: authenticated
      responses:
        '204':
          description: Session revoked
  /v1/auth/token:
    post:
      tags:
      - auth
      operationId: exchangeCiToken
      summary: Exchange a GitHub Actions OIDC token for a short-lived replicant service token (svc_config-publisher)
      security: []
      x-replicant-permission: public
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - grant_type
              - subject_token
              - subject_token_type
              properties:
                grant_type:
                  const: urn:ietf:params:oauth:grant-type:token-exchange
                subject_token:
                  type: string
                subject_token_type:
                  const: urn:ietf:params:oauth:token-type:jwt
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                required:
                - access_token
                - expires_in
                - token_type
                properties:
                  access_token:
                    type: string
                  expires_in:
                    type: integer
                    maximum: 900
                  token_type:
                    const: Bearer
        '401':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/me:
    get:
      tags:
      - me
      operationId: getMe
      x-replicant-permission: authenticated
      responses:
        '200':
          description: Current principal, tenants, roles, capabilities, link status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
  /v1/me/delegations:
    get:
      tags:
      - me
      operationId: listDelegations
      x-replicant-permission: authenticated
      responses:
        '200':
          description: Delegations from and to the caller
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Delegation'
    post:
      tags:
      - me
      operationId: createDelegation
      x-replicant-permission: gate:delegate
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '422':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/me/delegations/{delegation_id}:
    delete:
      tags:
      - me
      operationId: endDelegation
      x-replicant-permission: gate:delegate
      parameters:
      - name: delegation_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^dlg_[0-9a-hjkmnp-tv-z]{26}$
      responses:
        '204':
          description: Ended
  /v1/me/notification-preferences:
    get:
      tags:
      - me
      operationId: getNotificationPreferences
      x-replicant-permission: authenticated
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
    put:
      tags:
      - me
      operationId: putNotificationPreferences
      x-replicant-permission: authenticated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationPreferences'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPreferences'
  /v1/jobs:
    post:
      tags:
      - jobs
      operationId: createJob
      summary: Submit a JobRequest (C-JOBREQ). 201 new job, 200 existing job for the same (tenant_id, dedupe_key).
      x-replicant-permission: job:create
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../00-contracts/job-request.schema.json
      responses:
        '201':
          description: Job created and workflow started (or start pending)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        '200':
          description: Duplicate trigger; existing job returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCreated'
        '400':
          $ref: common-components.yaml#/components/responses/Problem
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '422':
          $ref: common-components.yaml#/components/responses/Problem
        '429':
          $ref: common-components.yaml#/components/responses/Problem
    get:
      tags:
      - jobs
      operationId: listJobs
      x-replicant-permission: job:read
      parameters:
      - name: tenant_id
        in: query
        schema:
          $ref: common-components.yaml#/components/schemas/TenantId
      - name: q
        in: query
        description: 'Query language: status:open repo:ledger-* requester:me bundle:rb_… workflow:bugfix phase:qa'
        schema:
          type: string
          maxLength: 500
      - name: status
        in: query
        schema:
          type: array
          items:
            $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/job_status
        style: form
        explode: false
      - name: view
        in: query
        schema:
          type: string
          enum:
          - all
          - mine
          - needs_human
          - running
          - pr_review
          - failed_24h
      - name: include_evaluation
        in: query
        description: 'Include eval and shadow jobs (JobSnapshot.evaluation, C-MSG 1.2.0). Default false: they are excluded from lists, counts,
          inboxes and cost views except where explicitly requested'
        schema:
          type: string
          enum:
          - 'false'
          - eval
          - shadow
          - all
          default: 'false'
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - updated_desc
          - created_desc
          - cost_desc
          - waiting_since_asc
          default: updated_desc
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of jobs
          headers:
            X-Replicant-Projection-Lag-Seconds:
              $ref: '#/components/headers/ProjectionLag'
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobSummary'
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /v1/jobs/{job_id}:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - jobs
      operationId: getJob
      x-replicant-permission: job:read
      responses:
        '200':
          description: Job detail from the projection (JobSnapshot plus joined cost and links)
          headers:
            X-Replicant-Projection-Seq:
              $ref: '#/components/headers/ProjectionSeq'
            X-Replicant-Projection-Lag-Seconds:
              $ref: '#/components/headers/ProjectionLag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}/timeline:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - jobs
      operationId: getJobTimeline
      x-replicant-permission: job:read
      parameters:
      - name: after_seq
        in: query
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Timeline events ordered by seq
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                      - $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/TimelineEvent
                      - type: object
                        required:
                        - seq
                        properties:
                          seq:
                            type: integer
                            minimum: 1
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}/runs:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - jobs
      operationId: listJobRuns
      x-replicant-permission: job:read
      responses:
        '200':
          description: Runs (RunView plus run-result outcome and cost)
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunRow'
  /v1/jobs/{job_id}/runs/{run_id}/live:
    parameters:
    - $ref: '#/components/parameters/JobId'
    - name: run_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^run_[0-9a-hjkmnp-tv-z]{26}$
    get:
      tags:
      - stream
      operationId: tailRunTranscript
      summary: Live transcript tail (SSE) proxied from Loki for a running run (C-STATE §2 exception 2). Redacted content only.
      x-replicant-permission: job:read
      responses:
        '200':
          description: text/event-stream of transcript lines
          content:
            text/event-stream:
              schema:
                type: string
  /v1/jobs/{job_id}/artifacts:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - jobs
      operationId: listJobArtifacts
      x-replicant-permission: job:read
      responses:
        '200':
          description: Artifact index (from jobs_read.job_artifacts; logical refs, no bodies)
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ArtifactRow'
  /v1/jobs/{job_id}/artifacts/{artifact_id}:presign:
    parameters:
    - $ref: '#/components/parameters/JobId'
    - name: artifact_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^art_[0-9a-hjkmnp-tv-z]{26}$
    post:
      tags:
      - jobs
      operationId: presignArtifact
      summary: Presigned GET (15 min). Audited. raw-restricted types are refused except workspace_archive to the principal who passed takeover
        authorization (audited job.takeover_archive_presigned, XD-FIX-R2-026) (C-ART §5).
      x-replicant-permission: artifact:download
      responses:
        '200':
          description: URL
          content:
            application/json:
              schema:
                type: object
                required:
                - url
                - expires_at
                properties:
                  url:
                    type: string
                    format: uri
                  expires_at:
                    type: string
                    format: date-time
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}/memory:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      tags:
      - jobs
      operationId: getJobMemoryUsed
      summary: Read-only Memory used panel (D-25 non-admin view, R1-099). Proxies memory-service GET /internal/v1/jobs/{job_id}/memory with viewer_repo_access
        computed from the viewer live repo permissions; no score bands or ranking internals for non-admins.
      x-replicant-permission: job:read
      responses:
        '200':
          description: Entries that influenced the job
          content:
            application/json:
              schema:
                $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/schemas/JobMemoryView
        '404': &id005
          $ref: common-components.yaml#/components/responses/Problem
      x-proxy-to: GET memory-service /internal/v1/jobs/{job_id}/memory
  /v1/jobs/{job_id}/steering:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      tags:
      - actions
      operationId: steerJob
      summary: Send Update job.steer (Update ID = message_id)
      x-replicant-permission: job:control:own|job:control:any
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - message_id
              - text
              - delivery
              properties:
                message_id:
                  type: string
                  pattern: ^msg_[0-9a-hjkmnp-tv-z]{26}$
                text:
                  type: string
                  minLength: 1
                  maxLength: 16000
                delivery:
                  type: string
                  enum:
                  - auto
                  - next_node
                  - live_only
                  default: auto
      responses:
        '200':
          description: Update result
          content:
            application/json:
              schema:
                $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/JobSteerResult
        '202':
          $ref: '#/components/responses/Recording'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
        '409':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}:cancel:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      tags:
      - actions
      operationId: cancelJob
      x-replicant-permission: job:control:own|job:control:any
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/JobControl'
      responses:
        '200':
          $ref: '#/components/responses/ControlResult'
        '202':
          $ref: '#/components/responses/Recording'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}:pause:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      tags:
      - actions
      operationId: pauseJob
      x-replicant-permission: job:control:own|job:control:any
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/JobControl'
      responses:
        '200':
          $ref: '#/components/responses/ControlResult'
        '202':
          $ref: '#/components/responses/Recording'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
        '409':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}:resume:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      tags:
      - actions
      operationId: resumeJob
      x-replicant-permission: job:control:own|job:control:any
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/JobControl'
      responses:
        '200':
          $ref: '#/components/responses/ControlResult'
        '202':
          $ref: '#/components/responses/Recording'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}:takeover:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      tags:
      - actions
      operationId: takeoverJob
      x-replicant-permission: job:control:own|job:control:any
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        $ref: '#/components/requestBodies/JobControl'
      responses:
        '200':
          $ref: '#/components/responses/ControlResult'
        '202':
          $ref: '#/components/responses/Recording'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/jobs/{job_id}/takeover/{takeover_id}:
    parameters:
    - $ref: '#/components/parameters/JobId'
    - name: takeover_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^tko_[0-9a-hjkmnp-tv-z]{26}$
    get:
      tags:
      - jobs
      operationId: getTakeoverPackage
      summary: The takeover package (branch, workspace archive, transcripts, plan, handoff) with ready-to-run commands
      x-replicant-permission: job:read
      responses:
        '200':
          description: Package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TakeoverPackage'
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/approvals:
    get:
      tags:
      - approvals
      operationId: listInbox
      summary: Open gates the caller may decide (eligible, delegated, team) plus recently decided
      x-replicant-permission: authenticated
      parameters:
      - name: view
        in: query
        schema:
          type: string
          enum:
          - mine
          - teams
          - delegated
          - decided
          - release_signoffs
          default: mine
      - name: repo
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: gate_kind
        in: query
        schema:
          type: array
          items:
            type: string
        style: form
        explode: false
      - name: risk
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - low
            - medium
            - high
            - critical
        style: form
        explode: false
      - name: requester
        in: query
        schema:
          type: string
      - name: expires_within_hours
        in: query
        schema:
          type: integer
          minimum: 1
      - name: group_by
        in: query
        schema:
          type: string
          enum:
          - none
          - repo
          - job
          default: none
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - expiry
          - age
          - risk
          - repo
          default: expiry
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Inbox page
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                - counts
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/InboxItem'
                  counts:
                    type: object
                    properties:
                      mine:
                        type: integer
                      teams:
                        type: integer
                      delegated:
                        type: integer
                  next_cursor:
                    type:
                    - string
                    - 'null'
  /v1/gates/{gate_id}:
    parameters:
    - $ref: '#/components/parameters/GateId'
    get:
      tags:
      - approvals
      operationId: getGate
      summary: Gate view plus resolved packet (from the projection; the digest is re-confirmed with Query job.open_gates when rendering decision
        controls)
      x-replicant-permission: job:read
      responses:
        '200':
          description: Gate and packet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateDetail'
        '404':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/gates/{gate_id}/decisions:
    parameters:
    - $ref: '#/components/parameters/GateId'
    post:
      tags:
      - approvals
      operationId: decideGate
      summary: Update gate.decide (Update ID = decision_id derived from channel ui|cli and the Idempotency-Key)
      x-replicant-permission: gate:decide
      parameters:
      - $ref: common-components.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionInput'
      responses:
        '200':
          description: accepted, superseded, denied, or duplicate (original result)
          content:
            application/json:
              schema:
                $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/GateDecideResult
        '202':
          $ref: '#/components/responses/Recording'
        '403':
          $ref: common-components.yaml#/components/responses/Problem
        '404':
          $ref: common-components.yaml#/components/responses/Problem
        '409':
          $ref: common-components.yaml#/components/responses/Problem
        '410':
          $ref: common-components.yaml#/components/responses/Problem
  /v1/stream:
    get:
      tags:
      - stream
      operationId: stream
      summary: Server-Sent Events. Events carry references only (job_id + seq, gate_id + state, action_id + outcome). Clients re-fetch.
      x-replicant-permission: authenticated
      parameters:
      - name: topics
        in: query
        required: true
