      - job_template
      properties:
        cron:
          type: string
          maxLength: 100
        timezone:
          type: string
        job_template:
          type: object
          description: Partial JobRequest (intent, targets or target_selector, workflow_type=maintenance)
        paused:
          type: boolean
        overlap_policy:
          type: string
          enum:
          - skip
          - buffer_one
          default: skip
        display_name:
          type: string
          minLength: 2
          maxLength: 80
          pattern: ^[a-z0-9][a-z0-9-]{1,79}$
          description: Human name, unique per tenant (for example deps-weekly)
      additionalProperties: false
      description: Create body; schedule_id is minted by the server and the owner is the caller (R1V-038)
    OutcomeReportInput:
      type: object
      additionalProperties: false
      required:
      - kind
      description: Public body (XD-FIX-R2-017). control-plane-api adds tenant_id, job_id, source "ui", reporter_principal_id (the caller) and
        dedupe_key "ui:<principal>:<job_id>:<kind>" before forwarding; detector-only kinds and sources are not accepted here
      properties:
        kind:
          type: string
          enum:
          - wrong_fix
          - regression
        evidence_url:
          type: string
          maxLength: 2048
          pattern: ^https://
        note:
          type: string
          maxLength: 1000
    CorrectionRequestInput:
      type: object
      additionalProperties: false
      required:
      - reason_code
      description: 'Public body (XD-FIX-R2-018). control-plane-api sets source "ui_public_view" and requester_role itself: "author" when the caller
        is the entry provenance author, "codeowner" only when github-integration verifies the caller against CODEOWNERS and team membership for
        the entry path; otherwise 403 not_author_or_codeowner. The caller never asserts a role'
      properties:
        reason_code:
          type: string
          enum:
          - misread_comment
          - too_broad
          - wrong
          - outdated
          - other
        note:
          type: string
          maxLength: 500
