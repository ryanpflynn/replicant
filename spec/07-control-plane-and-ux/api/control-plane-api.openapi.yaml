              type: string
            node_key:
              type: string
            phase:
              type: string
            cli:
              type: string
            model:
              type: string
            isolation:
              type: string
            started_at:
              type: string
              format: date-time
        source:
          type: object
          properties:
            channel:
              type: string
            url:
              type: string
              format: uri
        links:
          type: object
          properties:
            langfuse_trace:
              type: string
              format: uri
            grafana_logs:
              type: string
              format: uri
            tempo_trace:
              type: string
              format: uri
            temporal_workflow:
              type: string
              format: uri
              description: Only for callers with temporal:ui
    RunRow:
      allOf:
      - $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/RunView
      - type: object
        properties:
          result_outcome:
            type: string
            description: Task outcome from run_result (distinct from phase Succeeded, C-CRD risk)
          cost_usd:
            type: number
    ArtifactRow:
      type: object
      required:
      - artifact_id
      - type
      - bucket_class
      - size_bytes
      - created_at
      properties:
        artifact_id:
          type: string
          pattern: ^art_[0-9a-hjkmnp-tv-z]{26}$
        run_id:
          type: string
        type:
          type: string
        name:
          type: string
        bucket_class:
          type: string
          enum:
          - artifacts
          - transcripts
          - session
          - audit
        content_type:
          type: string
        size_bytes:
          type: integer
        sha256:
          type: string
        redacted:
          type: boolean
        created_at:
          type: string
          format: date-time
    MemoryUsedEntry:
      type: object
      required:
      - memory_entry_ref
      - scope
      - text
      - provenance_summary
      properties:
        memory_entry_ref:
          type: string
          pattern: ^mem_[0-9a-hjkmnp-tv-z]{26}@[1-9][0-9]*$
        scope:
          type: string
        kind:
          type: string
        text:
          type:
          - string
          - 'null'
          maxLength: 4000
          description: Live from memory-service; null when the entry was purged (state = purged) or is not readable by the caller
        state:
          $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/schemas/EntryState
        provenance_summary:
          type: string
          maxLength: 300
        selection_reason:
          type: string
          maxLength: 300
    TakeoverPackage:
      type: object
      required:
      - takeover_id
      - job_id
      - branch
      - artifacts
      - commands
      properties:
        takeover_id:
          type: string
        job_id:
          $ref: common-components.yaml#/components/schemas/JobId
        branch:
          type: object
          properties:
            repo:
              type: string
            name:
              type: string
            head_sha:
              type: string
            url:
              type: string
              format: uri
        artifacts:
          type: object
          properties:
            workspace_archive:
              $ref: '#/components/schemas/ArtifactRow'
            plan:
              $ref: '#/components/schemas/ArtifactRow'
            handoff:
              $ref: '#/components/schemas/ArtifactRow'
            transcripts:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactRow'
        commands:
          type: array
          description: Ready-to-run shell commands, e.g. git fetch and replicant takeover pull
          items:
            type: string
        expires_at:
          type: string
          format: date-time
    InboxItem:
      type: object
      required:
      - gate_id
      - job_id
      - kind
      - title
      - repo
      - risk_level
      - opened_at
      - channels
      - why
      properties:
        gate_id:
          type: string
        job_id:
          $ref: common-components.yaml#/components/schemas/JobId
        tenant_id:
          $ref: common-components.yaml#/components/schemas/TenantId
        kind:
          type: string
          enum:
          - plan_approval
          - publish_approval
          - clarification
          - budget_extension
          - bundle_migration
          - leak_purge
          - release_signoff
        title:
          type: string
        repo:
          type: string
        requester:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        risk_level:
          type: string
        opened_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        escalation_level:
          type: integer
        channels:
          type: array
          items:
            type: string
        suggested_approver:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        batchable:
          type: boolean
        why:
          type: string
          enum:
          - eligible_principal
          - eligible_group
          - codeowner
          - delegate
          - escalation
        state:
          type: string
        decision:
          $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/winning_decision
        approvals_recorded:
          type: integer
          minimum: 0
        approvals_required:
          type: integer
          minimum: 1
        bundle_state:
          $ref: ../../06-releases-and-evals/api/releases.openapi.yaml#/components/schemas/PromotionState
    GateDetail:
      type: object
      required:
      - gate
      - packet
      - decidable
      properties:
        gate:
          $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/GateView
        packet:
          type: object
          description: Resolved approval_packet (replicant.approval-packet/v1) with presigned links for plan, diff, QA
        decidable:
          type: boolean
          description: Pre-check for the caller; the workflow handler is authoritative
        not_decidable_reason:
          type: string
        suggested_approver:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        superseded_decisions:
          type: array
          items:
            type: object
    DecisionInput:
      type: object
      additionalProperties: false
      required:
      - decision
      - presented_digest
      properties:
        decision:
          type: string
          enum:
          - approve
          - reject
          - request_changes
          - answer
          - rerun_qa
        presented_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        comment:
          type: string
          maxLength: 8000
        answer_text:
          type: string
          maxLength: 16000
        override_release_block:
          type: object
          additionalProperties: false
          required:
          - reason
          description: CCR-06-13 (C-MSG 1.7.1). Required to approve a gate whose job bundle was rolled back or revoked (GateView.release_block);
            typed reason, audited, shown on the gate. Reject and request_changes never need it.
          properties:
            reason:
              type: string
              minLength: 3
              maxLength: 2000
      allOf:
      - if:
          properties:
            decision:
              const: answer
        then:
          required:
          - answer_text
      - if:
          properties:
            decision:
              enum:
              - reject
              - request_changes
        then:
          required:
          - comment
      description: rerun_qa (CCR-05-04) is offered only on publish_approval when the packet qa.verdict is inconclusive and qa.actions contains
        rerun_qa, at most 2 per gate (GateView.qa_reruns_used); otherwise 409 decision_not_offered. decided_at is stamped by control-plane-api
        at receipt (XD-FIX-R2-014) and kept on every outbox re-submission; on denial_reason identity_unverifiable the outbox re-submits after
        60 s, up to 5 times, with decision_id derived("dec", original, "r<n>") (XD-FIX-R2-011).
    BundleRow:
      type: object
      required:
      - release_bundle_id
      - display_version
      - promotion_state
      - worker_build_id
      properties:
        release_bundle_id:
          $ref: common-components.yaml#/components/schemas/ReleaseBundleId
        display_version:
          type: string
        promotion_state:
          $ref: ../../06-releases-and-evals/api/releases.openapi.yaml#/components/schemas/PromotionState
        base_release_bundle_id:
