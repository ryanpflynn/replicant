      - internal
      operationId: grantRevocationList
      summary: 'Run-grant revocation list (C-STATE 1.2.0): job_ids whose status became cancelled, failed, or taken_over, and run_ids cancelled
        or terminal with SecurityViolation; derived from jobs_read. Verifiers poll every 60 s. Served on https://grants.<env>.replicant.internal'
