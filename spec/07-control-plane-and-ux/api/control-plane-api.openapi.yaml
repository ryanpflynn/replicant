        '200':
          description: Revoked identifiers with the time they were added; entries kept until 24 h after the last possible grant exp
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
              description: max-age=30
          content:
            application/json:
              schema:
                type: object
                required:
                - generated_at
                - job_ids
                - run_ids
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  job_ids:
                    type: array
