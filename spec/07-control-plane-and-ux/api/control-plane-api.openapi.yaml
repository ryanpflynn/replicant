        report drift (R1-102). Shared restore envelope (XD-FIX-R1-237): permission restore:execute; 409 restore_not_open unless an ops.restore_events
        row is open; 202 with a step to poll.'
      parameters:
      - $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/parameters/IdempotencyKey
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: The restore point
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '202':
          description: Step started.
          content:
            application/json:
              schema:
                $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/schemas/RestoreStep
        '403':
          $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/responses/Problem
        '409':
          $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/responses/Problem
      x-proxy-to: POST memory-service /internal/v1/admin/restore-resync
      description: Proxied 1:1 to memory-service; both layers require restore:execute (XD-W3-R1V-027), not memory:admin. A denial emits authz.denied
        at control-plane-api and is re-checked by memory-service. No body; required query since, optional dry_run (default false) (XD-W3-R1V-029).
  /v1/admin/memory/restore-resync/{restore_step_id}:
    get:
      tags:
      - memory
      operationId: memGetRestoreResyncStep
      x-replicant-permission: restore:execute
      parameters:
      - name: restore_step_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Step state and report.
          content:
            application/json:
              schema:
                $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/schemas/RestoreStep
        '404':
          $ref: ../../04-memory-and-context/api/memory-service.openapi.yaml#/components/responses/Problem
      x-proxy-to: GET memory-service /internal/v1/admin/restore-resync/{restore_step_id}
      description: Proxied 1:1 to memory-service; both layers require restore:execute (XD-W3-R1V-027), not memory:admin. A denial emits authz.denied
        at control-plane-api and is re-checked by memory-service. Status of one restore step.
  /v1/admin/leaks:
    post:
      tags:
      - admin
      operationId: recordLeak
      summary: Record a detected leak (XD-FIX-R1-192). The scope document is stored by leak-scanner in artifacts org/leaks/<leak_id>/scope.json;
        never the leaked value
      x-replicant-permission: security:leak
      parameters:
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - fingerprint_sha256
              - rule_id
              - first_seen_at
              - scope_key
              properties:
                fingerprint_sha256:
                  type: string
                  pattern: ^[0-9a-f]{64}$
                rule_id:
                  type: string
                  maxLength: 128
                first_seen_at:
                  type: string
                  format: date-time
                scope_key:
                  type: string
                  maxLength: 1024
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - leak_id
                properties:
                  leak_id:
                    type: string
        '403': *id005
  /v1/admin/leaks/{leak_id}:
    get:
      tags:
      - admin
      operationId: getLeak
      summary: Leak status and per-sink purge results
      x-replicant-permission: security:leak
      parameters:
      - name: leak_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeakStatus'
        '404': *id005
  /v1/admin/leaks/{leak_id}:purge:
    post:
      tags:
      - admin
      operationId: startLeakPurge
      summary: 'Start WS-08 LeakPurge (workflow ID = leak_id, task queue replicant-ops), idempotent on leak_id. It opens a leak_purge gate: min_approvers
        2, eligible replicant-admins only, initiator excluded (C-MSG V11); decided in the approvals inbox view "Leak purges awaiting approval" or
        replicant admin leak approve <leak_id>'
      x-replicant-permission: security:leak
      parameters:
      - name: leak_id
        in: path
        required: true
        schema:
          type: string
      - *id007
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required:
                - leak_id
                - workflow_id
                properties:
                  leak_id:
                    type: string
                  workflow_id:
                    type: string
        '403': *id005
        '404': *id005
  /v1/admin/identity/resync:
    post:
      tags:
      - admin
      operationId: identityResync
      summary: Full reconcile of identity against Okta Users/Groups (proxied to identity-service POST /internal/v1/identity:resync). Idempotent;
        also the restore step of recovery.md §4.3
      x-replicant-permission: restore:execute
      parameters:
      - *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - since
              - mode
              properties:
                since:
                  type: string
                  format: date-time
                mode:
                  type: string
                  enum:
                  - full
      responses: *id008
  /internal/v1/admin/restore/intake-resync:
    post:
      tags:
      - internal
      operationId: restoreIntakeResync
      summary: Re-create intake rows for jobs Temporal knows but Postgres lost (recovery.md §4.2)
      x-replicant-permission: restore:execute
      x-replicant-callers:
      - replicant-db restore runbook
      parameters:
      - *id009
      - *id007
      responses: *id008
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-replicant_session
      description: BFF session (browser). Non-GET requests also require header X-Replicant-CSRF.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Okta access token from the device authorization grant (CLI), audience api://replicant
    serviceAccount:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Kubernetes projected ServiceAccount token, audience control-plane-api
  parameters:
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: common-components.yaml#/components/schemas/JobId
    GateId:
      name: gate_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^gate_[0-9a-hjkmnp-tv-z]{26}$
    BundleId:
      name: release_bundle_id
      in: path
      required: true
      schema:
        $ref: common-components.yaml#/components/schemas/ReleaseBundleId
    BuildId:
      name: build_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^b[0-9]{8}-[0-9a-f]{12}$
    TenantIdPath:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: common-components.yaml#/components/schemas/TenantId
    MemoryEntryId:
      name: memory_entry_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^mem_[0-9a-hjkmnp-tv-z]{26}$
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  headers:
    ProjectionSeq:
      schema:
        type: integer
    ProjectionLag:
      schema:
        type: integer
        minimum: 0
  requestBodies:
    JobControl:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
            - action_id
            properties:
              action_id:
                type: string
                pattern: ^act_[0-9a-hjkmnp-tv-z]{26}$
              reason:
                type: string
                maxLength: 2000
              pause_mode:
                type: string
                enum:
                - at_next_node
                - at_next_gate
              takeover_include:
                type: array
                uniqueItems: true
                items:
                  type: string
                  enum:
                  - branch
                  - workspace_archive
                  - transcripts
                  - plan
                  - handoff
    MemoryProxyBody:
      required: true
      description: Body defined by WS-04's memory-service admin API; passed through unchanged after the D-25 check.
      content:
        application/json:
          schema:
            type: object
  responses:
    Recording:
      description: The Update could not be confirmed within 10 s; the outbox keeps retrying with the same ID. Outcome arrives as SSE action.completed.
      content:
        application/json:
          schema:
            type: object
            required:
            - state
            - action_ref
            properties:
              state:
                const: recording
              action_ref:
                type: string
    ControlResult:
      description: Update result
      content:
        application/json:
          schema:
            $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/JobControlResult
    MemoryProxy:
      description: Response of memory-service's admin API (WS-04), passed through
      content:
        application/json:
          schema:
            type: object
  schemas:
    Me:
      type: object
      required:
      - principal_id
      - display_name
      - tenants
      - capabilities
      - links
      properties:
        principal_id:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        display_name:
          type: string
        timezone:
          type: string
        tenants:
          type: array
          items:
            type: object
            required:
            - tenant_id
            - roles
            properties:
              tenant_id:
                $ref: common-components.yaml#/components/schemas/TenantId
              roles:
                type: array
                items:
                  type: string
                  enum:
                  - viewer
                  - engineer
                  - approver
                  - tenant_admin
        capabilities:
          description: Platform-level permissions the UI may reveal navigation for (e.g. memory:admin, release:operate). UX only; the API enforces.
          type: array
          items:
            type: string
        links:
          type: object
          properties:
            github:
              $ref: '#/components/schemas/LinkStatus'
            slack:
              $ref: '#/components/schemas/LinkStatus'
            jira:
              $ref: '#/components/schemas/LinkStatus'
    LinkStatus:
      type: object
      required:
      - status
      properties:
        status:
          description: '`none` means no link exists'
          anyOf:
          - $ref: common-components.yaml#/components/schemas/LinkStatus
          - const: none
        login:
          type: string
        method:
          type: string
          enum:
          - saml_external_identity
          - oauth
          - oidc
          - scim
        linked_at:
          type: string
          format: date-time
    Delegation:
      type: object
      required:
      - delegation_id
      - from_principal
      - to_principal
      - starts_at
      - ends_at
      properties:
        delegation_id:
          type: string
          pattern: ^dlg_[0-9a-hjkmnp-tv-z]{26}$
        from_principal:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        to_principal:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        tenants:
          type: array
          items:
            $ref: common-components.yaml#/components/schemas/TenantId
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 200
    DelegationCreate:
      type: object
      additionalProperties: false
      required:
      - to_principal
      - starts_at
      - ends_at
      properties:
        to_principal:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        tenants:
          type: array
          items:
            $ref: common-components.yaml#/components/schemas/TenantId
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        reason:
          type: string
          maxLength: 200
    NotificationPreferences:
      $ref: ../schemas/notification-preferences.schema.json
    JobCreated:
      type: object
      required:
      - job_id
      - status
      - created
      - links
      properties:
        job_id:
          $ref: common-components.yaml#/components/schemas/JobId
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_human
          - waiting_external
          - paused
          - succeeded
          - failed
          - cancelled
          - rejected
          - expired
          - taken_over
        created:
          type: boolean
        start_status:
          type: string
          enum:
          - started
          - pending
        release_bundle_id:
          $ref: common-components.yaml#/components/schemas/ReleaseBundleId
        links:
          type: object
          required:
          - ui
          properties:
            ui:
              type: string
              format: uri
    JobSummary:
      type: object
      required:
      - job_id
      - tenant_id
      - title
      - status
      - phase
      - workflow_type
      - requester
      - repos
      - updated_at
      properties:
        job_id:
          $ref: common-components.yaml#/components/schemas/JobId
        tenant_id:
          $ref: common-components.yaml#/components/schemas/TenantId
        title:
          type: string
        status:
          type: string
        phase:
          type: string
        current_node:
          type: string
        sub_status:
          type: string
          enum:
          - waiting_capacity_tenant
          - waiting_capacity_cluster
          - tenant_budget_exhausted
          - platform_budget_exhausted
          - dependency_outage
          - operator_hold
          - bundle_revoked
          - retrying
          - rebasing
          - kill_switch_starts
          - kill_switch_runs
          - kill_switch_publishing
          - no_progress_30m
          description: 'Source: jobs_read.jobs.sub_status (R2-020)'
        workflow_type:
          type: string
        risk_level:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        evaluation:
          $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/JobSnapshot/properties/evaluation
        requester:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        on_behalf_of:
          $ref: common-components.yaml#/components/schemas/PrincipalId
        repos:
          type: array
          items:
            type: string
        pr:
          type: object
          properties:
            number:
              type: integer
            url:
              type: string
              format: uri
            state:
              type: string
        open_gate:
          type: object
          properties:
            gate_id:
              type: string
            kind:
              type: string
            expires_at:
              type: string
              format: date-time
        cost_usd:
          type: number
        release_bundle_id:
          $ref: common-components.yaml#/components/schemas/ReleaseBundleId
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        sub_status_detail:
          type: object
          properties:
            quota_used:
              type: integer
            quota_limit:
              type: integer
            attempt:
              type: integer
            resets_at:
              type: string
              format: date-time
    JobDetail:
      type: object
      required:
      - snapshot
      - cost
      - links
      properties:
        snapshot:
          $ref: ../../00-contracts/schemas/workflow-messages.schema.json#/$defs/JobSnapshot
        cost:
          type: object
          properties:
            usd_so_far:
              type: number
            usd_cap:
              type: number
            by_run:
              type: array
              items:
                type: object
                properties:
                  run_id:
                    type: string
                  usd:
                    type: number
        live_run:
          type: object
          description: Present while a run is active (from job_runs plus last heartbeat)
          properties:
