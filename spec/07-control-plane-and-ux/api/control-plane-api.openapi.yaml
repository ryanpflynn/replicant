                      type: object
                      required:
                      - id
                      - revoked_at
                      properties:
                        id:
                          type: string
                          pattern: ^job_[0-9a-hjkmnp-tv-z]{26}$
                        revoked_at:
                          type: string
                          format: date-time
                  run_ids:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - revoked_at
                      properties:
                        id:
                          type: string
                          pattern: ^run_[0-9a-hjkmnp-tv-z]{26}$
                        revoked_at:
                          type: string
                          format: date-time
        '304':
          description: Not modified
