      - registry
      operationId: registryPublish
      summary: C-DEF 2.1.0 §4.2 publish. source=config_repo requires a full snapshot (heads move; absent names lose their head); source=worker_ci
        publishes NodeCatalog only. dry_run validates against this environment and writes nothing. publish_id makes the call idempotent.
      x-replicant-permission: registry:publish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - publish_id
              - commit_sha
              - source
              - dry_run
              - documents
              properties:
                publish_id:
                  type: string
                  pattern: ^pub_[0-9a-hjkmnp-tv-z]{26}$
                commit_sha:
                  type: string
                  pattern: ^[0-9a-f]{40}$
                source:
                  type: string
                  enum:
                  - config_repo
                  - worker_ci
                dry_run:
                  type: boolean
                documents:
                  type: array
                  minItems: 1
                  maxItems: 2000
                  items:
                    type: object
                    additionalProperties: false
                    required:
                    - path
                    - content_yaml
                    properties:
                      path:
                        type: string
                        maxLength: 512
                      content_yaml:
                        type: string
                        maxLength: 4194304
      responses:
        '200':
          description: Published (or would publish, with dry_run) refs
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                      - path
                      - ref
                      - digest
                      - created
                      - head
                      properties:
                        path:
                          type: string
                        ref:
                          type: string
                        digest:
                          type: string
                          pattern: ^sha256:[0-9a-f]{64}$
                        created:
                          type: boolean
                        head:
                          type: boolean
        '422':
          $ref: common-components.yaml#/components/responses/Problem
