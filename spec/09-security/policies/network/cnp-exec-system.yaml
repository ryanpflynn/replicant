apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: repo-mirror
  namespace: replicant-mirror
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: repo-mirror
  enableDefaultDeny:
    egress: true
    ingress: true
  ingress:
    # Sandboxes reach repo-mirror through its internal NLB (WS-02 fallback rule 6, R2-037) in
    # 10.41.10.0/24, or directly as endpoints when B-NET-01 shows Kata reaches ClusterIPs.
    - fromCIDRSet:
        - cidr: 10.41.10.0/24
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            io.cilium.k8s.namespace.labels.replicant.example.com/zone: sandbox
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
  egress:
    # GET /v1/revocations on runner-api by ClusterIP (02-execution/runner-service.md §1.1).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: replicant-runner
            app.kubernetes.io/name: runner-api
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchName: github.com
              - matchName: api.github.com
              - matchName: codeload.github.com
              - matchName: token-broker.prod.replicant.internal
              - matchName: runner-sandbox.prod.replicant.internal
              - matchName: grants.prod.replicant.internal
              - matchName: git.eval.prod.replicant.internal
    - toFQDNs:
        - matchName: github.com
        - matchName: api.github.com
        - matchName: codeload.github.com
        - matchName: token-broker.prod.replicant.internal
        - matchName: runner-sandbox.prod.replicant.internal
        - matchName: grants.prod.replicant.internal
        - matchName: git.eval.prod.replicant.internal
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Security response automation (tenancy.md §3.5, R1V-059): consumes Tetragon alerts, cordons the node,
# finds its runs by the pod label replicant.example.com/run-id, and cancels them through runner-api with
# reason security. No cloud credentials (no Pod Identity association), no internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: security-automation
  namespace: replicant-security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: security-automation
  enableDefaultDeny:
    egress: true
    ingress: true
  ingress:
    # Tetragon export through Alloy (alert webhook).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: replicant-observability
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: replicant-runner
            app.kubernetes.io/name: runner-api
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
