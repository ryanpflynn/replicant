# AgentRun CRD CEL rules can see only apiVersion, kind, metadata.name and metadata.generateName at
# the root [verified: https://kubernetes.io/docs/tasks/extend-kubernetes/custom-resources/custom-resource-definitions/, 2026-10-24],
# so the CRD cannot bind namespace to tenant or check bucket names. This policy closes that gap
# (C-CRD prefix rules use endsWith and do not constrain the bucket).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: replicant-agentrun-binding
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: ["replicant.example.com"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["agentruns", "agentruns/status"]
  variables:
    - name: envBuckets
      expression: "params.data['buckets'].split(',')"
    - name: bucketOf
      expression: "[object.spec.artifacts.artifactsPrefix, object.spec.artifacts.transcriptsPrefix, object.spec.artifacts.sessionPrefix, object.spec.inputs.manifestUri].map(u, u.substring(5).split('/')[0])"
  validations:
    - expression: "request.operation != 'CREATE' || request.userInfo.username == 'system:serviceaccount:replicant-runner:runner-api'"
      message: "Only runner-api creates AgentRuns."
    - expression: "request.operation != 'UPDATE' || request.userInfo.username in ['system:serviceaccount:replicant-runner:runner-api', 'system:serviceaccount:replicant-runner:agentrun-controller']"
      message: "Only runner-api (cancel) and agentrun-controller (status, finalizers) update AgentRuns."
    - expression: "request.subResource != 'status' || request.userInfo.username == 'system:serviceaccount:replicant-runner:agentrun-controller'"
      message: "Only agentrun-controller writes AgentRun status."
    - expression: "object.metadata.namespace == 'sbx-' + object.spec.tenantId"
      message: "AgentRun namespace must be sbx-<spec.tenantId>."
    - expression: "variables.bucketOf[0] == params.data['artifactsBucket'] && variables.bucketOf[1] == params.data['transcriptsBucket'] && variables.bucketOf[2] == params.data['sessionBucket'] && variables.bucketOf[3] == params.data['artifactsBucket']"
      message: "Artifact prefixes and inputs must be in this environment's run buckets."
    - expression: "object.spec.callback.namespace == params.data['temporalNamespace']"
      message: "Callback namespace must be this environment's Temporal namespace."
    - expression: "object.spec.networkProfile in params.data['networkProfiles'].split(',')"
      message: "Unknown network profile."
    - expression: "quantity(object.spec.workspace.sizeLimit).compareTo(quantity('1Ti')) <= 0"
      message: "Workspace sizeLimit exceeds the 1Ti platform ceiling (XD-FIX-R2-064)."
    - expression: "!object.spec.networkProfile.startsWith('eval-') || object.spec.tenantId == 'replicant-eval'"
      message: "eval-* network profiles are reserved for tenant replicant-eval."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: replicant-agentrun-binding-params
  namespace: replicant-runner
data:
  artifactsBucket: acme-replicant-prod-artifacts
  transcriptsBucket: acme-replicant-prod-transcripts
  sessionBucket: acme-replicant-prod-session
  buckets: acme-replicant-prod-artifacts,acme-replicant-prod-transcripts,acme-replicant-prod-session
  temporalNamespace: replicant-prod
  # Generated by the network-profile sync (WS-02 controller, XD-FIX-R1-213) from the network_profiles
  # policy of every promoted bundle; the static value below is the base catalogue of eight profiles.
  networkProfiles: coding-default,review-readonly,qa-with-mirror,utility-minimal,takeover,eval-coding,eval-scoring,eval-snapshot
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: replicant-agentrun-binding
spec:
  policyName: replicant-agentrun-binding
  paramRef:
    name: replicant-agentrun-binding-params
    namespace: replicant-runner
    parameterNotFoundAction: Deny
  validationActions: ["Deny", "Audit"]
