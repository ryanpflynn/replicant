  kubelet:
    maxPods: 80
    systemReserved: {cpu: 1000m, memory: 4Gi, ephemeral-storage: 50Gi}
    evictionHard:
      memory.available: 2Gi
      nodefs.available: "5%"
      nodefs.inodesFree: "5%"
      imagefs.available: "10%"
    imageGCHighThresholdPercent: 70
    imageGCLowThresholdPercent: 60
  tags:
    replicant.example.com/pool: sbx-gvisor
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="REPLICANT"

    --REPLICANT
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          containerLogMaxSize: 50Mi
          containerLogMaxFiles: 3
      containerd:
        config: |
          version = 3
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.kata-clh-runtime-rs]
            runtime_type = "io.containerd.kata-clh.v2"
            privileged_without_host_devices = true
            pod_annotations = []
            container_annotations = []
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.kata-clh-runtime-rs.options]
            ConfigPath = "/opt/kata/share/defaults/kata-containers/runtime-rs/configuration-clh.toml"
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runsc]
            runtime_type = "io.containerd.runsc.v1"
            pod_annotations = []
            container_annotations = []
          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runsc.options]
            TypeUrl = "io.containerd.runsc.v1.options"
            ConfigPath = "/etc/containerd/runsc.toml"
          [plugins.'io.containerd.nri.v1.nri']
            disable = false
            plugin_request_timeout = "10s"

    --REPLICANT
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/usr/bin/env bash
    # replicant-sandbox-disks (workspace-storage.md section 1.2)
    set -euo pipefail
    MNT=/mnt/k8s-disks/0
    MD=/dev/md/replicant0
    mapfile -t DISKS < <(lsblk -dpno NAME,MODEL | awk '/Amazon EC2 NVMe Instance Storage/ {print $1}')
    if [[ ${#DISKS[@]} -eq 0 ]]; then echo "no instance store" >&2; exit 1; fi
    if [[ ! -e "$MD" ]]; then
      if [[ ${#DISKS[@]} -eq 1 ]]; then MD="${DISKS[0]}"; else
        mdadm --create --force --verbose "$MD" --level=0 --name=replicant0 --raid-devices="${#DISKS[@]}" "${DISKS[@]}"
        udevadm settle
      fi
    fi
    blkid -t TYPE=xfs "$MD" >/dev/null 2>&1 || mkfs.xfs -f -K -l su=8b "$MD"
    mkdir -p "$MNT"
    mountpoint -q "$MNT" || mount -t xfs -o noatime,prjquota "$MD" "$MNT"
    xfs_quota -x -c 'state -p' "$MNT" | grep -q 'Enforcement: ON'
    for d in /var/lib/kubelet /var/lib/containerd /var/lib/soci-snapshotter-grpc /var/log/pods; do
      src="$MNT/$(basename "$d")"; mkdir -p "$src" "$d"
      mountpoint -q "$d" || mount --bind "$src" "$d"
    done
    install -d /etc/containerd
    cat > /etc/containerd/runsc.toml <<'RUNSC'
    [runsc_config]
      platform = "systrap"
      directfs = "false"
      overlay2 = "root:self"
      network = "sandbox"
      net-raw = "false"
    RUNSC
