# Rendered by agentrun-controller for the C-CRD example AgentRun ar-gj3h3ep3phjfs9e23v768zrca5
# (tenant payments, role implementer, workload class coding, replicant-kata-clh, guestBlockDevice).
# Template rules: controller.md section 4. Process model agreed with WS-03 (cli-invocation.md 1.1, XD-03-01)
# and WS-09 control review G-01/G-12/G-22/G-26:
#   * run tokens (one per audience, CCR-09-01) are mounted ONLY into replicant-agentd;
#   * the agent container holds no credential of any kind;
#   * no runtime-control annotations (containerd forwards none to Kata);
#   * the uploader gets S3 session credentials from agentd over a private socket the agent cannot reach.
# Parsed with PyYAML in CI; schema-validated with kubeconform against Kubernetes 1.36. Digests are
# illustrative placeholders of the right shape.
apiVersion: v1
kind: Pod
metadata:
  name: ar-gj3h3ep3phjfs9e23v768zrca5            # bare Pod named like the AgentRun (ADR-02-002)
  namespace: sbx-payments
  labels:
    app.kubernetes.io/managed-by: agentrun-controller
