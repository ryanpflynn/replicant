    replicant.example.com/cancel-reason: none
  ownerReferences:
    - apiVersion: replicant.example.com/v1alpha1
      kind: AgentRun
      name: ar-gj3h3ep3phjfs9e23v768zrca5
      uid: 6b1f3d2e-9a4c-4e8b-8f0a-1c2d3e4f5a6b
      controller: true
      blockOwnerDeletion: true
  finalizers:
    - replicant.example.com/pod-status                # keeps terminal statuses until recorded
spec:
  runtimeClassName: replicant-kata-clh             # nodeSelector/tolerations merged from the RuntimeClass
  priorityClassName: replicant-run-normal
  serviceAccountName: sbx-runner
  automountServiceAccountToken: false            # no Kubernetes API access from sandboxes
  enableServiceLinks: false
  hostNetwork: false
  hostPID: false
  hostIPC: false
  shareProcessNamespace: false                   # agent cannot see or signal sidecar processes
  restartPolicy: Never
  activeDeadlineSeconds: 4200                    # backstop: startup 300 + active 3600 + finalize 300
  terminationGracePeriodSeconds: 315             # finalizeSeconds + 15
