        - {name: REPLICANT_RUN_TOKEN_DIR, value: /run/replicant/tokens}            # C-IDS §7: /run/replicant/tokens/<audience>, refreshed in place
        - {name: REPLICANT_UPLOADER_SOCKET, value: /run/replicant/uploader-ipc/agentd.sock}
