    replicant.example.com/workspace-enforcement: guestBlockDevice
    replicant.example.com/workspace-bytes: "42949672960"       # 40Gi exactly (the hard limit)
  annotations:
    karpenter.sh/do-not-disrupt: "true"          # no voluntary disruption (consolidation) while running
