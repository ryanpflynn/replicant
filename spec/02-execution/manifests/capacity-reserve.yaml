# Priority classes for runs and placeholders, and the warm-capacity reserve (fast-path.md section 2).
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: replicant-placeholder}
value: -100
preemptionPolicy: Never
globalDefault: false
description: Warm-capacity placeholders; preempted by any sandbox run.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: replicant-run-low}
value: 100
preemptionPolicy: PreemptLowerPriority
description: AgentRun priority low (maintenance sweeps).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: replicant-eval}
value: 50
preemptionPolicy: Never
description: Eval-tenant runs (WS-06 XD-06-10); below every production run, never preempts.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: replicant-run-normal}
value: 1000
preemptionPolicy: PreemptLowerPriority
description: AgentRun priority normal.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: replicant-run-high}
value: 10000
preemptionPolicy: PreemptLowerPriority
description: AgentRun priority high.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: {name: replicant-run-urgent}
value: 100000
preemptionPolicy: PreemptLowerPriority
description: AgentRun priority urgent (hotfix); may preempt low runs.
---
apiVersion: v1
kind: Namespace
metadata:
  name: replicant-capacity
  labels: {replicant.example.com/sandbox: "false"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sbx-capacity-reserve
  namespace: replicant-capacity
spec:
  replicas: 40
  selector:
    matchLabels: {app: sbx-capacity-reserve}
  template:
    metadata:
      labels: {app: sbx-capacity-reserve}
    spec:
      priorityClassName: replicant-placeholder
      runtimeClassName: replicant-kata-clh
      terminationGracePeriodSeconds: 5
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65535
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: pause
          image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/replicant/pause@sha256:3f5a7c9e1b2d4f6a8c0e2b4d6f8a1c3e5b7d9f0a2c4e6b8d1f3a5c7e9b0d2f4a
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            # = scheduling footprint of the most common resolved coding profile (agent requests + agentd,
            # uploader, watchdog + RuntimeClass overhead), regenerated by the release pipeline whenever the
            # default environment profile or memoryRequestPolicy changes (fast-path.md section 2, R1-282).
            # Placeholders run as Kata pods, so their own RuntimeClass overhead (250m/448Mi) is added on top.
            requests: {cpu: 4320m, memory: 12672Mi, ephemeral-storage: 1Gi}
            limits: {cpu: 4320m, memory: 12672Mi, ephemeral-storage: 1Gi}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbx-capacity-reserve-day
  namespace: replicant-capacity
spec:
  schedule: "0 7 * * 1-5"
  timeZone: America/New_York
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: capacity-scaler          # RBAC: patch deployments/scale in replicant-capacity only
          restartPolicy: OnFailure
          containers:
            - name: scale
              image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/replicant/kubectl@sha256:8a0c2e4b6d8f1a3c5e7b9d0f2a4c6e8b1d3f5a7c9e0b2d4f6a8c1e3b5d7f9a0c
              args: ["scale", "deployment/sbx-capacity-reserve", "-n", "replicant-capacity", "--replicas=40"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sbx-capacity-reserve-night
  namespace: replicant-capacity
spec:
  schedule: "0 19 * * *"
  timeZone: America/New_York
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: capacity-scaler
          restartPolicy: OnFailure
          containers:
            - name: scale
              image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/replicant/kubectl@sha256:8a0c2e4b6d8f1a3c5e7b9d0f2a4c6e8b1d3f5a7c9e0b2d4f6a8c1e3b5d7f9a0c
              args: ["scale", "deployment/sbx-capacity-reserve", "-n", "replicant-capacity", "--replicas=10"]
# No ResourceQuota here: WS-09's `sbx-quota` in tenant-namespace.yaml is the single ResourceQuota per tenant
# namespace (pods and compute only, no count/agentruns; R1-032). runner-api's 429 uses the namespace label
# replicant.example.com/max-active-runs (runner-service.md RS-5).
