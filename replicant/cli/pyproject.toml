[project]
name = "replicant-cli"
version = "0.1.0"
description = "The `replicant` CLI: `replicant dev up|down|status|logs|seed` for the local stack"
requires-python = ">=3.12,<3.13"
dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "cryptography>=43",
  "pyyaml>=6",
  "replicant-ids",
]

[tool.uv.sources]
replicant-ids = { workspace = true }

[project.scripts]
replicant = "replicant_cli.main:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replicant_cli"]
