# replicant.gateway-script/v1 (WS-03 gateway.md §8.2): the canned billing-py implementer for E2E-08 (onboarding, design
# §8c). Selected for billing-py jobs by the worker's REPLICANT_GATEWAY_SCRIPT_SETS (billing-py=walkthrough-billing-py):
# stub {root: scripts, set: walkthrough-billing-py, key: implement.c<cycle>.n<ordinal>}, falling back to the role.
# Bug and fix: dev/sample-repos/billing-py/ISSUES/001.md. Reading src/billing/invoice.py loads the nested
# src/billing/CLAUDE.md and the path-scoped rule .claude/rules/python-style.md; each Edit fires the team's PostToolUse
# hook (.claude/settings.json: ruff format), which cli.repo_config.hooks counts. The inserted code is already
# ruff-formatted, so the hook leaves it unchanged.
schema: replicant.gateway-script/v1
name: walkthrough-billing-py-implementer
protocol: anthropic_messages
finish: "Done. Tax is now computed on the taxable amount; uv run pytest -q and uv run ruff check . pass."
turns:
  # 1. Read the file (Claude Code's Edit tool refuses files that were not Read first).
  - expect: {tools: [Read, Edit, Bash]}
    respond:
      text: "I'll look at Invoice.tax_cents."
      tool_use: {name: Read, input: {file_path: "${cwd}/src/billing/invoice.py"}}
      usage: {input_tokens: 9000, output_tokens: 60}
  # 2. The one-line fix.
  - respond:
      text: "tax_cents taxes the gross subtotal. I'll tax taxable_cents() (subtotal minus discount) instead."
      tool_use:
        name: Edit
        input:
          file_path: "${cwd}/src/billing/invoice.py"
          old_string: "        return round_cents(Decimal(self.subtotal_cents()) * self.tax_rate)\n"
          new_string: "        return round_cents(Decimal(self.taxable_cents()) * self.tax_rate)\n"
      usage: {input_tokens: 11000, output_tokens: 120}
  # 3. Read the tests, then add the discounted, taxed case.
  - respond:
      tool_use: {name: Read, input: {file_path: "${cwd}/tests/test_invoice.py"}}
      usage: {input_tokens: 11500, output_tokens: 40}
  - respond:
      text: "Adding a test for a discounted, taxed invoice (the example from the issue)."
      tool_use:
        name: Edit
        input:
          file_path: "${cwd}/tests/test_invoice.py"
          old_string: "    assert inv.total_cents() == 1500\n"
          new_string: "    assert inv.total_cents() == 1500\n\n\ndef test_tax_on_discounted_amount() -> None:\n    inv = Invoice([Line(\"plan\", 10000)], discount_percent=Decimal(10), tax_rate=Decimal(\"0.2\"))\n    assert inv.discount_cents() == 1000\n    assert inv.taxable_cents() == 9000\n    assert inv.tax_cents() == 1800\n    assert inv.total_cents() == 10800\n"
      usage: {input_tokens: 12000, output_tokens: 160}
  # 4. Run the repo's test and lint commands.
  - respond:
      tool_use: {name: Bash, input: {command: "cd ${cwd} && uv run pytest -q && uv run ruff check .", description: "Run the tests and the linter"}}
      usage: {input_tokens: 12500, output_tokens: 50}
  # 5. Report (the CLI's --json-schema StructuredOutput tool); the shim then answers the tool_result with `finish`.
  - respond:
      text: "Invoice.tax_cents now taxes taxable_cents(); invoices without a discount keep their totals."
      structured_output_from: implementer.agent_report.json
      usage: {input_tokens: 13000, output_tokens: 200}
