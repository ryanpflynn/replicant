# runner-local contract scenario oom: allocate beyond the container memory limit (RC-RUN-15).
schema: replicant.gateway-script/v1
name: runner-contract-oom
protocol: anthropic_messages
finish: "Done."
turns:
  - respond:
      tool_use: {name: Bash, input: {command: "head -c 6000m /dev/zero | tail > /dev/null; sleep 60; true", description: "Large in-memory buffer", timeout: 600000}}
      usage: {input_tokens: 1000, output_tokens: 20}
  - respond:
      tool_use: {name: Bash, input: {command: "sleep 120; true", description: "Wait"}}
      usage: {input_tokens: 1000, output_tokens: 20}
