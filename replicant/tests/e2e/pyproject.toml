[project]
name = "replicant-e2e"
version = "0.1.0"
description = "End-to-end drivers against the running local stack (E2E-01-v0)"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27", "pytest>=8", "pyyaml>=6", "replicant-ids"]

[tool.uv.sources]
replicant-ids = { workspace = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["e2e*.py", "test_*.py"]
