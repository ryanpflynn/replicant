# Replicant monorepo: uv workspace root (Python 3.12). One lockfile (uv.lock) for every Python member.
# Register a new member by appending its directory to [tool.uv.workspace].members below (one line, keep the
# list explicit: uv fails on a glob that matches a directory without pyproject.toml), and give the member its
# own pyproject.toml with a [build-system]. Workspace libraries are consumed as
#   dependencies = ["replicant-ids"]   plus   [tool.uv.sources] replicant-ids = { workspace = true }
[project]
name = "replicant-monorepo"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
description = "Replicant monorepo workspace root (not a package)"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "workers/publisher-worker",
  "workers/replicant-projector",
  "workers/replicant-worker",
  "libs/python/replicant-temporal",
  "libs/python/replicant-ids",
  "libs/python/replicant-telemetry",
  "libs/python/replicant-db",
  "cli",
  "tests/e2e",
  "libs/python/replicant-scm",
  "services/control-plane-api",
  "services/control-plane-api/replicant-dev-auth",
  "services/github-integration",
  "services/github-token-broker",
  "services/memory-service",
  "libs/python/replicant-cdef",
  "services/slack-integration",
  "tools/slack-mock",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

# Lint gate (`replicant dev test unit` suite lint:python): lenient on purpose. pyflakes, import sorting and a small
# bugbear subset; no formatter. Per-file ignores only where a fix would change behaviour.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/node_modules", "web", "**/.venv", "evals", "docs"]
# first-party = every workspace package (import sorting groups them after third-party)
src = [".", "cli/src", "tests/e2e", "tools/slack-mock", "services/*", "services/*/src",
       "services/control-plane-api/replicant-dev-auth/src", "workers/*", "libs/python/*", "libs/python/*/src"]

[tool.ruff.lint]
select = ["F", "I", "B006", "B008", "B904"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI / Typer parameter markers and this repo's dependency factories (they return Depends(...)): evaluated once
# at import by design.
extend-immutable-calls = [
  "fastapi.Body", "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Security",
  "typer.Argument", "typer.Option",
  "control_plane_api.auth.require", "control_plane_api.routes_memory.require_memory_admin",
  "replicant_dev_auth.routes._require_seed",
]
