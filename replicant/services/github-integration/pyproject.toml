[project]
name = "github-integration"
version = "0.1.0"
description = "Replicant github-integration (WS-07): webhook ingress, consumer and routing. M1: Gitea adapter only (route /webhooks/gitea)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "replicant-telemetry",
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "psycopg[binary]==3.3.6",
  "temporalio==1.34.0",
  "httpx==0.28.1",
  "boto3==1.43.118",
  "pyyaml==6.0.3",
  "replicant-scm",
  "replicant-ids",
  "replicant-temporal",
]

[project.scripts]
github-integration = "github_integration.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "jsonschema>=4.26"]

[tool.uv.sources]
replicant-telemetry = { workspace = true }
replicant-scm = { workspace = true }
replicant-ids = { workspace = true }
replicant-temporal = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/github_integration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
