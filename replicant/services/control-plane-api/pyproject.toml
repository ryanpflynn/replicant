[project]
name = "control-plane-api"
version = "0.1.0"
description = "Replicant control-plane API (WS-07): intake, jobs read API, gate decisions, admin/seed API, run-grant JWKS and revocations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "psycopg[binary]==3.3.6",
  "temporalio==1.34.0",
  "jsonschema==4.26.0",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
  "boto3==1.43.118",
  "replicant-temporal",
  "replicant-ids",
  "replicant-cdef",
  "replicant-telemetry",
  "zstandard==0.25.0",
]

[project.scripts]
control-plane-api = "control_plane_api.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "replicant-dev-auth"]

[tool.uv.sources]
replicant-temporal = { workspace = true }
replicant-dev-auth = { workspace = true }
replicant-ids = { workspace = true }
replicant-cdef = { workspace = true }
replicant-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
