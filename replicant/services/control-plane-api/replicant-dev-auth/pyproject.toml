[project]
name = "replicant-dev-auth"
version = "0.1.0"
description = "LOCAL ONLY. Dev seed token authenticator, static dev users and /v1/admin/dev/** routes for control-plane-api. Installed only in the `dev` image target (identity.md §9.3 L-1)."
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replicant_dev_auth"]
