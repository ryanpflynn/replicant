[project]
name = "memory-service"
version = "0.1.0"
description = "Replicant memory-service (WS-04 v0 subset): snapshots, injection, candidates, curation; the only writer of schema memory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.6",
  "psycopg[binary]==3.3.6",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "boto3==1.43.118",
  "replicant-ids",
  "replicant-telemetry",
]

[project.scripts]
memory-service = "memory_service.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.0"]

[tool.uv.sources]
replicant-ids = { workspace = true }
replicant-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
