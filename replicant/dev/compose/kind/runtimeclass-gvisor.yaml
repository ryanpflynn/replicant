# Used only with REPLICANT_GVISOR=on, when the node image has runsc + containerd-shim-runsc-v1 and the containerd
# runtime `runsc` is configured (dev/k8s-tools builds that node image variant; WS-02 local-runner.md §3 note 3).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata: {name: replicant-gvisor}
handler: runsc
scheduling:
  nodeSelector: {replicant.example.com/sandbox: "true"}
