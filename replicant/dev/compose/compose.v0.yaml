# Replicant local stack, v0 (replicant/docs/v0/PLAN.md). Standalone since SIMPLIFY-D1: it no longer layers on the spec
# compose (spec/11-local-dev/compose/compose.yaml, the 69-service spec stack), so there are no override or depends_on reset
# files. Start it with `replicant dev up`, which runs
#   podman-compose --project-name replicant -f compose.v0.yaml --env-file .env --profile v0 up -d   (or docker compose)
#
# Profiles
#   (none)         the v0 stack: every service without a `profiles:` key; `--profile v0` names it on the CLI
#   slack          slack-mock, and core's Slack module (`replicant dev up --profile v0,slack` sets
#                  REPLICANT_SLACK_ENABLED=true); without it Slack deliveries are recorded and not sent, and the e2e
#                  suites that need Slack are skipped
#   observability  Alloy, Loki, Tempo, Prometheus, Grafana, podman-exporter (`replicant dev up --with-observability`)
#
# Images: postgres, replicant-py (every Python service, worker, tool and the `init` one-shot; role by `command:`),
# replicant-go (runner-local, gateway-shim), control-plane-web, plus third-party images (SIMPLIFY-D2).
# Every difference from the spec stack is recorded in replicant/docs/v0/DEVIATIONS.md (PLATFORM-D*, SIMPLIFY-D*).
# Names, ports, env vars and secret paths are the spec's unless a deviation says otherwise.
#
# Conventions (spec)
#   * Every browser-facing service listens in-container on the same port it publishes, and carries
#     the network alias <name>.replicant.localhost. `*.localhost` resolves to loopback in browsers, and
#     the alias resolves to the container inside the stack, so presigned S3 URLs and Gitea clone URLs are
#     identical inside and outside containers.
#   * Host ports bind to 127.0.0.1 only.
#   * Every image is pinned to an exact version. Replicant images are built from the monorepo.
#   * No service connects to replicant Postgres except through its own svc_<service> role (D-26).

name: replicant

x-replicant-build-args: &replicant-build-args
  REPLICANT_BUILD_ID: ${REPLICANT_WORKER_BUILD_ID:-b20261024-000000000000}
  REPLICANT_GIT_SHA: ${REPLICANT_GIT_SHA:-000000000000}

# One build per image: `replicant dev up` builds each image once however many services use it.
x-replicant-py: &replicant-py
  image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/replicant-py:${REPLICANT_IMAGE_TAG:-dev}
  # `dev` target: prod plus package replicant_dev_auth (seed authenticator, /v1/admin/dev/**; identity.md §9.3 L-1).
  build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: images/replicant-py/Dockerfile, target: dev, args: *replicant-build-args}

x-replicant-go: &replicant-go
  image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/replicant-go:${REPLICANT_IMAGE_TAG:-dev}
  build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: images/replicant-go/Dockerfile, args: *replicant-build-args}

x-common-env: &common-env
  REPLICANT_ENV: local
  REPLICANT_ORG: local
  REPLICANT_REGION: local-1
  REPLICANT_LOG_FORMAT: json
  REPLICANT_TEMPORAL_ADDRESS: temporal:7233
  REPLICANT_TEMPORAL_NAMESPACE: replicant-local
  REPLICANT_TEMPORAL_TLS: "false"
  REPLICANT_TEMPORAL_CODEC_KEY_FILE: /run/secrets/temporal_codec_key
  REPLICANT_S3_ENDPOINT: http://s3.replicant.localhost:8333
  REPLICANT_S3_PUBLIC_ENDPOINT: http://s3.replicant.localhost:8333
  REPLICANT_S3_REGION: us-east-1
  REPLICANT_S3_FORCE_PATH_STYLE: "true"
  REPLICANT_S3_SSE_MODE: sse-s3
  REPLICANT_SCHEMA_REVISION_CHECK: strict
  REPLICANT_OIDC_ISSUER: http://dex.replicant.localhost:5556/dex
  REPLICANT_LANGFUSE_HOST: http://langfuse.replicant.localhost:3000
  REPLICANT_LANGFUSE_PUBLIC_KEY: pk-lf-replicant-local
  REPLICANT_LANGFUSE_SECRET_KEY_FILE: /run/secrets/langfuse_secret_key
  REPLICANT_IDENTITY_URL: http://identity-service:8080
  REPLICANT_CONTROL_PLANE_URL: http://control-plane-api:8401
  REPLICANT_MEMORY_URL: http://memory-service:8080
  REPLICANT_TOKEN_BROKER_URL: http://github-token-broker:8080
  # Kill switches (C-MSG 2.0.0 ops.kill_switch, C-ART 2.0.0 ops bucket): the out-of-band mirror that intake, the
  # Publisher and runner.start_run (ops.read_kill_switches) read when Postgres is down. Same key as prod, in the
  # local S3 store; control-plane-api is the only writer (XD-FIX-R2-016-WS07). Prod also mirrors to a ConfigMap.
  REPLICANT_KILL_SWITCH_MIRROR: s3://local-replicant-local-ops/kill-switches/v1/state.json
  # S3 credentials for replicant services. Locally one identity `replicant-services` (parity.md P-41); prod uses one
  # IAM role per service (Pod Identity). INI file rendered by `replicant dev up`.
  AWS_SHARED_CREDENTIALS_FILE: /run/secrets/s3_services_credentials
  AWS_CONFIG_FILE: /dev/null
  OTEL_SDK_DISABLED: ${REPLICANT_OTEL_DISABLED:-true}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_TRACES_SAMPLER: parentbased_always_on

x-run-token-verifier-env: &run-token-verifier-env
  # Runner JWKS and issuers: runner-local and, in the k8s profile, the kind runner-api (R1-258).
  REPLICANT_RUN_TOKEN_ISSUERS: http://runner-local:8480,http://runner-api.replicant-runner.svc:8480
  REPLICANT_RUN_TOKEN_JWKS_URLS: http://runner-local:8490/.well-known/jwks.json,http://replicant-local-control-plane:30490/.well-known/jwks.json
  # Exec revocation feed (C-RUNNER 3.0.0 GET /v1/revocations, CCR-02-09): polled every 10 s from runner-local and,
  # in the k8s profile, the kind runner-api; a listed run_id is rejected even if its token is unexpired.
  REPLICANT_EXEC_REVOCATIONS_URLS: http://runner-local:8480/v1/revocations,http://replicant-local-control-plane:30480/v1/revocations
  REPLICANT_EXEC_REVOCATIONS_TOKEN_FILE: /run/secrets/runner_revocations_token
  REPLICANT_EXEC_REVOCATIONS_POLL_SECONDS: "10"

x-python-service: &python-service
  restart: unless-stopped
  networks: [core]
  init: true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "3"}

# Replaces the spec's migrate + s3-init (+ temporal-bootstrap): `init` runs migrations, creates the buckets and the
# Gitea fixtures; the Temporal dev server registers the namespace and search attributes itself and reports healthy
# only once they exist.
x-requires-init: &requires-init
  init: {condition: service_completed_successfully}

x-requires-init-temporal: &requires-init-temporal
  init: {condition: service_completed_successfully}
  temporal: {condition: service_healthy}

x-http-healthcheck: &http-healthcheck
  test: ["CMD", "python", "-c", "import sys,urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 20s

services:
  # ---------------------------------------------------------------------------------------------
  # Stores
  # ---------------------------------------------------------------------------------------------
  postgres-replicant:
    # Prod parity (XD-10-03): pgvector 0.8.2 (the Aurora version) plus pgaudit. Built from
    # dev/postgres-replicant/Dockerfile: FROM pgvector/pgvector:0.8.2-pg17-bookworm + postgresql-17-pgaudit.
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/postgres:17-pgvector0.8.2
    build: {context: "${REPLICANT_REPO_ROOT:-../..}/dev/postgres-replicant"}
    restart: unless-stopped
    networks: [core]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_replicant_superuser
      POSTGRES_DB: replicant
      REPLICANT_MIGRATOR_PASSWORD_FILE: /run/secrets/db_replicant_migrator
    secrets: [pg_replicant_superuser, db_replicant_migrator]
    volumes:
      - pg-replicant-data:/var/lib/postgresql/data
      # WS-10 files, unmodified (postgres.md §10): fake RDS roles, then the production bootstrap SQL.
      - "${REPLICANT_REPO_ROOT:-../..}/libs/python/replicant-db/bootstrap/00-fake-rds-roles.sql:/docker-entrypoint-initdb.d/00-fake-rds-roles.sql:ro"
      - "${REPLICANT_REPO_ROOT:-../..}/libs/python/replicant-db/bootstrap/00-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro"
      - ./config/postgres-replicant/02-migrator-password.sh:/docker-entrypoint-initdb.d/02-migrator-password.sh:ro
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements,pgaudit", "-c", "pgaudit.log=ddl,role", "-c", "max_connections=300", "-c", "log_min_duration_statement=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d replicant"]
      interval: 3s
      timeout: 3s
      retries: 40

  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks:
      core:
        aliases: [s3.replicant.localhost]
    # PLATFORM-D8: init applies WS-10's default bucket encryption (SSE-S3); SeaweedFS 4.48 then fails every PUT with
    # InternalError unless it has an SSE key. The key comes from the generated .env (third-party image, no *_FILE).
    environment:
      WEED_S3_SSE_KEY: ${REPLICANT_S3_SSE_KEY:?run replicant dev up to generate dev/compose/.env}
    # A fixed volume slot count instead of -volume.max=0 (auto), which derives it from the free disk at start: on a
    # laptop with little free space that is fewer slots than the collections need (each grows several volumes), and
    # writes fail with "no free volumes left". Volumes are created on demand and sparse, so this reserves no space.
    command:
      - server
      - -dir=/data
      - -volume.max=128
      - -master.volumeSizeLimitMB=1024
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -s3.allowDeleteBucketNotEmpty=false
    volumes:
      - s3-data:/data
      # Rendered by `replicant dev up` from config/s3/*.json.tmpl with the generated keys.
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/generated/s3.json:/etc/seaweedfs/s3.json:ro
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/generated/iam.json:/etc/seaweedfs/iam.json:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  # PLATFORM-D1: Temporal CLI dev server (server 1.32.0, SQLite file persisted in a volume) instead of
  # temporalio/server 1.32.1 on postgres-temporal + temporal-schema. Same address temporal:7233, same namespace,
  # same dynamic config keys as config/temporal/dynamicconfig.yaml (passed as --dynamic-config-value).
  # SIMPLIFY-D1: the dev server's built-in UI replaces temporal-ui (same port 8233, no OIDC or codec as before,
  # PLATFORM-D2), and its --namespace/--search-attribute flags replace temporal-bootstrap: the namespace and the
  # 14 C-IDS §4.1 search attributes of config/temporal/bootstrap.sh, checked by the healthcheck.
  temporal:
    image: temporalio/admin-tools:1.32.1
    user: "0:0"
    restart: unless-stopped
    networks:
      core:
        aliases: [temporal.replicant.localhost]
    entrypoint:
      - temporal
      - server
      - start-dev
      - --ip=0.0.0.0
      - --port=7233
      - --ui-ip=0.0.0.0
      - --ui-port=8233
      - --db-filename=/var/lib/temporal-dev/temporal.db
      - --namespace=replicant-local
      - --log-level=warn
      # C-IDS §4.1: 8 Keyword, 2 KeywordList, 2 Int, 1 Datetime, 1 Bool
      - --search-attribute=ReplicantJobId=Keyword
      - --search-attribute=ReplicantTenantId=Keyword
      - --search-attribute=ReplicantWorkflowType=Keyword
      - --search-attribute=ReplicantStatus=Keyword
      - --search-attribute=ReplicantPhase=Keyword
      - --search-attribute=ReplicantReleaseBundleId=Keyword
      - --search-attribute=ReplicantParentJobId=Keyword
      - --search-attribute=ReplicantRiskLevel=Keyword
      - --search-attribute=ReplicantRepos=KeywordList
      - --search-attribute=ReplicantOpenGateIds=KeywordList
      - --search-attribute=ReplicantRepairCycle=Int
      - --search-attribute=ReplicantProjectionSeq=Int
      - --search-attribute=ReplicantWaitingSince=Datetime
      - --search-attribute=ReplicantAwaitingHuman=Bool
      - --dynamic-config-value=limit.maxIDLength=255
      - --dynamic-config-value=system.forceSearchAttributesCacheRefreshOnRead=true
      - --dynamic-config-value=frontend.enableUpdateWorkflowExecution=true
      - --dynamic-config-value=frontend.enableUpdateWorkflowExecutionAsyncAccepted=true
      - --dynamic-config-value=system.enableDeploymentVersions=true
      - --dynamic-config-value=frontend.workerVersioningWorkflowAPIs=true
      - --dynamic-config-value=frontend.namespaceRPS=2400
      - --dynamic-config-value=history.maximumSignalsPerExecution=10000
      - --dynamic-config-value=limit.historyCount.warn=10240
      - --dynamic-config-value=limit.historyCount.error=51200
    volumes:
      - temporal-dev-data:/var/lib/temporal-dev
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    healthcheck:
      test: ["CMD-SHELL", "temporal operator search-attribute list -n replicant-local --address 127.0.0.1:7233 | grep -q ReplicantAwaitingHuman"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # One-shot init (SIMPLIFY-D3): replaces migrate, s3-init and gitea-bootstrap. Idempotent; every replicant
  # service waits for it. images/replicant-py/init.py: migrations (D-26), buckets, Gitea fixtures (PLATFORM-D6).
  # ---------------------------------------------------------------------------------------------
  init:
    <<: *replicant-py
    networks: [core]
    depends_on:
      postgres-replicant: {condition: service_healthy}
      s3: {condition: service_healthy}
      gitea: {condition: service_healthy}
    command: ["python", "/opt/replicant/init.py"]
    environment:
      # migrate: `replicant-db migrate` = take advisory lock, apply roles/grants (WS-10), alembic upgrade head,
      # verify no model/schema drift, record the run in ops.migration_runs, release lock.
      REPLICANT_ENV: local
      REPLICANT_DB_HOST: postgres-replicant
      REPLICANT_DB_NAME: replicant
      REPLICANT_DB_USER: replicant_migrator
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_replicant_migrator
      REPLICANT_DB_ROLE_PASSWORDS_DIR: /run/secrets
      REPLICANT_MIGRATE_LOCK_TIMEOUT_SECONDS: "120"
      # s3: the seven C-ART bucket classes, ops and local-langfuse, with WS-10's generated local configs.
      AWS_ACCESS_KEY_ID: replicant-admin
      AWS_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_admin_secret
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://s3.replicant.localhost:8333
      REPLICANT_ORG: local
      # gitea: `gitea`, not git.replicant.localhost (curl and libcurl resolve *.localhost to 127.0.0.1 themselves).
      GITEA_URL: http://gitea:3300
      GITEA_ADMIN_PASSWORD_FILE: /run/secrets/gitea_admin_password
      GITEA_BOT_PASSWORD_FILE: /run/secrets/gitea_bot_password
      GITEA_WEBHOOK_SECRET_FILE: /run/secrets/gitea_webhook_secret
      GITEA_WEBHOOK_URL: http://control-plane-api:8401/webhooks/gitea
      GITEA_ORG: acme-payments
      GITEA_SAMPLE_REPOS: ledger-api billing-py web-console   # dev/sample-repos/<name>
    secrets:
      - db_replicant_migrator
      - db_svc_control_plane_api
      - db_svc_identity_service
      - db_svc_github_integration
      - db_svc_slack_integration
      - db_svc_replicant_projector
      - db_svc_memory_service
      - db_svc_ecosystem_indexer
      - db_svc_context_mcp
      - db_svc_usage_ingestor
      - db_svc_eval_worker
      - db_svc_replicant_worker
      - db_svc_publisher_worker
      - db_svc_github_token_broker
      - db_svc_retention_sweeper
      - db_grafana_ro
      - s3_admin_secret
      - gitea_admin_password
      - gitea_bot_password
      - gitea_webhook_secret
    volumes:
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/s3/local:/init/s3-local:ro"
      - "${REPLICANT_REPO_ROOT:-../..}/dev/sample-repos:/sample-repos:ro"
    restart: "no"

  # ---------------------------------------------------------------------------------------------
  # Control plane (core: control-plane-api with run grants, github-integration, Slack and the projector's
  # activity worker in one process, SIMPLIFY Phase 2) and the token broker
  # ---------------------------------------------------------------------------------------------
  # NOTIFY (DEVIATIONS NOTIFY-*): notification fan-out, dispatcher and reminder scheduler. Links in comments and DMs
  # point at the browser addresses of the local stack. Thresholds: REPLICANT_NOTIFY_PR_IDLE_SECONDS (first PR-waiting
  # reminder), ..._PR_REMIND_EVERY_SECONDS (then at most once per period), ..._JOB_MAX_AGE_DAYS and
  # ..._LIFETIME_LEAD_SECONDS (escalation to tenant admins), ..._QUIET_HOURS (default 20:00-08:00,weekends).
  control-plane-api:
    <<: [*python-service, *replicant-py]
    networks:
      core:
        aliases: [api.replicant.localhost]
    depends_on:
      <<: *requires-init-temporal
      github-token-broker: {condition: service_healthy}
    command: ["control-plane-api", "serve"]
    environment:
      <<: *common-env
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces   # M2: OTLP/HTTP to Alloy
      REPLICANT_HTTP_PORT: "8401"
      REPLICANT_DB_DSN: postgresql+psycopg://svc_control_plane_api@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_control_plane_api
      REPLICANT_OIDC_CLIENT_ID: replicant-web
      REPLICANT_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_replicant_web
      REPLICANT_OIDC_CLI_CLIENT_ID: replicant-cli
      REPLICANT_OIDC_REDIRECT_URI: http://app.replicant.localhost:8400/auth/callback
      REPLICANT_ADMIN_GROUP: replicant-admins
      REPLICANT_OPERATOR_GROUP: replicant-operators
      REPLICANT_WEB_ORIGIN: http://app.replicant.localhost:8400
      REPLICANT_DEV_SEED_TOKEN_FILE: /run/secrets/dev_seed_token   # honored only when REPLICANT_ENV=local
      REPLICANT_RUNNER_DEFAULT: ${REPLICANT_RUNNER:-local}
      REPLICANT_KILL_SWITCH_MIRROR_WRITE: "true"     # sole writer of ops kill-switches/v1/state.json (If-Match / If-None-Match)
      REPLICANT_GATEWAY_SHIM_URL: http://gateway-shim:8420      # POST /internal/v1/revocations on cancel/takeover
      REPLICANT_GATEWAY_SERVICE_TOKEN_FILE: /run/secrets/gateway_service_token
      # Local-only static callers of /internal/v1/** (token -> principal, e.g. svc_replicant-gateway-shim); prod verifies
      # projected ServiceAccount tokens (identity.md E24). Honored only when REPLICANT_ENV=local (XD-W3-R1V-067).
      REPLICANT_INTERNAL_CALLER_TOKENS_FILE: /run/secrets/control_plane_internal_callers
      REPLICANT_NOTIFY_WEB_URL: ${REPLICANT_NOTIFY_WEB_URL:-http://127.0.0.1:8400}
      REPLICANT_NOTIFY_SCM_WEB_URLS: git.replicant.localhost:3300=http://127.0.0.1:3300
      REPLICANT_NOTIFY_PR_IDLE_SECONDS: ${REPLICANT_NOTIFY_PR_IDLE_SECONDS:-86400}
      REPLICANT_NOTIFY_PR_REMIND_EVERY_SECONDS: ${REPLICANT_NOTIFY_PR_REMIND_EVERY_SECONDS:-86400}
      REPLICANT_NOTIFY_JOB_MAX_AGE_DAYS: ${REPLICANT_NOTIFY_JOB_MAX_AGE_DAYS:-60}
      REPLICANT_NOTIFY_LIFETIME_LEAD_SECONDS: ${REPLICANT_NOTIFY_LIFETIME_LEAD_SECONDS:-604800}
      REPLICANT_NOTIFY_SWEEP_SECONDS: ${REPLICANT_NOTIFY_SWEEP_SECONDS:-30}
      REPLICANT_NOTIFY_QUIET_HOURS: ${REPLICANT_NOTIFY_QUIET_HOURS:-20:00-08:00,weekends}
      REPLICANT_MEMORY_TOKEN_FILE: /run/secrets/memory_cpa_token      # MEM: /v1/admin/memory proxy, job memory view
      # No run grants (SIMPLIFY-D50, ADR-015): runner-local checks each run against this job's intake record
      # (GET /internal/v1/jobs/{id}/run-scope) and polls GET /internal/v1/revocations with its caller token.
      # github-integration module (own login svc_github_integration). Two webhook routes (WS-07 G-9): /github/webhook
      # (dev GitHub App via the Cloudflare quick tunnel, X-Hub-Signature-256 over the raw body) and /webhooks/gitea
      # (local Gitea, normalized by the gitea adapter).
      REPLICANT_GITHUB_INTEGRATION_DB_DSN: postgresql+psycopg://svc_github_integration@postgres-replicant:5432/replicant
      REPLICANT_GITHUB_INTEGRATION_DB_PASSWORD_FILE: /run/secrets/db_svc_github_integration
      REPLICANT_GITEA_WEBHOOK_SECRET_FILE: /run/secrets/gitea_webhook_secret
      REPLICANT_GITHUB_APP_REGISTRATION: dev
      # The dev App webhook secret is read from `replicant secret-agent` (keyring-backed; WS-07 github-app.md §5.3)
      # over a Unix socket, never from a file or env var. Absent until `replicant dev github-app create`.
      REPLICANT_SECRET_AGENT_SOCKET: /run/replicant-secret-agent/agent.sock
      REPLICANT_GITHUB_WEBHOOK_SECRET_REF: secret-agent:replicant-dev/github-app/webhook_secret
      REPLICANT_GITEA_BASE_URL: http://git.replicant.localhost:3300
      REPLICANT_REPLICANT_BOT_LOGINS: replicant-bot
      REPLICANT_TOKEN_BROKER_TOKEN_FILE: /run/secrets/broker_github_integration_token
      # projector module (own login svc_replicant_projector; polls replicant-projections, fixed in code).
      REPLICANT_PROJECTOR_DB_DSN: postgresql+psycopg://svc_replicant_projector@postgres-replicant:5432/replicant
      REPLICANT_PROJECTOR_DB_PASSWORD_FILE: /run/secrets/db_svc_replicant_projector
      REPLICANT_WORKER_BUILD_ID: ${REPLICANT_WORKER_BUILD_ID:-b20261024-000000000000}
      REPLICANT_WORKER_SET_CURRENT_ON_START: "true"
      # Slack module, against slack-mock (profile `slack`): `replicant dev up --profile v0,slack` sets
      # REPLICANT_SLACK_ENABLED=true in .env. Off, Slack deliveries are recorded and not sent.
      REPLICANT_SLACK_ENABLED: ${REPLICANT_SLACK_ENABLED:-false}
      REPLICANT_SLACK_INTEGRATION_DB_DSN: postgresql+psycopg://svc_slack_integration@postgres-replicant:5432/replicant
      REPLICANT_SLACK_INTEGRATION_DB_PASSWORD_FILE: /run/secrets/db_svc_slack_integration
      SLACK_SIGNING_SECRET_FILE: /run/secrets/slack_signing_secret
      SLACK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
      # Bolt for Python honors a custom Web API base URL; the mock implements the subset used.
      SLACK_API_URL: http://slack-mock:8410/api/
      REPLICANT_WEB_URL: http://127.0.0.1:8400
    secrets: [db_svc_control_plane_api, oidc_replicant_web, temporal_codec_key, langfuse_secret_key, dev_seed_token, gateway_service_token, s3_services_credentials, control_plane_internal_callers, memory_cpa_token, db_svc_github_integration, gitea_webhook_secret, broker_github_integration_token, db_svc_replicant_projector, db_svc_slack_integration, slack_signing_secret, slack_bot_token]
    volumes:
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/secret-agent:/run/replicant-secret-agent
    ports: ["127.0.0.1:8401:8401"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8401/readyz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # WEB-01: the management UI. Local identity is the X-Replicant-Dev-User header (no Dex/BFF in v0).
  control-plane-web:
    image: ${REPLICANT_IMAGE_REGISTRY:-localhost/replicant}/control-plane-web:${REPLICANT_IMAGE_TAG:-dev}
    build: {context: "${REPLICANT_REPO_ROOT:-../..}", dockerfile: web/control-plane-web/Dockerfile, args: *replicant-build-args}
    restart: unless-stopped
    networks:
      core:
        aliases: [app.replicant.localhost]
    depends_on:
      control-plane-api: {condition: service_healthy}
    environment:
      NGINX_PORT: "8400"
      REPLICANT_API_UPSTREAM: http://control-plane-api:8401
    ports: ["127.0.0.1:8400:8400"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8400/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 20

  # CONTROL-02: static caller tokens for the token broker (M1, local only).
  github-token-broker:
    <<: [*python-service, *replicant-py]
    depends_on: *requires-init
    command: ["github-token-broker", "serve"]
    environment:
      <<: *common-env
      REPLICANT_HTTP_PORT: "8080"
      REPLICANT_BROKER_CALLERS_FILE: /etc/replicant/broker-callers.yaml
      REPLICANT_BROKER_CALLER_TOKENS_FILE: /run/secrets/broker_caller_tokens
      # Provider backends: `gitea` mints scoped Gitea access tokens for the replicant-bot user and deletes
      # them after REPLICANT_BROKER_GITEA_TOKEN_TTL (Gitea tokens have no expiry; parity.md P-12).
      # `github` uses the dev App private key when present (walkthrough 11).
      REPLICANT_BROKER_GITEA_BASE_URL: http://git.replicant.localhost:3300
      REPLICANT_BROKER_GITEA_BOT_USER: replicant-bot
      REPLICANT_BROKER_GITEA_BOT_PASSWORD_FILE: /run/secrets/gitea_bot_password
      REPLICANT_BROKER_GITEA_TOKEN_TTL: 3600s
      # Dev App private key: read through `replicant secret-agent` (keyring), so the PEM never lands in a compose
      # file, env var or secret file (WS-07 github-app.md §5.3). Prod: KMS key alias/replicant/<env>/github-app.
      REPLICANT_SECRET_AGENT_SOCKET: /run/replicant-secret-agent/agent.sock
      REPLICANT_BROKER_GITHUB_APP_KEY_REF: secret-agent:replicant-dev/github-app/pem
      REPLICANT_BROKER_GITHUB_APP_ENV_FILE: /etc/replicant/github-app.env       # non-secret: app id, slug, client id
      # audit.emit and the C-PG rule-8 startup revision check (WS-10 postgres.md §3.2: login svc_github_token_broker).
      REPLICANT_DB_DSN: postgresql+psycopg://svc_github_token_broker@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_github_token_broker
    secrets: [gitea_bot_password, db_svc_github_token_broker, broker_caller_tokens]
    volumes:
      - ./config/github-token-broker/broker-callers.yaml:/etc/replicant/broker-callers.yaml:ro
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/secret-agent:/run/replicant-secret-agent
      - ${REPLICANT_DEV_HOME:-./.replicant-dev}/github-app.env:/etc/replicant/github-app.env:ro
    healthcheck: *http-healthcheck

  # NOTIFY: Slack DMs through core's Slack module against slack-mock. Opt-in profile `slack` (SIMPLIFY-D1).
  slack-mock:
    profiles: [slack]
    <<: [*python-service, *replicant-py]
    networks:
      core:
        aliases: [slack.replicant.localhost]
    command: ["slack-mock", "serve"]
    environment:
      SLACK_MOCK_PORT: "8410"
      SLACK_MOCK_CONFIG: /etc/slack-mock/workspace.yaml
      SLACK_MOCK_SIGNING_SECRET_FILE: /run/secrets/slack_signing_secret
      SLACK_MOCK_BOT_TOKEN_FILE: /run/secrets/slack_bot_token
      SLACK_MOCK_INTERACTIVITY_URL: http://control-plane-api:8401/slack/interactions
      SLACK_MOCK_COMMANDS_URL: http://control-plane-api:8401/slack/commands
      SLACK_MOCK_EVENTS_URL: http://control-plane-api:8401/slack/events
    secrets: [slack_signing_secret, slack_bot_token]
    volumes: [./config/slack-mock/workspace.yaml:/etc/slack-mock/workspace.yaml:ro]
    ports: ["127.0.0.1:8410:8410"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8410/healthz',timeout=3)"]
      interval: 10s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------------------------------------
  # Workers (Temporal)
  # ---------------------------------------------------------------------------------------------
  # WORKER-02: control-plane-api caller token (POST /internal/v1/notifications) and the gateway script set.
  replicant-worker:
    <<: [*python-service, *replicant-py]
    depends_on:
      <<: *requires-init-temporal
      gateway-shim: {condition: service_started}
      runner-local: {condition: service_started}
      github-token-broker: {condition: service_healthy}   # read tokens for the run's git bundle (SIMPLIFY-D40)
      gitea: {condition: service_healthy}
    command: ["replicant-worker", "run"]
    environment:
      <<: *common-env
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces   # M2: OTLP/HTTP to Alloy
      REPLICANT_WORKER_DEPLOYMENT_NAME: replicant-worker
      REPLICANT_WORKER_BUILD_ID: ${REPLICANT_WORKER_BUILD_ID:-b20261024-000000000000}
      REPLICANT_WORKER_SET_CURRENT_ON_START: "true"     # local only; CI/Argo do this in prod (parity.md P-07)
      # Task queues are fixed by the worker code (WS-01 reference worker.py): replicant-jobs, replicant-runner-calls,
      # replicant-llm-calls. No env var selects them (R1-267).
      REPLICANT_DB_DSN: postgresql+psycopg://svc_replicant_worker@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_replicant_worker
      # Runner selection: `local` -> runner-local; `k8s` -> runner-api in kind (walkthrough 10).
      REPLICANT_RUNNER_URL: ${REPLICANT_RUNNER_URL:-http://runner-local:8480}
      REPLICANT_RUNNER_TOKEN_FILE: /run/secrets/runner_worker_token   # static dev key (C-RUNNER: local profile)
      REPLICANT_GATEWAY_URL: http://gateway-shim:8420      # in-worker LLM calls and PUT /internal/v1/runs/{id}/policy
      REPLICANT_GATEWAY_SERVICE_TOKEN_FILE: /run/secrets/gateway_service_token
      # Replay cassette set for e2e/walkthrough runs (gateway-stub.md §3); empty = none (passthrough/record).
      REPLICANT_GATEWAY_CASSETTE_SET: ${REPLICANT_GATEWAY_CASSETTE_SET:-}
      # Deterministic runs (WS-03 run plan `effective.deterministic`, XD-11-09): on whenever a cassette set is replayed.
      REPLICANT_DETERMINISTIC_RUNS: ${REPLICANT_DETERMINISTIC_RUNS:-false}
      REPLICANT_CONTEXT_MCP_URL: http://context-mcp:8080
      REPLICANT_CONTROL_PLANE_TOKEN_FILE: /run/secrets/replicant_worker_cp_token
      REPLICANT_GATEWAY_SCRIPT_SET: ${REPLICANT_GATEWAY_SCRIPT_SET:-walkthrough-ledger-api}
      # per-repo script sets (repo=set,...): billing-py jobs replay tests/fixtures/gateway-scripts/walkthrough-billing-py
      REPLICANT_GATEWAY_SCRIPT_SETS: ${REPLICANT_GATEWAY_SCRIPT_SETS:-billing-py=walkthrough-billing-py}
      REPLICANT_METRICS_BIND: "off"
      # MEM-D20: read-only Gitea access through the broker (activities/pr_inspect.py)
      REPLICANT_TOKEN_BROKER_TOKEN_FILE: /run/secrets/broker_worker_token
      REPLICANT_GITEA_BASE_URL: http://gitea:3300
    secrets: [db_svc_replicant_worker, runner_worker_token, gateway_service_token, temporal_codec_key, langfuse_secret_key, s3_services_credentials, replicant_worker_cp_token, broker_worker_token]
    healthcheck:
      test: ["CMD", "replicant-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  publisher-worker:
    <<: [*python-service, *replicant-py]
    depends_on:
      <<: *requires-init-temporal
      github-token-broker: {condition: service_healthy}
    command: ["publisher-worker", "run"]
    environment:
      <<: *common-env
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces   # M2: OTLP/HTTP to Alloy
      REPLICANT_WORKER_DEPLOYMENT_NAME: publisher-worker
      REPLICANT_WORKER_BUILD_ID: ${REPLICANT_WORKER_BUILD_ID:-b20261024-000000000000}
      REPLICANT_WORKER_SET_CURRENT_ON_START: "true"
      # Polls replicant-publisher (fixed in code).
      REPLICANT_DB_DSN: postgresql+psycopg://svc_publisher_worker@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_publisher_worker
      REPLICANT_TOKEN_BROKER_TOKEN_FILE: /run/secrets/broker_publisher_token
      # `gitea`, not git.replicant.localhost: git uses libcurl, which resolves *.localhost to 127.0.0.1 (PLATFORM-03).
      REPLICANT_GITEA_BASE_URL: http://gitea:3300
    secrets: [db_svc_publisher_worker, temporal_codec_key, s3_services_credentials, broker_publisher_token]
    healthcheck:
      test: ["CMD", "publisher-worker", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------------------------
  # Memory
  # ---------------------------------------------------------------------------------------------
  # MEM (DEVIATIONS MEM-D1): memory-service without identity-service (admin membership comes signed from
  # control-plane-api and is re-checked here) and without embeddings or the memory MCP (MEM-D2). Static caller
  # tokens: memory_internal_callers (control-plane-api memory_cpa_token, replicant-worker replicant_worker_cp_token).
  memory-service:
    <<: [*python-service, *replicant-py]
    depends_on: *requires-init
    command: ["memory-service", "serve"]
    environment:
      <<: [*common-env, *run-token-verifier-env]
      REPLICANT_HTTP_PORT: "8080"            # internal API + admin curation backend (D-25)
      REPLICANT_MCP_PORT: "8081"             # memory MCP for sandboxes (run-token auth, audience memory-mcp)
      REPLICANT_DB_DSN: postgresql+psycopg://svc_memory_service@postgres-replicant:5432/replicant
      REPLICANT_DB_PASSWORD_FILE: /run/secrets/db_svc_memory_service
      # Embeddings through the shim (XD-FIX-R2-057): POST /embeddings/v1/embeddings, X-Replicant-Purpose: embedding,
      # X-Replicant-Tenant-Id; backfills add X-Replicant-Pipeline-Id. No provider key in memory-service.
      REPLICANT_EMBEDDINGS_URL: http://gateway-shim:8420/embeddings/v1/embeddings
      REPLICANT_EMBEDDINGS_MODEL: voyage/voyage-code-4
      REPLICANT_EMBEDDINGS_DIMENSIONS: "1024"
      REPLICANT_GATEWAY_SERVICE_TOKEN_FILE: /run/secrets/gateway_service_token
      REPLICANT_MEMORY_CALLER_TOKENS_FILE: /run/secrets/memory_internal_callers
      REPLICANT_GATEWAY_URL: http://gateway-shim:8420
    secrets: [db_svc_memory_service, gateway_service_token, runner_revocations_token, s3_services_credentials, memory_internal_callers]
    healthcheck: *http-healthcheck

  # ---------------------------------------------------------------------------------------------
  # Local Git server (Gitea; ADR-11-002)
  # ---------------------------------------------------------------------------------------------
  gitea:
    image: gitea/gitea:28.1.0-rootless
    restart: unless-stopped
    networks:
      core:
        aliases: [git.replicant.localhost]
    # SIMPLIFY-D3: the spec bootstrap.sh (site admin `gitea-admin`, user `replicant-bot`; Gitea CLI only) runs inside
    # this container once the server answers; the healthcheck passes only after it. The rest of the v0 Gitea
    # bootstrap (PLATFORM-D6) is the `init` one-shot's, through the API.
    entrypoint: ["/usr/bin/dumb-init", "--", "/bin/sh", "/scripts/entrypoint-v0.sh"]
    environment:
      GITEA__server__HTTP_PORT: "3300"
      GITEA__server__ROOT_URL: http://git.replicant.localhost:3300/
      GITEA__server__DOMAIN: git.replicant.localhost
      GITEA__server__DISABLE_SSH: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__ALLOWED_HOST_LIST: private
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__actions__ENABLED: "false"
      GITEA__webhook__DELIVER_TIMEOUT: "10"
      GITEA__log__LEVEL: Info
      GITEA_ADMIN_PASSWORD_FILE: /run/secrets/gitea_admin_password
      GITEA_BOT_PASSWORD_FILE: /run/secrets/gitea_bot_password
    secrets: [gitea_admin_password, gitea_bot_password]
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - ./config/gitea/entrypoint-v0.sh:/scripts/entrypoint-v0.sh:ro
      - ./config/gitea/bootstrap.sh:/scripts/bootstrap.sh:ro
    ports: ["127.0.0.1:3300:3300"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/replicant-bootstrap.done && wget -q -O /dev/null http://127.0.0.1:3300/api/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 10s

  # ---------------------------------------------------------------------------------------------
  # Execution: runner-local (Runner API over Docker/Podman, includes the notifier),
  # gateway stub, sandbox edge, egress control
  # ---------------------------------------------------------------------------------------------
  # M3 (X0-10): sandboxes sit on the internal replicant-sbx network as in the spec stack (ADR-11-007). They reach only
  # sbx-edge (gateway, runner sandbox listener, s3, otlp, and the SNI egress
  # allowlist; SIMPLIFY-D30/D31): names resolve from /etc/hosts entries runner-local sets. Values requested by RUNNER
  # (RUNNER-01, RUNNER-05) stay; the endpoints in bootstrap.json are the sbx.local names.
  runner-local:
    <<: *replicant-go
    restart: unless-stopped
    networks: [core]
    security_opt: [label=disable]
    depends_on:
      <<: *requires-init-temporal
      control-plane-api: {condition: service_healthy}   # run-scope admission and job revocations (SIMPLIFY-D50)
    command: ["/usr/local/bin/runner-local", "serve"]
    environment:
      RUNNER_CONFIG: /etc/runner-local/runner-local.yaml
      RUNNER_ORCHESTRATION_LISTEN: 0.0.0.0:8480
      RUNNER_SANDBOX_LISTEN: 0.0.0.0:8490
      RUNNER_ISSUER: http://runner-local:8480
      RUNNER_SIGNING_KEY_FILE: /run/secrets/run_token_signing_key     # ES256 PEM; KMS in prod (parity.md P-04)
      RUNNER_WORKER_TOKENS_FILE: /run/secrets/runner_worker_tokens    # static dev keys -> subjects
      RUNNER_CONTAINER_HOST: ${REPLICANT_CONTAINER_HOST:-unix:///var/run/docker.sock}
      RUNNER_SANDBOX_NETWORK: replicant-sbx
      RUNNER_SANDBOX_EDGE_IP: 172.31.250.10   # sbx-edge: the sandboxes' hosts entries and only nameserver
      RUNNER_LOCAL_RUNTIME: ${REPLICANT_LOCAL_RUNTIME:-runc}       # runc | runsc | kata (Linux hosts)
      RUNNER_MAX_CONCURRENT_RUNS: ${REPLICANT_MAX_CONCURRENT_RUNS:-2}
      RUNNER_TEMPORAL_ADDRESS: temporal:7233                     # notifier component (Signal only)
      RUNNER_TEMPORAL_NAMESPACE: replicant-local
      # The notifier encodes Signal payloads with the tenant codec and never decodes (C-ARCH 2.0.0 fourth exec
      # role run-notifier, encrypt-only). Locally the codec key is one symmetric file key (parity.md P-35).
      RUNNER_TEMPORAL_CODEC_KEY_FILE: /run/secrets/temporal_codec_key
      # Run admission against core's intake record (C-RUNNER 4.0.0, SIMPLIFY-D50): 422 run_scope_invalid on a mismatch.
      RUNNER_CORE_URL: http://control-plane-api:8401
      RUNNER_CORE_TOKEN_FILE: /run/secrets/runner_cp_token
      # Exec revocation feed (C-RUNNER 3.0.0, C-ART 2.0.0): served at GET /v1/revocations and persisted as
      # exec_revocation_feed objects in the ops bucket, prefix exec-revocations/local/ (90-day expiry).
      RUNNER_REVOCATIONS_BUCKET: local-replicant-local-ops
      RUNNER_REVOCATIONS_PREFIX: exec-revocations/local/
      RUNNER_REVOCATIONS_READERS_FILE: /run/secrets/runner_revocations_readers   # static dev tokens of the four verifiers
      RUNNER_S3_ENDPOINT: http://s3.replicant.localhost:8333
      RUNNER_S3_STS_ENDPOINT: http://s3.replicant.localhost:8333
      RUNNER_S3_ACCESS_KEY_ID: runner-local
      RUNNER_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/s3_runner_secret
      RUNNER_REGISTRY_BUCKET: local-replicant-local-registry
      RUNNER_AGENTRUN_RETENTION: 1080h      # 45 days, same as prod GC (C-CRD §5)
      RUNNER_STATE_DIR: /var/lib/runner-local
      OTEL_SDK_DISABLED: ${REPLICANT_OTEL_DISABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      RUNNER_SANDBOX_DIRECT_EGRESS: "false"
      RUNNER_SANDBOX_RUNNER_URL: http://runner-sandbox.sbx.local
      RUNNER_SANDBOX_GATEWAY_URL: http://gateway.sbx.local
      RUNNER_SANDBOX_S3_ENDPOINT: http://s3.sbx.local
      RUNNER_SANDBOX_OTLP_URL: http://otlp.sbx.local
      # No package mirrors in v0 (PLATFORM-D18): Go modules via https://proxy.golang.org, passed through by sbx-edge's
      # SNI allowlist (SIMPLIFY-D31). npm/PyPI mirror variables keep their sbx.local values (unused).
      RUNNER_SANDBOX_EXTRA_ENV: GOPROXY=https://proxy.golang.org
      # Sandbox S3 credentials: STS AssumeRole with the per-run session policy (SeaweedFS advanced IAM, iam.json).
      RUNNER_S3_STS_ROLE_ARN: arn:aws:iam::000000000000:role/replicant-sandbox-artifacts
      RUNNER_STATE_VOLUME: replicant_runner-local-state
      RUNNER_S3_CREDENTIALS_FILE: /run/secrets/s3_services_credentials
      # M3: per-run sandbox log flush into Alloy (deploy/observability/alloy/v0-sandbox-flush.alloy); a no-op
      # (retried, then dropped) when the observability profile is not up.
      RUNNER_LOG_FLUSH_URL: http://alloy:3500/loki/api/v1/push
      # Test hook for RC-CAN-01 only: runs whose logical activity ID starts with `holdpending` stay Pending. No
      # replicant workflow uses that prefix (logical IDs are <node_key>.c<n>.n<n>.<effect>, node keys from graphs).
      RUNNER_TEST_HOOKS: "${RUNNER_TEST_HOOKS:-false}"   # set RUNNER_TEST_HOOKS=true when running RC-CAN-01
    secrets: [run_token_signing_key, runner_worker_tokens, s3_runner_secret, temporal_codec_key, runner_revocations_readers, s3_services_credentials, runner_cp_token]
    volumes:
      - ${REPLICANT_CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - runner-local-state:/var/lib/runner-local
      - ./config/runner-local/runner-local.yaml:/etc/runner-local/runner-local.yaml:ro
    ports: ["127.0.0.1:8480:8480"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/runner-local", "healthcheck", "--url", "http://127.0.0.1:8480/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30

  gateway-shim:
    # WS-03 replicant-gateway-shim, the production binary, with a local upstream backend (gateway.md §8, XD-03-16):
    # passthrough | record | replay | script. Auth, run-grant checks, run policy, budgets and usage events are the
    # production code path. GATEWAY-01: script backend by default (REPLICANT_GATEWAY_MODE), default script set,
    # in-memory state (GATEWAY-D1; the unused gateway-state Valkey is gone, SIMPLIFY-D1).
    <<: *replicant-go
    user: "65532:65532"
    restart: unless-stopped
    networks:
      core:
        aliases: [gateway.replicant.localhost]
      egress: {}
    depends_on:
      control-plane-api: {condition: service_healthy}
    command:
      - /usr/local/bin/replicant-gateway-shim
      - --config=/etc/gateway-shim/gateway-shim.yaml
      - --upstream-backend=${REPLICANT_GATEWAY_MODE:-script}
      - --replay-match=${REPLICANT_GATEWAY_REPLAY_MATCH:-sequence}
    environment:
      <<: *run-token-verifier-env          # audience ai-gateway
      REPLICANT_ENV: local
      REPLICANT_GATEWAY_USAGE_URL: http://usage-ingestor:8080/internal/v1/usage-events
      REPLICANT_GATEWAY_USAGE_TOKEN_FILE: /run/secrets/usage_ingest_token
      REPLICANT_GATEWAY_SERVICE_TOKENS_FILE: /run/secrets/gateway_service_tokens   # prod: projected SA tokens
      REPLICANT_GATEWAY_CASSETTE_ROOTS: tests=/cassettes/tests,evals=/cassettes/evals,scripts=/cassettes/scripts
      # Tenant quotas (WS-03 gateway.md §6.1): GET /internal/v1/tenants/{tenant_id}/gateway-quota as caller
      # svc_replicant-gateway-shim, cached <= 60 s; 404 => 402 tenant_quota_unset. Prod: projected SA token (P-26).
      REPLICANT_CONTROL_PLANE_URL: http://control-plane-api:8401
      REPLICANT_CONTROL_PLANE_TOKEN_FILE: /run/secrets/control_plane_shim_token
      # Platform usage copies to artifacts `platform/gateway-usage/` (C-ART 2.0.0), S3 identity `gateway-shim`.
      REPLICANT_GATEWAY_USAGE_S3_URI: s3://local-replicant-local-artifacts/platform/gateway-usage/
      REPLICANT_S3_ENDPOINT: http://s3.replicant.localhost:8333
      REPLICANT_S3_FORCE_PATH_STYLE: "true"
      AWS_SHARED_CREDENTIALS_FILE: /run/secrets/s3_gateway_shim_credentials
      # M2 passthrough: the key comes from secret anthropic_api_key (imported from replicant/dev/.env by
      # `replicant dev up --gateway passthrough`; empty file in script mode). No egress-proxy for the shim in v0.
      ANTHROPIC_API_KEY_FILE: /run/secrets/anthropic_api_key
      HTTPS_PROXY: ""
      NO_PROXY: usage-ingestor,runner-local,replicant-local-control-plane,s3.replicant.localhost,control-plane-api
      OTEL_SDK_DISABLED: ${REPLICANT_OTEL_DISABLED:-true}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://alloy:4318/v1/traces
      REPLICANT_GATEWAY_SCRIPT_DEFAULT_SET: walkthrough-ledger-api
      REPLICANT_GATEWAY_LOCAL_QUOTA: monthly=100,daily=10,platform_daily=50,platform_monthly=500
    # Developer provider keys for passthrough/record (WS-03 gateway.md §8): never committed, optional.
    env_file:
      - path: ${HOME:-/nonexistent}/.config/replicant/dev-keys.env
        required: false
    secrets: [usage_ingest_token, gateway_service_tokens, runner_revocations_token, s3_gateway_shim_credentials, control_plane_shim_token, anthropic_api_key]
    volumes:
      - ./config/gateway-shim:/etc/gateway-shim:ro
      - "${REPLICANT_REPO_ROOT:-../..}/tests/fixtures/cassettes:/cassettes/tests"
      - "${REPLICANT_REPO_ROOT:-../..}/evals/smoke-local/cassettes:/cassettes/evals:ro"
      - "${REPLICANT_REPO_ROOT:-../..}/tests/fixtures/gateway-scripts:/cassettes/scripts:ro"
    ports: ["127.0.0.1:8420:8420"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/replicant-gateway-shim", "healthcheck", "--url", "http://127.0.0.1:8420/readyz"]
      interval: 10s
      timeout: 3s
      retries: 20

  sbx-edge:
    # The only endpoint sandboxes can reach: HTTP routes plus the SNI egress allowlist on :443. Mirrors the prod PrivateLink/NLB
    # endpoints for the gateway shim, memory-mcp, context-mcp, runner-sandbox (runner-local and, for kind runs,
    # the kind runner-api), S3 (VPC endpoint) and OTLP. Repositories arrive as a git bundle in the run inputs (SIMPLIFY-D40). Only agentd and the WS-02 sidecars talk to it;
    # the CLI talks to agentd on 127.0.0.1:7800-7803 (WS-03 cli-invocation.md decision 7).
    image: nginx:1.30.5
    restart: unless-stopped
    networks:
      core: {}
      egress: {}            # SNI passthrough to the allowlisted upstreams (SIMPLIFY-D31)
      sbx:
        ipv4_address: 172.31.250.10
        aliases:
          - gateway.sbx.local
          - memory-mcp.sbx.local
          - context-mcp.sbx.local
          - runner-sandbox.sbx.local
          - runner-sandbox-k8s.sbx.local
          - s3.sbx.local
          - otlp.sbx.local
    depends_on:
      gateway-shim: {condition: service_healthy}
      runner-local: {condition: service_healthy}
    environment:
      # Rendered into /etc/nginx/nginx.conf by the image's envsubst entrypoint (only these variables are replaced).
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      REPLICANT_SBX_EDGE_S3_UPSTREAM: http://s3.replicant.localhost:8333
      REPLICANT_SBX_EDGE_K8S_SANDBOX_UPSTREAM: http://replicant-local-control-plane:30490
    volumes:
      - ./config/sbx-edge/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./config/sbx-edge/05-resolver.envsh:/docker-entrypoint.d/05-resolver.envsh:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------------------------------------
  # M2 observability (profile `observability`, `replicant dev up --with-observability`): WS-08 local.alloy, Loki
  # multi-tenant with WS-08 overrides, Tempo, Prometheus, Grafana with the WS-08 dashboards. No dex in v0, so
  # Grafana runs with anonymous Viewer access instead of the Dex OAuth login (PLATFORM-D15). Langfuse deferred.
  # ---------------------------------------------------------------------------------------------------------
  alloy:
    profiles: [observability]
    # WS-08's local.alloy (generated from the production pipelines, XD-08-11), at WS-08's target version, plus (M3)
    # the v0 sandbox log-flush receiver, loaded as one config directory.
    image: grafana/alloy:v1.21.2
    restart: unless-stopped
    networks: [core]
    security_opt: [label=disable]          # read the Podman socket (container discovery) in the VM
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy-v0"]
    environment:
      REPLICANT_ENV: local
      REPLICANT_CLUSTER: local
      REPLICANT_REDACTION_DIR: /etc/replicant/redaction
      TEMPO_OTLP_ENDPOINT: tempo:4317
      LANGFUSE_OTLP_TRACES_URL: http://langfuse-web:3000/api/public/otel/v1/traces
      LANGFUSE_BASIC_AUTH: ${REPLICANT_LANGFUSE_BASIC_AUTH:-cGstbGYtZmFjdG9yeS1sb2NhbDpzay1sZi1mYWN0b3J5LWxvY2Fs}
      MIMIR_PUSH_URL: http://prometheus:9090/api/v1/write
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      OTLP_TLS_DIR: /dev/null
    volumes:
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/observability/alloy/local.alloy:/etc/alloy-v0/local.alloy:ro"
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/observability/alloy/v0-sandbox-flush.alloy:/etc/alloy-v0/v0-sandbox-flush.alloy:ro"
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/observability/redaction:/etc/replicant/redaction:ro"
      - ${REPLICANT_CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports: ["127.0.0.1:12345:12345"]
    depends_on:
      loki: {condition: service_started}
      tempo: {condition: service_started}
      prometheus: {condition: service_started}

  loki:
    profiles: [observability]
    image: grafana/loki:3.7.8
    restart: unless-stopped
    networks: [core]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      # WS-08 per-tenant overrides (tenants platform, sandbox, audit; ADR-08-002), unmodified.
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/observability/loki/runtime-overrides.yaml:/etc/loki/runtime/runtime-overrides.yaml:ro"
      - loki-data:/loki
    ports: ["127.0.0.1:3100:3100"]

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    networks: [core]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes: [./config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro, tempo-data:/var/tempo]
    ports: ["127.0.0.1:3200:3200"]

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    networks: [core]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=exemplar-storage
      - --web.listen-address=0.0.0.0:9090
    volumes: [./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus-data:/prometheus]
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.0.10
    restart: unless-stopped
    networks:
      core:
        aliases: [grafana.replicant.localhost]
    depends_on:
      init: {condition: service_completed_successfully}     # the grafana_ro role
    environment:
      GF_SERVER_HTTP_PORT: "3001"
      GF_SERVER_ROOT_URL: http://grafana.replicant.localhost:3001
      GF_AUTH_GENERIC_OAUTH_ENABLED: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${REPLICANT_GRAFANA_ADMIN_PASSWORD:-replicant-local-admin}
      GF_FEATURE_TOGGLES_ENABLE: traceToMetrics
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      REPLICANT_GRAFANA_RO_PASSWORD: ${REPLICANT_GRAFANA_RO_PASSWORD:-grafana-ro-local}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - "${REPLICANT_REPO_ROOT:-../..}/deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro"
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3001"]

  # Container metrics (CPU, memory, network, state, restarts) for every container of the Podman engine, sandbox
  # containers (ar-*) included; Prometheus job "podman". Reads the rootless Podman socket like alloy (root in the
  # rootless user namespace = the VM user that owns the socket). Dashboard: deploy/grafana/dashboards/containers.json.
  podman-exporter:
    profiles: [observability]
    image: quay.io/navidys/prometheus-podman-exporter:v1.19.0      # arm64 + amd64 index, released 2025-10-04
    restart: unless-stopped
    networks: [core]
    user: "0:0"
    security_opt: [label=disable]
    command:
      - --collector.enhance-metrics        # name/image/labels on every podman_container_* series, not only _info
      - --collector.whitelisted_labels=com.docker.compose.service,replicant.example.com/run-id,replicant.example.com/tenant,replicant.example.com/role
      - --collector.cache_duration=300     # container size (rootfs) is expensive; refresh every 5 min
      - --web.disable-exporter-metrics
      - --web.max-requests=4
    environment:
      CONTAINER_HOST: unix:///run/podman/podman.sock
    volumes:
      - ${REPLICANT_CONTAINER_SOCKET:-/var/run/docker.sock}:/run/podman/podman.sock:ro
    mem_limit: 96m
    cpus: 0.25

networks:
  core:
    name: replicant-core
  sbx:
    name: replicant-sbx
    internal: true          # no route off the host; members: sbx-edge, sandboxes
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25    # sandbox containers get dynamic IPs from the upper half
          gateway: 172.31.250.1          # v0: explicit, so Podman's Docker API can describe the network (PLATFORM-D17)
    # Sandboxes resolve only from the /etc/hosts entries runner-local sets (SIMPLIFY-D30). Podman's aardvark-dns would
    # otherwise answer for the network (container names, and could forward upstream), so DNS is disabled on replicant-sbx.
    x-podman.disable_dns: true
  egress:
    name: replicant-egress

volumes:
  pg-replicant-data: {}
  s3-data: {}
  temporal-dev-data: {}
  gitea-data: {}
  gitea-config: {}
  runner-local-state: {}
  alloy-data: {}
  loki-data: {}
  tempo-data: {}
  prometheus-data: {}
  grafana-data: {}

