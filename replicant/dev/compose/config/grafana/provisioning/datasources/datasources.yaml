apiVersion: 1
datasources:
  - name: Loki (platform)
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID       # Loki multi-tenancy, WS-08 ADR-08-002
      derivedFields:
        - name: trace_id
          matcherType: label            # structured metadata key from C-IDS §9
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
    secureJsonData:
      httpHeaderValue1: platform
  - name: Loki (sandbox)
    uid: loki-sandbox
    type: loki
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID       # Loki multi-tenancy, WS-08 ADR-08-002
      derivedFields:
        - name: trace_id
          matcherType: label            # structured metadata key from C-IDS §9
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
    secureJsonData:
      httpHeaderValue1: sandbox
  - name: Loki (audit)
    uid: loki-audit
    type: loki
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID       # Loki multi-tenancy, WS-08 ADR-08-002
      derivedFields:
        - name: trace_id
          matcherType: label            # structured metadata key from C-IDS §9
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
    secureJsonData:
      httpHeaderValue1: audit
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        customQuery: true
        query: '{env="local"} | trace_id="$${__trace.traceId}"'
      serviceMap: {datasourceUid: prometheus}
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo
  - name: Replicant read models (grafana_ro)
    uid: replicant-pg
    type: grafana-postgresql-datasource
    url: postgres-replicant:5432
    user: grafana_ro
    secureJsonData:
      password: $REPLICANT_GRAFANA_RO_PASSWORD
    jsonData:
      database: replicant
      sslmode: disable
      postgresVersion: 1700
