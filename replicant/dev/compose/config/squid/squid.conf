# Local egress proxy (D-21 stand-in for Artifactory/Nexus + FQDN policy). Sandboxes have no other route
# off-host. Allowlist mirrors the prod network profiles `coding-default` and `qa-with-mirror` (WS-02/WS-09).
http_port 3128
acl sbx src 172.31.250.0/24
acl svc src all
acl SSL_ports port 443
acl CONNECT method CONNECT
# Destinations allowed for sandboxes. Package installs go to the local mirrors directly (npm/goproxy/pypi
# .sbx.local), so this list is deliberately tiny: the mirrors' own upstreams are reached by the mirrors.
acl sbx_allowed dstdomain .sbx.local
# v0 (M3, PLATFORM-D18): no package mirrors in the v0 profile (VM memory), so Go modules come from the public Go
# proxy and checksum database through this proxy, for sandboxes only. Nothing else leaves.
acl sbx_allowed dstdomain proxy.golang.org sum.golang.org
# Destinations allowed for replicant services on the egress network (gateway-stub passthrough, repo-mirror
# fetching github.com for the dev App, mirrors' upstreams).
acl svc_allowed dstdomain api.anthropic.com api.openai.com github.com api.github.com codeload.github.com
acl svc_allowed dstdomain registry.npmjs.org proxy.golang.org sum.golang.org pypi.org files.pythonhosted.org
http_access deny CONNECT !SSL_ports
http_access allow sbx sbx_allowed
http_access deny sbx
http_access allow svc_allowed
http_access deny all
cache_dir ufs /var/spool/squid 4096 16 256
maximum_object_size 512 MB
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
dns_v4_first on
