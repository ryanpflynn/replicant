global:
  scrape_interval: 15s
  external_labels: {env: local, cluster: local}
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: alloy
    static_configs: [{targets: ["alloy:12345"]}]
  - job_name: podman                      # v0 observability: prometheus-podman-exporter (compose.v0.yaml)
    static_configs: [{targets: ["podman-exporter:9882"]}]
