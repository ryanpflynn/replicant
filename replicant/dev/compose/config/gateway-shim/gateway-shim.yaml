# Local configuration of replicant-gateway-shim (WS-03 gateway.md §4.1 `gateway-shim.yaml`, §8 local backends).
# Keys follow WS-03's production config; the `local` block exists only in local images' accepted config
# (XD-FIX-R1-255). The backend is chosen by --upstream-backend (passthrough | record | replay | script).
listen: 0.0.0.0:8420
routes:
  anthropic: {prefix: /anthropic, upstream: https://api.anthropic.com, protocol: anthropic_messages}
  openai: {prefix: /openai, upstream: https://api.openai.com, protocol: openai_responses}
  # GW-13 / XD-FIX-R2-057: memory-service embeddings (service caller, purpose `embedding`); passthrough upstreams
  # are Voyage (default model) and OpenAI (fallback, dimensions=1024).
  embeddings: {prefix: /embeddings, upstream_by_model: {voyage: https://api.voyageai.com, openai: https://api.openai.com}, protocol: embeddings}
model_map:
  anthropic/claude-opus-5-5: claude-opus-5-5
  anthropic/claude-sonnet-5-5: claude-sonnet-5-5
  openai/gpt-5-codex-2025-09-15: gpt-5-codex
  anthropic/claude-haiku-5-5: claude-haiku-5-5
  voyage/voyage-code-4: voyage-code-4
  openai/text-embedding-3-large: text-embedding-3-large
price_book: {source: file, path: /etc/gateway-shim/prices.yaml}
quotas: {refresh_interval: 60s}
auth:
  run_token:
    audience: ai-gateway                       # string equality (C-RUNNER 3.0.0 verifier obligation 1)
    issuers_env: REPLICANT_RUN_TOKEN_ISSUERS
    jwks_urls_env: REPLICANT_RUN_TOKEN_JWKS_URLS
  run_grant:
    issuer_env: REPLICANT_RUN_GRANT_ISSUER
    jwks_url_env: REPLICANT_RUN_GRANT_JWKS_URL
    revocation_url_env: REPLICANT_RUN_GRANT_REVOCATION_URL
  service_tokens_file_env: REPLICANT_GATEWAY_SERVICE_TOKENS_FILE
budgets:
  dev_defaults: {run_usd: 2, job_usd: 5}       # WS-03 gateway.md §8 passthrough defaults
  embeddings: {per_tenant_day_usd: 1, reembed_backfill_usd_max: 2}   # local values of budgets.embeddings.*
revocations:
  exec_feed_urls_env: REPLICANT_EXEC_REVOCATIONS_URLS            # C-RUNNER 3.0.0 GET /v1/revocations
  exec_feed_token_file_env: REPLICANT_EXEC_REVOCATIONS_TOKEN_FILE
  exec_feed_poll_seconds_env: REPLICANT_EXEC_REVOCATIONS_POLL_SECONDS
usage_copy:
  s3_uri_env: REPLICANT_GATEWAY_USAGE_S3_URI                     # artifacts platform/gateway-usage/ (C-ART 2.0.0)
local:
  dev_keys_env: [ANTHROPIC_API_KEY, OPENAI_API_KEY, VOYAGE_API_KEY]   # from ~/.config/replicant/dev-keys.env
  cassette_roots_env: REPLICANT_GATEWAY_CASSETTE_ROOTS     # tests=…, evals=…, scripts=…
  cassette_layout: "<root>/<set>/<key>.ndjson"           # one replicant.gateway-cassette/v1 entry per line, by seq
  miss: {status: 599, code: cassette_miss}               # WS-03 gateway.md §8.1
  record_root: tests
