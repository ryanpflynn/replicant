[project]
name = "replicant-temporal"
version = "0.1.0"
description = "Temporal client factory, search-attribute helpers, versioning helpers and interceptors shared by replicant services and workers (WS-11 layout)."
requires-python = ">=3.12,<3.13"
dependencies = ["temporalio==1.34.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicant_temporal"]
