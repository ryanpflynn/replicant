[project]
name = "replicant-ids"
version = "2.0.0"
description = "C-IDS 2.0.0 reference implementation: ID encoding, derived IDs, Temporal naming, trace IDs, regexes"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replicant_ids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
