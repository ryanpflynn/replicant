[project]
name = "replicant-cdef"
version = "3.0.0"
description = "C-DEF 3.0.0 registry digests and blob layout (definitions, release bundles, pointers): one implementation for writers (control-plane-api) and readers (replicant-worker), with shared test vectors."
requires-python = ">=3.12,<3.13"
dependencies = ["replicant-ids"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
replicant-ids = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replicant_cdef"]

[tool.hatch.build.targets.wheel.force-include]
"src/replicant_cdef/vectors.json" = "replicant_cdef/vectors.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
