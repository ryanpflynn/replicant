[project]
name = "replicant-telemetry"
version = "0.1.0"
description = "WS-08 replicant-telemetry: OTel setup (T-1 job traces, T-5 span IDs, replicant.* attributes), JSON logs, redaction, Temporal tracing interceptor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.8"]

[dependency-groups]
dev = ["pytest>=8", "temporalio>=1.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicant_telemetry"]
artifacts = ["replicant_telemetry/redaction/*"]
