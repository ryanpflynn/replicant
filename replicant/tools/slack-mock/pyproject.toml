[project]
name = "slack-mock"
version = "0.1.0"
description = "Local Slack Web API mock (P-14): the Web API subset slack-integration uses, an inspection API and a viewer page."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "pyyaml==6.0.3",
]

[project.scripts]
slack-mock = "slack_mock.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx==0.28.1"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_mock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
