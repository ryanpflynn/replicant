[project]
name = "publisher-worker"
version = "0.1.0"
description = "publisher-worker: the Publisher (github-app.md §10) on task queue replicant-publisher; Gitea in M1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "replicant-telemetry",
  "replicant-temporal",
  "temporalio==1.34.0",
  "httpx>=0.27",
  "boto3>=1.35",
  "zstandard>=0.23",
]

[project.scripts]
publisher-worker = "publisher_worker.cli:main"

[tool.uv.sources]
replicant-telemetry = { workspace = true }
replicant-temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["publisher_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
