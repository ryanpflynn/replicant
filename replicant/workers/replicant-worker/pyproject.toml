[project]
name = "replicant-worker"
version = "0.1.0"
description = "replicant-worker: ReplicantJob / MaintenanceBatch workflows, interpreter graph engine and node activities (WS-01, v0)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "replicant-telemetry",
  "replicant-temporal",
  "replicant-cdef",
  "replicant-ids",
  "temporalio==1.34.0",
  "jsonschema>=4.23",
  "referencing>=0.35",
  "pyyaml>=6",
  "cryptography>=43",
  "httpx>=0.27",
  "boto3>=1.35",
  "zstandard>=0.23",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
replicant-worker = "replicant_worker.cli:main"

[tool.uv.sources]
replicant-telemetry = { workspace = true }
replicant-temporal = { workspace = true }
replicant-cdef = { workspace = true }
replicant-ids = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicant_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
python_files = ["test_activities.py", "test_worker_smoke.py"]
