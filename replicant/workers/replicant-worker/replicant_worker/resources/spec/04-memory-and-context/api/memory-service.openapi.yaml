                - reviewer_contradicted
                - reviewer_repeated
                - agent_flagged
              comment_id:
                type: integer
              author_principal_id:
                $ref: '#/components/schemas/UserId'
              judge_score:
                type: number
                minimum: 0
                maximum: 1
    Problem:
