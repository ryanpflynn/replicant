openapi: 3.1.1
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Replicant memory-service API
  version: 1.2.0
  summary: Internal and admin API of memory-service (WS-04). Single writer of Postgres schema `memory` (C-PG).
  description: |
    Three audiences, three listeners (the MCP listener for sandboxes is specified separately in
    `../mcp/memory-mcp.tools.json`):

    * **Internal** (`/internal/v1/...`, tag `internal`): called by `replicant-worker` activities
      (`memory.create_snapshot`, `context.assemble`, `memory.write_candidates`, `memory.write_episode`,
      `memory.record_outcome`), by `control-plane-api` for the read-only job memory view, and by
      `context-mcp` (job binding lookup). Caller authentication: Kubernetes projected ServiceAccount
      token, audience `memory-service`, allowlisted subjects per operation (x-allowed-callers).
    * **Admin** (`/internal/v1/admin/...`, tag `admin`): called only by `control-plane-api` on behalf
      of a human. control-plane-api forwards the end user's verified identity in
      `X-Replicant-Principal` (the Okta-mapped `usr_` ID) plus its own ServiceAccount token.
      **memory-service re-checks the route's permission on every request** by calling identity-service
      `POST /internal/v1/authorize {principal_id, action: <the route's x-replicant-permission>}` (D-25: no cached
      grant; SCIM changes take effect on the next request). That is `memory:admin` on every admin route
      except restore-resync and its status poll, which use `restore:execute` as the shared restore envelope
      requires (XD-FIX-R1-237, R1V-027). control-plane-api checks the same permission, so both layers agree. A denial returns 403 and is audited
      (`audit.emit`, event `memory.admin_denied`). Every admin mutation requires `Idempotency-Key`
      and writes `memory.curator_actions` plus an audit event in the same transaction.
    * Mutations of a single entry require `If-Match: "<entry_id>:<state_seq>"` (optimistic
      concurrency); a stale ETag returns 412 with the current entry.

    Errors are RFC 9457 `application/problem+json` with `code` and `retryable`, the same
    convention as the Runner API.

    **Revision 1.1.0 (wave-1 fixes).** One verb table shared with control-plane-api (R1-097): every admin
    operation below carries `x-public-path`, the route control-plane-api exposes and proxies 1:1. Lifecycle verbs
    are explicit (`:approve`, `:reject`, `:disable`, `:deprecate`, `:restore`, `:reopen`, `:quarantine`,
    `:promote`, `:merge`, `:clear-hold`, `PATCH` for edits). Every single-entry mutation needs `If-Match` and
    returns **412** `precondition_failed` with the current entry when the ETag is stale, **409**
    `invalid_transition` when the action is not allowed from the current state, and **202** with
    `pending_second_approval: true` when a tenant- or org-scope action waits for a second, different admin.
    There is no `DELETE` on entries: hard deletion is `POST …/purges`.

    Authorization calls to identity-service (R1-098): `POST /internal/v1/authorize` with
    `{principal_id, action: "memory:admin", tenant_id: null, freshness: "request"}` → `{decision, reason, evidence, evaluated_at}` before every admin request (flags use `action: "memory:flag"`; restore-resync uses `action: "restore:execute"`, `tenant_id: null`),
    and `POST /internal/v1/authorize:batch-repos` with `{principal_id, action: "repo:read", repo_ids[1..100], freshness: "request"}` → `{results: [{repo_id, decision, permission, source}], as_of}` for
    repository visibility (memory-mcp episodes, provenance links, public entry view). See XD-FIX-R1-098.

    **Revision 1.2.0 (wave 2).** Leak purges are called by `ops-worker` (XD-FIX-R1-103). Restore resync uses the
    shared restore envelope (XD-FIX-R1-237). Eval component endpoints for eval-worker (XD-FIX-R1-151). Embeddings are
    requested from the gateway shim at `POST /embeddings/v1/embeddings` (XD-FIX-R2-057); memory-service holds no
    provider key.
  contact:
    name: WS-04 Memory and Context
servers:
- url: https://memory-service.replicant-context.svc.cluster.local:8443
  description: In-cluster (core). Not exposed outside the core cluster.
tags:
- name: internal
- name: admin
security:
- serviceToken: []
paths:
  /internal/v1/snapshots:
    post:
      tags:
      - internal
      operationId: createSnapshot
      summary: Create (or idempotently fetch) the memory snapshot for a job's context assembly.
      description: |-
        Called by activity `memory.create_snapshot`: logical activity ID `context.c<cycle>.n<ord>.snapshot` for the
        first assembly (mode `create` or `eval_pinned`) and `<node>.c<cycle>.n<ord>.resnap` before each agent run
        (mode `revocation_filter`), using WS-01's node keys (R1-111). Deterministic: the eligible set is read under the
        snapshot policy in one REPEATABLE READ transaction. The snapshot ID is content-addressed over
        `{tenant_id, entries, policy}` (C-IDS, CCR-04-04), so two tenants never share a snapshot row (R1-096). The
        snapshot export is written to S3 (`If-None-Match: *`) **before** the row is inserted (blob first). Holdout arms
        are assigned per (job, entry) in `memory.holdout_assignments`, never stored in the shared snapshot.

        Mode `eval_prepare` (caller eval-worker only) builds a snapshot for `scope_context {tenant_id, repo, as_of}` with
        no job and no binding, and returns only the snapshot fields; WS-06's `eval.prepare_memory` then passes the ID in
        `options.evaluation.memory_snapshot_id`. Mode `eval_pinned` binds an evaluation job to that snapshot. With
        `replay_job_id` (C-JOBREQ `options.evaluation.memory_replay_job_id`, CCR-04-05) the binding replays the source
        job's recorded injections and retrievals (R1-101).
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      - system:serviceaccount:replicant-eval:eval-worker
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequest'
      responses:
        '201':
          description: Snapshot created and (except eval_prepare) bound to the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotBinding'
        '200':
          description: Same idempotency key; the existing binding is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotBinding'
        '400':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /internal/v1/snapshots/{snapshot_id}:
    get:
      tags:
      - internal
      operationId: getSnapshot
      summary: Snapshot with full item content (for rendering, eval replay, and approval packets).
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      - system:serviceaccount:replicant-eval:eval-worker
      parameters:
      - $ref: '#/components/parameters/SnapshotId'
      responses:
        '200':
          description: Snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Snapshot'
        '404':
          $ref: '#/components/responses/Problem'
  /internal/v1/snapshots/{snapshot_id}:select:
    post:
      tags:
      - internal
      operationId: selectForRun
      summary: Rank and render the snapshot's entries for one run, within a token budget.
      description: |-
        Called by activity `context.stage_inputs` (`<node>.c<cycle>.n<ord>.stage`) for each run. Applies role sections,
        path/language applicability, precedence and conflict suppression, this job's holdout arms (per job, not per
        snapshot), and the budget; renders `replicant.memory-block/v1` with a pinned renderer version; counts tokens with
        the target model's tokenizer. Records `memory.injections` (refs in order, withheld refs, renderer version,
        sha256). For a replay binding it renders the **source run's** recorded refs in recorded order with the recorded
        renderer version, matched by `(node_key, cycle, ordinal)`, and verifies `rendered_sha256` (purged items render
        as tombstones and the mismatch is reported). The rendered text is returned only in this response and stored only
        in the `memory_injection` artifact; no other staged input may duplicate it (R1-105). Idempotent on `run_id`.
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      - system:serviceaccount:replicant-eval:eval-worker
      parameters:
      - $ref: '#/components/parameters/SnapshotId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectRequest'
      responses:
        '200':
          description: Rendered injection (the body is the memory_injection artifact document).
          content:
            application/json:
              schema:
                $ref: ../schemas/memory-injection.schema.json
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/v1/jobs/{job_id}/binding:
    get:
      tags:
      - internal
      operationId: getJobBinding
      summary: The job's current snapshot binding (used by memory-mcp and context-mcp to scope calls).
      x-allowed-callers:
      - system:serviceaccount:replicant-context:context-mcp
      - system:serviceaccount:replicant-workers:replicant-worker
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotBinding'
        '404':
          $ref: '#/components/responses/Problem'
  /internal/v1/jobs/{job_id}/memory:
    get:
      tags:
      - internal
      operationId: getJobMemoryView
      summary: Read-only memory view for a job (non-admin view, D-25). control-plane-api authorizes the viewer for
        the job first.
      x-allowed-callers:
      - system:serviceaccount:replicant-control:control-plane-api
      - system:serviceaccount:replicant-workers:replicant-worker
      parameters:
      - $ref: '#/components/parameters/JobId'
      - name: viewer_repo_access
        in: query
        description: Comma-separated repos the viewer can read (computed by control-plane-api); controls whether
          source PR links are shown.
        schema:
          type: string
          maxLength: 20000
      responses:
        '200':
          description: Entries that influenced the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobMemoryView'
        '404':
          $ref: '#/components/responses/Problem'
  /internal/v1/candidates:
    post:
      tags:
      - internal
      operationId: submitCandidates
      summary: Submit candidate proposals from the feedback extraction or an agent's memory_candidates artifact.
      description: |
        Runs the write-path gates (write-path.md §1–§5): identity and author restriction, safety
        content rules, dedupe/merge, contradiction detection, candidate creation, and any automatic
        transition the governance policy allows. Idempotent per (tenant, source item, extractor).
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/memory-candidates.schema.json
      responses:
        '200':
          description: Per-proposal decisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateDecisions'
        '400':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
  /internal/v1/episodes:
    post:
      tags:
      - internal
      operationId: writeEpisode
      summary: Record the episodic memory entry for a terminal job (activity memory.write_episode).
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeRequest'
      responses:
        '201':
          description: Episode created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryRef'
        '200':
          description: Already recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryRef'
  /internal/v1/outcomes:
    post:
      tags:
      - internal
      operationId: recordOutcome
      summary: Record or revise a job's outcome metrics (activity memory.record_outcome; revised on late PR events).
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeRequest'
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required:
                - job_id
                - revision
                properties:
                  job_id:
                    $ref: '#/components/schemas/JobId'
                  revision:
                    type: integer
  /internal/v1/feedback-signals:
    post:
      tags:
      - internal
      operationId: recordFeedbackSignals
      summary: Reviewer comments matched against entries (confirmed, contradicted, repeated) for usage telemetry
        and probation suspension.
      x-allowed-callers:
      - system:serviceaccount:replicant-workers:replicant-worker
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSignals'
      responses:
        '200':
          description: Recorded; lists entries suspended under policy, if any.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suspended:
                    type: array
                    items:
                      $ref: '#/components/schemas/EntryRefString'
  /internal/v1/admin/candidates:
    get:
      tags:
      - admin
      operationId: listCandidates
      summary: Candidate queue (filters by tenant, scope, type, origin, age, conflict, anomaly).
      parameters:
      - $ref: '#/components/parameters/Principal'
      - name: tenant_id
        in: query
        schema:
          $ref: '#/components/schemas/TenantId'
      - name: memory_type
        in: query
        schema:
          $ref: '#/components/schemas/MemoryType'
      - name: scope_level
        in: query
        schema:
          $ref: '#/components/schemas/ScopeLevel'
      - name: has_conflict
        in: query
        schema:
          type: boolean
      - name: page_token
        in: query
        schema:
          type: string
          maxLength: 512
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Page of candidates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        '403':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/candidates
      x-replicant-permission: memory:admin
  /internal/v1/admin/entries:
    get:
      tags:
      - admin
      operationId: searchEntries
      summary: Search all entries (any state) with full-text, trigram, and filters.
      parameters:
      - $ref: '#/components/parameters/Principal'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 500
      - name: tenant_id
        in: query
        schema:
          $ref: '#/components/schemas/TenantId'
      - name: state
        in: query
        schema:
          $ref: '#/components/schemas/EntryState'
      - name: repo
        in: query
        schema:
          type: string
          maxLength: 455
      - name: author_principal_id
        in: query
        schema:
          $ref: '#/components/schemas/UserId'
      - name: created_after
        in: query
        schema:
          type: string
          format: date-time
      - name: created_before
        in: query
        schema:
          type: string
          format: date-time
      - name: page_token
        in: query
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Page of entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPage'
        '403':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/entries
      x-replicant-permission: memory:admin
    post:
      tags:
      - admin
      operationId: createEntry
      summary: Admin-authored entry (origin curator). Tenant and org scope require a second, different admin (two-person
        rule).
      parameters:
      - $ref: '#/components/parameters/Principal'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryContent'
      responses:
        '201':
          description: Created (active, or pending second approval for tenant or org scope).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/entries
      x-replicant-permission: memory:admin
  /internal/v1/admin/entries/{entry_id}:
    get:
      tags:
      - admin
      operationId: getEntryDetail
      summary: Full entry detail — all versions, provenance with author identities, state history, conflicts, usage,
        outcome statistics.
      parameters:
      - $ref: '#/components/parameters/Principal'
      - $ref: '#/components/parameters/EntryId'
      responses:
        '200':
          description: Entry.
          headers:
            ETag:
              schema:
                type: string
              description: '"<entry_id>:<state_seq>"'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/entries/{entry_id}
      x-replicant-permission: memory:admin
    patch:
      tags:
      - admin
      operationId: editEntry
      x-public-path: /v1/admin/memory/entries/{entry_id}
      summary: Create a new version (content and same-or-narrower scope; widening uses :promote).
      parameters:
      - &id002
        $ref: '#/components/parameters/Principal'
      - &id003
        $ref: '#/components/parameters/EntryId'
      - &id004
        $ref: '#/components/parameters/IdempotencyKey'
      - &id005
        $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryEdit'
      responses:
        '200':
          description: New version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '202':
          description: Pending second approval (tenant/org).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '403': &id001
          $ref: '#/components/responses/Problem'
        '409': *id001
        '412': *id001
        '422': *id001
      x-replicant-permission: memory:admin
  /internal/v1/admin/entries/{entry_id}:merge:
    post:
      tags:
      - admin
      operationId: mergeEntries
      summary: 'Merge: the path entry SURVIVES; absorb_entry_ids are merged into it (their evidence moves; they
        become superseded with merged_into → survivor).'
      parameters:
      - *id002
      - *id003
      - *id004
      - *id005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - absorb_entry_ids
              - reason
              properties:
                absorb_entry_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/EntryId'
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Merged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDetail'
        '403':
          $ref: '#/components/responses/Problem'
        '409': *id001
        '412': *id001
      x-public-path: /v1/admin/memory/entries/{entry_id}:merge
      x-replicant-permission: memory:admin
  /internal/v1/admin/entries/{entry_id}/jobs:
    get:
      tags:
      - admin
      operationId: entryBlastRadius
      summary: Jobs and runs that received (injected) or retrieved (pulled) this entry, with current job status
        from jobs_read.
      parameters:
      - $ref: '#/components/parameters/Principal'
      - $ref: '#/components/parameters/EntryId'
      - name: version
        in: query
        schema:
          type: integer
          minimum: 1
      - name: include_running_only
        in: query
        schema:
          type: boolean
          default: false
      - name: page_token
        in: query
        schema:
          type: string
          maxLength: 512
      responses:
        '200':
          description: Blast radius.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlastRadius'
        '403':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/entries/{entry_id}/jobs
      x-replicant-permission: memory:admin
  /internal/v1/admin/conflicts:
    get:
      tags:
      - admin
      operationId: listConflicts
      parameters:
      - $ref: '#/components/parameters/Principal'
      - name: tenant_id
        in: query
        schema:
          $ref: '#/components/schemas/TenantId'
      - name: state
        in: query
        schema:
          type: string
          enum:
          - open
          - resolved
          - dismissed
          default: open
      responses:
        '200':
          description: Conflicts with both sides' content.
          content:
            application/json:
              schema:
                type: object
                required:
                - conflicts
                properties:
                  conflicts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conflict'
                  next_page_token:
                    type: string
        '403':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/conflicts
      x-replicant-permission: memory:admin
  /internal/v1/admin/conflicts/{conflict_id}:resolve:
    post:
      tags:
      - admin
      operationId: resolveConflict
      parameters:
      - $ref: '#/components/parameters/Principal'
      - name: conflict_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^mcfl_[0-9a-hjkmnp-tv-z]{26}$
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - resolution
              - reason
              properties:
                resolution:
                  type: string
                  enum:
                  - keep_a
                  - keep_b
                  - scope_split
                  - merged
                  - both_valid
                  - neither
                scope_split:
                  description: For scope_split, the narrowed scope applied to each side as new versions.
                  type: object
                  properties:
                    a:
                      $ref: '#/components/schemas/Scope'
                    b:
                      $ref: '#/components/schemas/Scope'
                reason:
                  type: string
                  maxLength: 2000
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '403':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/conflicts/{conflict_id}:resolve
      x-replicant-permission: memory:admin
  /internal/v1/admin/quarantines:
    post:
      tags:
      - admin
      operationId: createQuarantine
      summary: 'Bulk disable or quarantine by selector (this is the public "bulk:disable"): dry_run first, then
        apply in one transaction.'
      parameters:
      - $ref: '#/components/parameters/Principal'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineRequest'
      responses:
        '200':
          description: Dry run result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResult'
        '201':
          description: Applied in one transaction; effective for every snapshot created after commit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuarantineResult'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
      x-public-path: /v1/admin/memory/quarantines
      x-replicant-permission: memory:admin
  /internal/v1/admin/quarantines/{quarantine_id}:release:
    post:
      tags:
      - admin
      operationId: releaseQuarantine
