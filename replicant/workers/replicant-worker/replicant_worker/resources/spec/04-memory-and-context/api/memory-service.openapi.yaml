              - probation_end
              - candidate_expiry
              - admin_review
            not_before:
              type: string
              format: date-time
        activation_hold:
          type: boolean
        your_requests:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
        source_comment_url:
          type: string
          description: Only when the viewer can read the source repo
    RestoreStep:
      type: object
