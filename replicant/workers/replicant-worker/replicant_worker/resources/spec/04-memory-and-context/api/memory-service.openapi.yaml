          description: Echo of the request's dry_run; in a dry run the counts are what would be changed
        report:
          type: object
          properties:
            ledger_entries_replayed:
              type: integer
            entries_repurged:
              type: integer
            snapshots_missing_export:
              type: integer
            exports_missing_row:
              type: integer
