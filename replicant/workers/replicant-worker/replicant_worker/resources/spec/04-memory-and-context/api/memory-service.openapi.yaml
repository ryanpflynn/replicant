      summary: 'Post-merge outcome report: wrong fix, regression, or detected revert (R2-017).'
      description: 'Callers: control-plane-api (`POST /v1/jobs/{job_id}/outcome-reports`, any principal authorized
        to view the job; X-Replicant-Principal) and github-integration (`/replicant wrong <reason>` from a linked user
        with ≥ write; revert detection within 30 days of merge). Effects, all tightening and recorded in `effects`:
        the job''s episode → disabled (system_policy `post_merge_reverted` / `post_merge_wrong_fix`), excluded from
        similar_past_work and mining; the job''s candidates get an activation hold; entries from the job still in
        probation → disabled; older entries sourced only from the job → admin queue with Beta β += 2; job_outcomes.post_merge_reverted.
        Idempotent on dedupe_key.'
      x-allowed-callers:
      - system:serviceaccount:replicant-control:control-plane-api
      - system:serviceaccount:replicant-integrations:github-integration
      x-public-path: /v1/jobs/{job_id}/outcome-reports
      parameters:
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeReport'
      responses:
        '201':
          description: Recorded and applied.
          content:
            application/json:
              schema:
                type: object
                required:
                - report_id
                - effects
                properties:
                  report_id:
                    type: integer
                  effects:
                    type: object
        '200':
          description: Duplicate (same dedupe_key).
        '403': *id001
        '404': *id001
  /internal/v1/jobs/{job_id}/memory/{entry_id}/flags:
    post:
      tags:
      - internal
      operationId: flagEntry
      summary: 'Any principal authorized to view the job flags an entry that influenced it (R2-028). D-25 intact:
        a flag changes no state by itself.'
      description: Caller control-plane-api with X-Replicant-Principal after its job-view authorization. memory-service
        checks the entry was injected into or retrieved by the job. Two flags from distinct principals while the
        entry is a candidate or in probation → activation hold / probation disable by system policy (governance
        flags). Every flag goes to the admin queue with due_at = now + flags.sla_hours. Rate limit 20 flags per
        principal per day.
      x-allowed-callers:
      - system:serviceaccount:replicant-control:control-plane-api
      x-public-path: /v1/jobs/{job_id}/memory/{entry_id}/flags
      parameters:
      - $ref: '#/components/parameters/JobId'
      - *id003
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlagRequest'
      responses:
        '201':
          description: Flag recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '403': *id001
        '404': *id001
        '409': *id001
        '429': *id001
      x-replicant-permission: memory:flag
  /internal/v1/entries/{entry_id}/public:
    get:
      tags:
      - internal
      operationId: getPublicEntry
      summary: 'Provenance view for the source author and source-repo readers (R2-018): the statement exactly as
        agents see it, its true state and next automatic transition, and correction status.'
      description: Caller control-plane-api (`GET /v1/memory/entries/{entry_id}/public`) with X-Replicant-Principal.
        Allowed when the principal authored a source comment of the entry, or identity-service confirms repo:read
        on a source repo (batch-repos). Never shows other authors, scores, or other jobs.
      x-allowed-callers:
      - system:serviceaccount:replicant-control:control-plane-api
      - system:serviceaccount:replicant-integrations:github-integration
      x-public-path: /v1/memory/entries/{entry_id}/public
      parameters:
      - *id003
      - *id002
      responses:
        '200':
          description: Public view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEntryView'
        '403': *id001
        '404': *id001
  /internal/v1/entries/{entry_id}/correction-requests:
    post:
      tags:
      - internal
      operationId: requestCorrection
      summary: Source author or CODEOWNER of the source path asks for a correction (`/replicant memory-wrong <reason>`
        or the public view).
      description: Immediately sets an activation hold on a candidate, or disables an entry in probation (system_policy,
        reason author_correction / codeowner_correction, governance corrections.suspend_on_request); a mature entry
        goes to the admin queue with SLA. The requester is told the result in-thread (github-integration memory
        notice). Admin applies any content change (D-25).
      x-allowed-callers:
      - system:serviceaccount:replicant-control:control-plane-api
      - system:serviceaccount:replicant-integrations:github-integration
      x-public-path: /v1/memory/entries/{entry_id}/correction-requests
      parameters:
      - *id003
      - *id002
      - *id004
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectionRequest'
      responses:
        '201':
          description: Recorded with its effect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flag'
        '403': *id001
        '404': *id001
  /internal/v1/admin/restore-resync:
    post:
      tags:
      - admin
      operationId: restoreResync
      x-public-path: /v1/admin/memory/restore-resync
      x-replicant-permission: restore:execute
      summary: 'After a Postgres point-in-time restore (WS-10 recovery.md §4.2): re-apply every deletion-ledger
        entry of reason memory_hard_delete since the restore point, then verify every snapshot row has its export object
        (and its .purged replacement) and every export object has a row; report drift (R1-102). Shared restore envelope
        (XD-FIX-R1-237): permission restore:execute in both layers (R1V-027); 409 restore_not_open unless an
        ops.restore_events row is open; 202 with a step to poll.'
      description: 'Shape (XD-W3-R1V-029): no request body. Query `since` (RFC 3339, the restore point) and optional
        `dry_run` (default false). A dry run computes the same report and changes nothing. The runbook calls
        `?since=<restore point>&dry_run=true` first, then `dry_run=false`. The two runs use different
        Idempotency-Keys. memory-service''s second-layer check is identity-service `authorize {action: "restore:execute",
        tenant_id: null}`. A denial returns 403 and emits `memory.admin_denied` with `details.permission: restore:execute`.'
      parameters:
      - $ref: '#/components/parameters/Principal'
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: since
        in: query
        required: true
        schema:
          type: string
          format: date-time
        description: The restore point
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Report only; re-apply nothing (XD-W3-R1V-029)
      responses:
        '202':
          description: Step started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreStep'
        '403': &id006
          $ref: '#/components/responses/Problem'
        '409': *id006
  /internal/v1/admin/restore-resync/{restore_step_id}:
    get:
      tags:
      - admin
      operationId: getRestoreResyncStep
      x-public-path: /v1/admin/memory/restore-resync/{restore_step_id}
      x-replicant-permission: restore:execute
      parameters:
      - $ref: '#/components/parameters/Principal'
      - name: restore_step_id
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: Step state and report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreStep'
        '404': *id006
  /internal/v1/eval/components/{suite}:
    post:
      tags:
      - internal
      operationId: runMemoryComponentEval
      summary: 'Run one memory component on labelled cases for the eval harness (WS-06 eval-harness.md §11, XD-FIX-R1-151).
        Read-only: no memory state changes, no candidate writes.'
      description: Caller eval-worker (`svc_eval-worker`). The component runs with the prompt and model versions
        pinned in `config` (bundle-resolved by eval-worker) and returns per-case outputs; scoring stays in eval-worker.
        memory_capacity_curve takes {task_ref, entry_counts[]} and returns snapshot IDs built with `eval_prepare`
        + `counterfactual` for each count.
      x-allowed-callers:
      - system:serviceaccount:replicant-eval:eval-worker
      parameters:
      - name: suite
        in: path
        required: true
        schema:
          type: string
          enum:
          - memory_extraction
          - memory_grounding
          - memory_dedupe
          - memory_retrieval
          - memory_capacity_curve
          - memory_safety_classifier
          - memory_matcher
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - eval_run_id
              - config
              - cases
              properties:
                eval_run_id:
                  type: string
                  pattern: ^eval_[0-9a-hjkmnp-tv-z]{26}$
                config:
                  type: object
                  description: Pinned prompt refs, model ids, thresholds, embedding space
                cases:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    type: object
                    required:
                    - case_id
                    - input
                    properties:
                      case_id:
                        type: string
                        maxLength: 128
                      input:
                        type: object
      responses:
        '200':
          description: Per-case outputs.
          content:
            application/json:
              schema:
                type: object
                required:
                - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - case_id
                      - output
                      properties:
                        case_id:
                          type: string
                        output:
                          type: object
                        latency_ms:
                          type: integer
        '403': *id006
        '422': *id006
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Projected ServiceAccount token (audience memory-service) from the core cluster.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 257
      description: Activities send their ik1 key (sf-string). Admin calls send a client ULID.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"mem_[0-9a-hjkmnp-tv-z]{26}:[1-9][0-9]*"$
    Principal:
      name: X-Replicant-Principal
      in: header
      required: true
      description: The human admin on whose behalf control-plane-api calls; re-verified live with identity-service.
      schema:
        $ref: '#/components/schemas/UserId'
    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^msnap_[0-9a-hjkmnp-tv-z]{26}$
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobId'
    EntryId:
      name: entry_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EntryId'
  responses:
    Problem:
      description: RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TenantId:
      type: string
      minLength: 3
      maxLength: 32
      pattern: ^[a-z][a-z0-9]*(-[a-z0-9]+)*$
    JobId:
      type: string
      pattern: ^job_[0-9a-hjkmnp-tv-z]{26}$
    RunId:
      type: string
      pattern: ^run_[0-9a-hjkmnp-tv-z]{26}$
    UserId:
      type: string
      pattern: ^usr_[0-9a-hjkmnp-tv-z]{26}$
    EntryId:
      type: string
      pattern: ^mem_[0-9a-hjkmnp-tv-z]{26}$
    EntryRefString:
      type: string
      pattern: ^mem_[0-9a-hjkmnp-tv-z]{26}@[1-9][0-9]*$
    MemoryType:
      type: string
      enum:
      - rule
      - episode
      - procedure
      - negative
      - preference
    ScopeLevel:
      type: string
      enum:
      - org
      - tenant
      - service_group
      - repo
      - path
    EntryState:
      type: string
      enum:
      - candidate
      - active
      - disabled
      - quarantined
      - deprecated
      - superseded
      - rejected
      - expired
      - purged
    Scope:
      type: object
      additionalProperties: false
      required:
      - level
      properties:
        level:
          $ref: '#/components/schemas/ScopeLevel'
        service_group:
          type: string
          maxLength: 63
        repo:
          type: string
          maxLength: 455
        path_globs:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 300
        languages:
          type: array
          maxItems: 10
          items:
            type: string
        frameworks:
          type: array
          maxItems: 10
          items:
            type: string
        workflow_types:
          type: array
          maxItems: 8
          items:
            type: string
        roles:
          type: array
          maxItems: 5
          items:
            type: string
    EntryContent:
      type: object
      additionalProperties: false
      required:
      - memory_type
      - scope
      - statement
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        memory_type:
          $ref: '#/components/schemas/MemoryType'
        scope:
          $ref: '#/components/schemas/Scope'
        subject_key:
          type: string
          maxLength: 128
        title:
          type: string
          maxLength: 120
        statement:
          type: string
          minLength: 10
          maxLength: 4000
        rationale:
          type: string
          maxLength: 1000
        structured:
          type: object
        examples:
          type: array
          maxItems: 4
          items:
            type: object
        enforced:
          type: boolean
          default: false
    EntryRef:
      type: object
      required:
      - entry_id
      - version
      - state
      properties:
        entry_id:
          $ref: '#/components/schemas/EntryId'
        version:
          type: integer
          minimum: 1
        state:
          $ref: '#/components/schemas/EntryState'
    EntryDetail:
      type: object
      required:
      - entry_id
      - tenant_id
      - memory_type
      - state
      - state_seq
      - current_version
      - versions
      properties:
        entry_id:
          $ref: '#/components/schemas/EntryId'
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        memory_type:
          $ref: '#/components/schemas/MemoryType'
        origin:
          type: string
        state:
          $ref: '#/components/schemas/EntryState'
        state_seq:
          type: integer
        current_version:
          type: integer
        enforced:
          type: boolean
        confidence:
          type: number
        evidence:
          type: object
          properties:
            count:
              type: integer
            independent:
              type: integer
            authors:
              type: integer
            repos:
              type: integer
        probation_until:
          type:
          - string
          - 'null'
          format: date-time
        versions:
          type: array
          items:
            allOf:
            - $ref: '#/components/schemas/EntryContent'
            - type: object
              properties:
                version:
                  type: integer
                content_digest:
                  type: string
                created_at:
                  type: string
                  format: date-time
                created_by:
                  type: string
                change_kind:
                  type: string
        provenance:
          type: array
          items:
            type: object
        state_history:
          type: array
          items:
            type: object
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
        usage:
          type: object
          properties:
            injection_count:
              type: integer
            jobs:
              type: integer
            last_injected_at:
              type: string
              format: date-time
        outcome_stats:
          type: object
        pending_second_approval:
          type: boolean
        first_approver:
          type: string
          description: usr_ of the first admin while pending
        second_approval_expires_at:
          type: string
          format: date-time
        activation_hold:
          type: boolean
        hold_reason:
          type: string
        open_flags:
          type: integer
    EntryPage:
      type: object
      required:
      - entries
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/EntryDetail'
        next_page_token:
          type: string
    TransitionRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/EntryId'
          description: ':approve only: entries this one replaces'
    Conflict:
      type: object
      required:
      - conflict_id
      - kind
      - state
      - a
      - b
      properties:
        conflict_id:
          type: string
          pattern: ^mcfl_[0-9a-hjkmnp-tv-z]{26}$
        kind:
          type: string
          enum:
          - contradiction
          - scope_overlap
          - probable_duplicate
        detected_by:
          type: string
        state:
          type: string
          enum:
          - open
          - resolved
          - dismissed
        a:
          $ref: '#/components/schemas/EntryDetail'
        b:
          $ref: '#/components/schemas/EntryDetail'
        resolution:
          type: string
    QuarantineRequest:
      type: object
      additionalProperties: false
      required:
      - kind
      - selector
      - reason
      properties:
        kind:
          type: string
          enum:
          - quarantine
          - bulk_disable
        dry_run:
          type: boolean
          default: true
        reason:
          type: string
          minLength: 3
          maxLength: 2000
        selector:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            tenant_id:
              $ref: '#/components/schemas/TenantId'
            entry_ids:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/EntryId'
            author_principal_id:
              $ref: '#/components/schemas/UserId'
            created_after:
              type: string
              format: date-time
            created_before:
              type: string
              format: date-time
            scope_level:
              $ref: '#/components/schemas/ScopeLevel'
            repo:
              type: string
              maxLength: 455
            origin:
              type: string
            extractor:
              type: string
              maxLength: 200
            states:
              type: array
              items:
                type: string
                enum:
                - candidate
                - active
                - disabled
                - deprecated
        cancel_running_jobs:
          type: boolean
          default: false
          description: If true, control-plane-api (not memory-service) issues job.cancel for running jobs in the
            blast radius after the admin confirms them in the UI.
    QuarantineResult:
      type: object
      required:
      - entries_affected
      - running_jobs_affected
      properties:
        quarantine_id:
          type: string
          pattern: ^mqtn_[0-9a-hjkmnp-tv-z]{26}$
        dry_run:
          type: boolean
        entries_affected:
          type: integer
        entry_ids:
          type: array
          items:
            $ref: '#/components/schemas/EntryId'
        running_jobs_affected:
          type: array
          items:
            $ref: '#/components/schemas/JobId'
        effective_at:
          type: string
          format: date-time
    Purge:
      type: object
      required:
      - purge_id
      - status
      - propagation
      properties:
        purge_id:
          type: string
          pattern: ^mprg_[0-9a-hjkmnp-tv-z]{26}$
        status:
          type: string
          enum:
          - db_purged
          - propagating
          - complete
          - failed_retrying
        propagation:
          type: object
          properties:
            snapshot_exports:
              $ref: '#/components/schemas/PropagationStatus'
            memory_injections:
              $ref: '#/components/schemas/PropagationStatus'
            langfuse:
              $ref: '#/components/schemas/PropagationStatus'
            memory_export:
              $ref: '#/components/schemas/PropagationStatus'
            session_and_transcripts:
              $ref: '#/components/schemas/PropagationStatus'
        path:
          type: string
          enum:
          - admin
          - leak
          - horizon
        deletion_ledger_ids:
          type: array
          items:
            type: string
            pattern: ^del_[0-9a-hjkmnp-tv-z]{26}$
        leak_id:
          type: string
          pattern: ^leak_[0-9a-hjkmnp-tv-z]{26}$
    PropagationStatus:
      type: object
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - not_applicable
          - pending
          - done
          - failed_retrying
          - requires_break_glass
        objects:
          type: integer
        detail:
          type: string
    BlastRadius:
      type: object
      required:
      - entry_id
      - jobs
      properties:
        entry_id:
          $ref: '#/components/schemas/EntryId'
        totals:
          type: object
          properties:
            injected_runs:
              type: integer
            retrieved_runs:
              type: integer
            jobs:
              type: integer
            running_jobs:
              type: integer
        jobs:
          type: array
          items:
            type: object
            required:
            - job_id
            - how
            properties:
              job_id:
                $ref: '#/components/schemas/JobId'
              status:
                type: string
              repo:
                type: string
              how:
                type: string
                enum:
                - injected
                - retrieved
                - snapshotted_only
                - withheld_holdout
              versions:
                type: array
                items:
                  type: integer
              run_ids:
                type: array
                items:
                  $ref: '#/components/schemas/RunId'
              first_at:
                type: string
                format: date-time
        next_page_token:
          type: string
    CreateSnapshotRequest:
      type: object
      additionalProperties: false
      description: |-
        Required fields depend on `mode` (R1V-026, XD-W3-R1V-026).
        * `create`, `eval_pinned`, `policy_refresh`, `bundle_migration`: job_id, repos, workflow_type,
          release_bundle_id, requester_principal_id and policy.
        * `eval_prepare`: scope_context and policy, with no job.
        * `revocation_filter`: job_id and base_snapshot_id only. memory-service fills policy, repos,
          workflow_type, release_bundle_id, requester_principal_id, scope and evaluation_mode from the job's
          latest binding (`memory.job_snapshots`) and from the base snapshot's pinned policy. WS-01 does not
          resend them. If the request does send any of them, each must equal the bound value, or the call
          fails with 409 `binding_mismatch`. base_snapshot_id must be the job's latest bound snapshot.
        The run-context fields run_id, role, node_key, cycle and parent_job_id are optional for every mode
        except eval_prepare. They are recorded in the resnap's log and trace attributes only and never
        change the snapshot's content.
      required:
      - tenant_id
      - mode
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        job_id:
          $ref: '#/components/schemas/JobId'
        run_id:
          type: string
          pattern: ^run_[0-9a-hjkmnp-tv-z]{26}$
          description: Run context (log and trace only)
        role:
          type: string
          maxLength: 40
          description: Run context (log and trace only)
        node_key:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,40}$
          description: Run context (log and trace only)
        cycle:
          type: integer
          minimum: 0
          description: Run context (log and trace only)
        parent_job_id:
          oneOf:
          - $ref: '#/components/schemas/JobId'
          - type: 'null'
          description: Run context (log and trace only)
        service_groups:
          type: array
          maxItems: 10
          items:
            type: string
            maxLength: 63
          description: From the ecosystem catalog (service_repos → services.service_group)
        languages:
          type: array
          maxItems: 10
          items:
            type: string
        frameworks:
          type: array
          maxItems: 10
          items:
            type: string
        workflow_type:
          type: string
        release_bundle_id:
          type: string
          pattern: ^rb_[0-9a-hjkmnp-tv-z]{26}$
        policy:
          type: object
          required:
          - ref
          - digest
          properties:
            ref:
              type: string
              maxLength: 200
            digest:
              type: string
              pattern: ^sha256:[0-9a-f]{64}$
        requester_principal_id:
          type: string
          pattern: ^(usr_[0-9a-hjkmnp-tv-z]{26}|svc_[a-z][a-z0-9-]{2,40})$
        task_text_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        mode:
          type: string
          enum:
          - create
          - revocation_filter
          - policy_refresh
          - bundle_migration
          - eval_pinned
          - eval_prepare
        evaluation_mode:
          type: string
          enum:
          - eval
          - shadow
          description: From JobRequest.options.evaluation.mode (CCR-06-01). Candidate, episode, outcome, and feedback-signal
            writes are refused for bindings with evaluation_mode set
        scope_context:
          description: 'eval-worker / evaluation jobs only (XD-06-04): build the snapshot from this tenant and repo
            memory as it was at as_of (bitemporal: memory.state_as_of and the version current then). The binding
            records scope_tenant_id; the caller tenant stays replicant-eval'
          type: object
          additionalProperties: false
          required:
          - tenant_id
          properties:
            tenant_id:
              $ref: '#/components/schemas/TenantId'
            repo:
              type: string
              maxLength: 455
            as_of:
              type: string
              format: date-time
        use_snapshot_id:
          description: 'mode=eval_pinned: bind the job to this existing snapshot (C-JOBREQ 2.0.0 options.evaluation.memory_snapshot_id),
            so both arms of a comparison see identical memory. scope_context is copied from options.evaluation.memory_scope_context'
          type: string
          pattern: ^msnap_[0-9a-hjkmnp-tv-z]{26}$
        base_snapshot_id:
          type: string
          pattern: ^msnap_[0-9a-hjkmnp-tv-z]{26}$
        repos:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            maxLength: 455
          description: Target repos (WS-01 sends every JobRequest target). The first is primary; the eligible set
            is the union over all repos (scoping.md §2).
        replay_job_id:
          type: string
          pattern: ^job_[0-9a-hjkmnp-tv-z]{26}$
          description: 'mode=eval_pinned only: source job whose recorded memory is replayed exactly (R1-101). Its
            snapshot must equal use_snapshot_id.'
        counterfactual:
          description: 'eval-worker only, mode eval_prepare: add or remove entries for memory evals (memory-evals.md
            §5)'
          type: object
          additionalProperties: false
          properties:
            add_entry_refs:
              type: array
              items:
                $ref: '#/components/schemas/EntryRefString'
            remove_entry_ids:
              type: array
              items:
                $ref: '#/components/schemas/EntryId'
            empty:
              type: boolean
      allOf:
      - if:
          properties:
            mode:
              const: eval_prepare
        then:
          required:
          - scope_context
          - policy
          not:
            anyOf:
            - required:
              - run_id
            - required:
              - node_key
      - if:
          properties:
            mode:
              enum:
              - create
              - eval_pinned
              - policy_refresh
              - bundle_migration
        then:
          required:
          - job_id
          - repos
          - workflow_type
          - release_bundle_id
          - requester_principal_id
          - policy
      - if:
          properties:
            mode:
              const: eval_pinned
        then:
          required:
          - use_snapshot_id
      - if:
          properties:
            mode:
              const: revocation_filter
        then:
          required:
          - job_id
          - base_snapshot_id
    SnapshotBinding:
      type: object
      required:
      - memory_snapshot_id
      - spec_digest
      - pull_as_of
      - entry_refs
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        ordinal:
          type: integer
          minimum: 1
        memory_snapshot_id:
          type: string
          pattern: ^msnap_[0-9a-hjkmnp-tv-z]{26}$
        base_snapshot_id:
          type: string
        spec_digest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        pull_as_of:
          type: string
          format: date-time
        entry_refs:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/EntryRefString'
        removed_refs:
          type: array
          items:
            $ref: '#/components/schemas/EntryRefString'
          description: 'revocation_filter: refs removed relative to the base'
        export_uri:
          type: string
          maxLength: 1100
        requester_principal_id:
          type: string
        replay_of_job_id:
          type: string
          pattern: ^job_[0-9a-hjkmnp-tv-z]{26}$
        scope_tenant_id:
          $ref: '#/components/schemas/TenantId'
      description: job_id and ordinal are absent for mode eval_prepare (no binding).
    Snapshot:
      $ref: ../schemas/memory-snapshot-export.schema.json
    SelectRequest:
      type: object
      additionalProperties: false
      required:
      - job_id
      - run_id
      - role
      - cli
      - model
      - node_key
      - cycle
      - budget_tokens
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        run_id:
          $ref: '#/components/schemas/RunId'
        role:
          type: string
          enum:
          - planner
          - implementer
          - qa
          - reviewer
          - repair
          - takeover
          - eval
        cli:
          type: string
          enum:
          - claude-code
          - claude-agent-sdk
          - codex
        model:
          type: string
          maxLength: 200
        node_key:
          type: string
          maxLength: 41
        cycle:
          type: integer
          minimum: 0
        budget_tokens:
          type: integer
          minimum: 0
        paths:
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 1024
        languages:
          type: array
          items:
            type: string
        task_text:
          type: string
          maxLength: 20000
          description: Used only for relevance ranking; never stored (its sha256 is)
        artifact_key:
          type: string
          maxLength: 1024
        ordinal:
          type: integer
          minimum: 1
    JobMemoryView:
      type: object
      required:
      - job_id
      - snapshots
      - entries
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        snapshots:
          type: array
          items:
            type: object
            properties:
              memory_snapshot_id:
                type: string
              reason:
                type: string
              created_at:
                type: string
                format: date-time
        entries:
          type: array
          items:
            type: object
            required:
            - ref
            - memory_type
            - scope
            - statement
            - how_used
            - current_state
            properties:
              ref:
                $ref: '#/components/schemas/EntryRefString'
              memory_type:
                $ref: '#/components/schemas/MemoryType'
              scope:
                type: string
              title:
                type: string
              statement:
                type: string
              how_used:
                type: string
                enum:
                - injected
                - retrieved
              runs:
                type: array
                items:
                  $ref: '#/components/schemas/RunId'
              curated:
                type: boolean
              current_state:
                $ref: '#/components/schemas/EntryState'
              source:
                type: object
                properties:
                  kind:
                    type: string
                  url:
                    type: string
                    description: present only when the viewer can read the source repository
                  repository_hidden:
                    type: boolean
    CandidateDecisions:
      type: object
      required:
      - decisions
      properties:
        decisions:
          type: array
          items:
            type: object
            required:
            - index
            - decision
            properties:
              index:
                type: integer
                minimum: 0
              decision:
                type: string
                enum:
                - not_generalizable
                - candidate_created
                - evidence_merged
                - blocked_safety
                - blocked_author
                - blocked_identity
                - opted_out
                - conflict_opened
                - rate_limited
                - superseded_edit
              entry_id:
                $ref: '#/components/schemas/EntryId'
              conflict_id:
                type: string
              state:
                $ref: '#/components/schemas/EntryState'
              safety_rules:
                type: array
                items:
                  type: string
    EpisodeRequest:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - job_id
      - repo
      - workflow_type
      - outcome
      - facts
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        job_id:
          $ref: '#/components/schemas/JobId'
        repo:
          type: string
        workflow_type:
          type: string
        outcome:
          type: string
          enum:
          - merged
          - closed_unmerged
          - failed
          - cancelled
          - taken_over
          - no_change
        facts:
          description: Replicant-derived structured facts (never model text).
          type: object
          properties:
            pr_url:
              type: string
            review_rounds:
              type: integer
            files:
              type: array
              items:
                type: string
            reviewer_comment_ids:
              type: array
              items:
                type: integer
            qa_first_pass:
              type: boolean
            failure_reason:
              type: string
        reviewer_topic_keys:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 128
          description: 'Triage topic keys (subject_key vocabulary). No free text: the summary is templated from
            facts (R2-008)'
      description: Facts only. memory-service renders the episode statement from a fixed template; no model-written
        or comment text is stored. Episodes of jobs whose PR did not merge are recorded for outcome statistics but
        are never retrievable.
    OutcomeRequest:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - job_id
      - repo
      - workflow_type
      - release_bundle_id
      - terminal_status
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        job_id:
          $ref: '#/components/schemas/JobId'
        repo:
          type: string
        workflow_type:
          type: string
        release_bundle_id:
          type: string
        terminal_status:
          type: string
          enum:
          - succeeded
          - failed
          - cancelled
          - rejected
          - expired
          - taken_over
        pr_merged:
          type: boolean
        review_rounds:
          type: integer
          minimum: 0
        changes_requested_reviews:
          type: integer
          minimum: 0
        human_comment_count:
          type: integer
          minimum: 0
        first_pass_qa:
          type: boolean
        first_review_approved:
          type: boolean
        seconds_to_merge:
          type: integer
          minimum: 0
        merged_at:
          type: string
          format: date-time
          description: 'PR merge time (XD-W2-06-01): exposed per job in memory.v_job_outcomes'
        release_cohort:
          type: string
          enum: [default, candidate, holdback, experiment, override, migrated, eval, shadow]
          description: 'Label for replicant_jobs_post_merge_reverted_total (XD-W2-06-04)'
        merged_head_sha:
          type: string
          pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
        addressed_candidates:
          description: 'For each candidate created from this job: was the commit that applied it still present in
            the merged PR (computed by activity memory.record_outcome from the GitHub compare API through github-integration)?
            Required for auto-activation (governance auto_activation.*.require_fix_in_merged_diff).'
          type: array
          maxItems: 50
          items:
            type: object
            required:
            - entry_id
            - fix_commit_sha
            - fix_present_in_merge
            properties:
              entry_id:
                $ref: '#/components/schemas/EntryId'
              fix_commit_sha:
                type: string
                pattern: ^[0-9a-f]{40}([0-9a-f]{24})?$
              fix_present_in_merge:
                type: boolean
              reviewer_objected:
                type: boolean
                description: A later authorized review comment contradicted the fix
    FeedbackSignals:
      type: object
      additionalProperties: false
      required:
      - tenant_id
      - job_id
      - signals
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        job_id:
          $ref: '#/components/schemas/JobId'
        signals:
          type: array
          maxItems: 200
          items:
