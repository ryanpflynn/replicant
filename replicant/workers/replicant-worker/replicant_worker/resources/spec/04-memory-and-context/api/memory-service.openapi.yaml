            $ref: '#/components/schemas/UserId'
        selector:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            job_ids:
              type: array
              maxItems: 10000
              items:
                $ref: '#/components/schemas/JobId'
            rule_ids:
              type: array
              maxItems: 50
              items:
                type: string
                maxLength: 100
              description: WS-08 redaction rule IDs to re-run over entry text
            window:
              type: object
              properties:
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
    OutcomeReport:
      type: object
      additionalProperties: false
      description: Internal, service-to-service only (R1V-047). Browsers never send this shape. control-plane-api
        accepts the public OutcomeReportInput {kind wrong_fix|regression, evidence_url?, note?} and fills tenant_id,
        job_id, source ui, reporter_principal_id (the authenticated caller) and dedupe_key ui:<principal>:<job_id>:<kind>.
        memory-service enforces caller and source pairs. control-plane-api may send only source ui with kind wrong_fix
        or regression. github-integration sends pr_command, linked_bug and revert_detector. kind reverted is accepted
        only with source revert_detector. Any other pair returns 403 source_not_allowed_for_caller
      required:
      - tenant_id
      - job_id
      - kind
      - source
      - reporter_principal_id
      - dedupe_key
      properties:
        tenant_id:
          $ref: '#/components/schemas/TenantId'
        job_id:
          $ref: '#/components/schemas/JobId'
        kind:
          type: string
          enum:
          - wrong_fix
          - regression
          - reverted
        source:
          type: string
          enum:
          - ui
          - pr_command
          - revert_detector
          - linked_bug
        reporter_principal_id:
          type: string
          pattern: ^(usr_[0-9a-hjkmnp-tv-z]{26}|svc_[a-z][a-z0-9-]{2,40})$
        evidence_url:
          type: string
          maxLength: 2048
          pattern: ^https://
        note:
          type: string
          maxLength: 1000
        dedupe_key:
          type: string
          maxLength: 256
          examples:
          - revert:R_kgDOK2a9Xw:1502
          - ui:usr_01knk8dfr0fvjc7v0b9vhvkzbp:job_01m5p7x7r0bt69j0h0fbxepw90:wrong_fix
    FlagRequest:
      type: object
      additionalProperties: false
      required:
      - reason_code
      properties:
        reason_code:
          type: string
          enum:
          - wrong
          - outdated
          - too_broad
          - harmful
          - unsafe
          - other
        note:
          type: string
          maxLength: 500
    CorrectionRequest:
      type: object
      additionalProperties: false
      required:
      - reason_code
      - source
      - requester_role
      properties:
        reason_code:
          type: string
          enum:
          - misread_comment
          - too_broad
          - wrong
          - outdated
          - other
        note:
          type: string
          maxLength: 500
        source:
          type: string
          enum:
          - pr_command
          - ui_public_view
        requester_role:
          type: string
          enum:
          - author
          - codeowner
          description: Set by the calling service, never by an end user (R1V-048). control-plane-api sets it from its public
            CorrectionRequestInput {reason_code, note?}. github-integration sets it for /replicant memory-wrong. memory-service
            re-verifies `author` against provenance. `codeowner` is accepted only when the caller is github-integration, or
            control-plane-api after github-integration verified CODEOWNERS and team membership
        github_comment_id:
          type: integer
          minimum: 1
    Flag:
