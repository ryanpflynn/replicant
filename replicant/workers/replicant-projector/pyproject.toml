[project]
name = "replicant-projector"
version = "0.1.0"
description = "replicant-projector: projection.apply (C-STATE §2) into jobs_read and approvals; queue replicant-projections"
requires-python = ">=3.12,<3.13"
dependencies = [
  "replicant-telemetry",
  "replicant-temporal",
  "temporalio==1.34.0",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "jsonschema>=4.23",
]

[project.scripts]
replicant-projector = "replicant_projector.cli:main"

[tool.uv.sources]
replicant-telemetry = { workspace = true }
replicant-temporal = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["replicant_projector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
